  <meta charset="UTF-8">

  <title>ENFORCEMENT_TERMINAL_v23.2_OFFICIAL</title>
  <style>
      :root {
          --bg: #0a0a0c; --panel: #1a1a1f; --accent: #00f2ff;
          --success: #00ff9d; --danger: #ff0044; --warning: #ffcc00;
          --police: #00d9ff; --ems: #ff4757; --fire: #ffa502;
      }
      body {
          background-color: var(--bg); color: #eee; font-family: 'Courier New', monospace;
          margin: 0; overflow: hidden; height: 100vh;
      }
      .stats-bar {
          background: #000; display: flex; justify-content: space-around; padding: 12px;
          border-bottom: 3px solid var(--accent); font-weight: bold; color: var(--accent);
          font-size: 0.8rem; flex-wrap: wrap; gap: 10px;
      }
      .dashboard {
          display: grid; grid-template-columns: 1fr 380px; grid-template-rows: 200px 1fr; 
          gap: 15px; padding: 15px; height: calc(100vh - 60px);
      }
      .view-panel { 
          background: #050505; border: 4px solid #222; position: relative; overflow: hidden; 
      }
      .view-panel::after {
          content: ' '; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
          background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
          z-index: 2; background-size: 100% 2px, 3px 100%; pointer-events: none;
      }
      .road { 
          width: 100%; height: 50px; background: #111; position: absolute; bottom: 20px; border-top: 2px solid #333; 
      }
      .road-line {
          width: 100%; height: 100%;
          background: repeating-linear-gradient(90deg, #ffcc00 0, #ffcc00 40px, transparent 40px, transparent 80px);
          opacity: 0.3;
      }
      .vehicle { 
          width: 140px; height: 50px; background: #3d3d3d; position: absolute; bottom: 28px; left: -250px; 
          transition: left 1.2s ease-in-out; border: 2px solid #555; display: flex; align-items: center; 
          justify-content: center; font-weight: bold; font-size: 0.9rem; z-index: 3;
      }
      .vehicle.criminal-alert { animation: pulseDanger 0.5s infinite; }
      .vehicle.emergency-vehicle { border-color: var(--warning); box-shadow: 0 0 20px var(--warning); }
      .vehicle.agency-police { border-color: var(--police); box-shadow: 0 0 25px var(--police); background: #0a2530; }
      .vehicle.agency-ems { border-color: var(--ems); box-shadow: 0 0 25px var(--ems); background: #300a15; }
      .vehicle.agency-fire { border-color: var(--fire); box-shadow: 0 0 25px var(--fire); background: #30200a; }
      .vehicle.agency-multi { 
          border-color: var(--danger); box-shadow: 0 0 30px var(--police), 0 0 60px var(--ems), 0 0 90px var(--fire); 
          animation: multiAgencyPulse 1s infinite; background: #1a1a1a;
      }
      @keyframes pulseDanger {
          0% { border-color: var(--danger); box-shadow: 0 0 10px var(--danger); }
          50% { border-color: transparent; box-shadow: none; }
          100% { border-color: var(--danger); box-shadow: 0 0 10px var(--danger); }
      }
      @keyframes multiAgencyPulse {
          0% { border-color: var(--police); box-shadow: 0 0 30px var(--police); }
          33% { border-color: var(--ems); box-shadow: 0 0 30px var(--ems); }
          66% { border-color: var(--fire); box-shadow: 0 0 30px var(--fire); }
          100% { border-color: var(--police); box-shadow: 0 0 30px var(--police); }
      }
      #scanEffect {
          position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: var(--accent);
          opacity: 0; z-index: 4; pointer-events: none; transition: opacity 0.2s;
      }
      #scanEffect.active { animation: scanFlash 0.6s ease-out; }
      @keyframes scanFlash { 0% { opacity: 0.4; } 100% { opacity: 0; } }
      #docOverlay {
          position: absolute; top: 100px; left: 40px; width: 340px; max-width: 90vw; background: #e0e0e0; 
          padding: 20px; color: #111; border: 3px solid var(--accent); z-index: 1000; display: none; 
          cursor: move; box-shadow: 0 10px 50px rgba(0,0,0,0.9); user-select: none; touch-action: none;
      }
      .doc-header { background: #222; color: #fff; padding: 6px; margin: -20px -20px 15px -20px; font-size: 0.6rem; text-align: center; font-weight: bold; }
      .photo-area { 
          width: 90px; height: 110px; border: 2px solid #111; background: #ccc; font-size: 3.5rem; 
          display: flex; align-items: center; justify-content: center; margin-bottom: 15px; 
      }
      .verification-unit { 
          grid-column: 1 / -1; display: flex; gap: 15px; background: #000; padding: 20px; 
          border: 1px solid #333; flex-wrap: wrap; min-height: 120px; align-items: center; 
      }
      .input-group { flex: 1; min-width: 150px; }
      .input-group label { display: block; font-size: 0.7rem; color: var(--accent); margin-bottom: 8px; }
      .input-group input { 
          width: 100%; background: #111; border: 1px solid #444; color: var(--success); padding: 15px; 
          box-sizing: border-box; font-size: 1.4rem; font-family: monospace; outline: none; 
      }
      .control-panel { 
          background: var(--panel); border: 2px solid #333; padding: 20px; display: grid; 
          grid-template-columns: 1fr 1fr; gap: 12px; overflow-y: auto;
      }
      .mech-btn { 
          background: linear-gradient(180deg, #444 0%, #222 100%); border: 2px solid #000; color: #fff; 
          padding: 15px; cursor: pointer; text-transform: uppercase; font-size: 0.7rem; font-weight: bold; 
          box-shadow: 0 4px #000; transition: all 0.1s; font-family: monospace;
      }
      .mech-btn:active { transform: translateY(2px); box-shadow: 0 1px #000; }
      .mech-btn:disabled { opacity: 0.2; cursor: not-allowed; transform: none; box-shadow: none; }
      
      .btn-emergency {
          grid-column: 1 / -1; 
          background: linear-gradient(145deg, #ff0044, #99002a); 
          color: #fff; font-size: 1rem; letter-spacing: 2px;
          border: 3px solid var(--warning);
          display: none; 
      }
      .btn-emergency.active {
          display: block; 
          animation: emergencyPulse 0.8s infinite;
      }
      @keyframes emergencyPulse {
          0% { box-shadow: 0 0 10px var(--danger); border-color: var(--warning); }
          50% { box-shadow: 0 0 30px var(--danger); border-color: var(--danger); background: linear-gradient(145deg, #ff4757, #cc0033); }
          100% { box-shadow: 0 0 10px var(--danger); border-color: var(--warning); }
      }

      .sidebar { 
          grid-row: 1/3; display: flex; flex-direction: column; background: #111; padding: 15px; 
          border-left: 2px solid #333; overflow: hidden;
      }
      .log-box { 
          flex: 1; background: #000; border: 1px solid #222; padding: 10px; font-size: 0.7rem; 
          color: #0f0; overflow-y: auto; border-radius: 4px; min-height: 0;
      }
      .wanted-list { 
          background: #2a0a0a; border: 2px solid var(--danger); padding: 12px; margin-top: 15px; 
          font-size: 0.75rem; color: var(--danger); flex-shrink: 0; max-height: 200px; overflow-y: auto;
      }
      .wanted-plate-item { padding: 4px 0; border-bottom: 1px dashed rgba(255, 0, 68, 0.3); }
      .stamp { 
          position: absolute; bottom: 40px; right: 10px; width: 160px; height: 70px; border: 5px solid; 
          display: none; align-items: center; justify-content: center; font-size: 1.3rem; font-weight: 900; 
          transform: rotate(-12deg); pointer-events: none; 
      }
      .forgery-warning { color: var(--danger); font-size: 0.6rem; font-weight: bold; margin-top: 5px; display: none; }
      .agency-tags { display: flex; gap: 5px; margin-top: 5px; }
      .agency-tag { font-size: 0.55rem; padding: 2px 6px; border-radius: 2px; font-weight: bold; }
      .tag-police { background: rgba(0,217,255,0.2); color: var(--police); border: 1px solid var(--police); }
      .tag-ems { background: rgba(255,71,87,0.2); color: var(--ems); border: 1px solid var(--ems); }
      .tag-fire { background: rgba(255,165,2,0.2); color: var(--fire); border: 1px solid var(--fire); }
      
      @media (max-width: 1024px) { .dashboard { grid-template-columns: 1fr 300px; } }
      @media (max-width: 800px) {
          body { overflow: auto; height: auto; }
          .dashboard { grid-template-columns: 1fr; grid-template-rows: 180px auto auto; height: auto; padding-bottom: 50px; }
          .sidebar { grid-row: auto; border-left: none; border-top: 2px solid #333; max-height: 300px; }
      }
  </style>
</head>

</div>

<div class="dashboard">
  <div class="view-panel">
      <div style="padding:10px; color:var(--danger); font-size: 0.6rem; letter-spacing: 1px; z-index: 5; position: relative;">● LIVE_GATE_FEED // UNIT_01</div>
      <div id="scanEffect"></div>
      <div class="road"><div class="road-line"></div></div>
      <div id="vSprite" class="vehicle"></div>
  </div>

  <div class="sidebar">
      <div id="log" class="log-box"></div>
      <div class="wanted-list">
          <strong style="text-decoration: underline;">[!] APB: WANTED_LIST</strong><br><br>

  </div>

      <button class="mech-btn" onclick="stampDoc(false)" style="background:var(--danger); flex:1; padding:10px;">DENY</button>

<script>
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination); const t = audioCtx.currentTime;
      switch(type) {
          case 'engine': osc.type='sawtooth'; osc.frequency.setValueAtTime(80,t); osc.frequency.exponentialRampToValueAtTime(40,t+0.8); gain.gain.setValueAtTime(0.2,t); gain.gain.exponentialRampToValueAtTime(0.01,t+0.8); osc.start(t); osc.stop(t+0.8); break;
          case 'success': osc.type='sine'; osc.frequency.setValueAtTime(600,t); osc.frequency.setValueAtTime(800,t+0.1); gain.gain.setValueAtTime(0.2,t); gain.gain.exponentialRampToValueAtTime(0.01,t+0.2); osc.start(t); osc.stop(t+0.2); break;
          case 'error': osc.type='square'; osc.frequency.setValueAtTime(150,t); gain.gain.setValueAtTime(0.3,t); gain.gain.exponentialRampToValueAtTime(0.01,t+0.4); osc.start(t); osc.stop(t+0.4); break;
          case 'cash': osc.type='sine'; osc.frequency.setValueAtTime(1200,t); osc.frequency.setValueAtTime(1600,t+0.05); osc.frequency.setValueAtTime(2000,t+0.1); gain.gain.setValueAtTime(0.2,t); gain.gain.exponentialRampToValueAtTime(0.01,t+0.2); osc.start(t); osc.stop(t+0.2); break;
          case 'stamp': osc.type='triangle'; osc.frequency.setValueAtTime(300,t); gain.gain.setValueAtTime(0.5,t); gain.gain.exponentialRampToValueAtTime(0.01,t+0.1); osc.start(t); osc.stop(t+0.1); break;
          case 'buzzer': osc.type='square'; osc.frequency.setValueAtTime(200,t); gain.gain.setValueAtTime(0.3,t); gain.gain.exponentialRampToValueAtTime(0.01,t+0.3); osc.start(t); osc.stop(t+0.3); break;
          case 'arrest': osc.type='sawtooth'; osc.frequency.setValueAtTime(400,t); osc.frequency.setValueAtTime(500,t+0.2); osc.frequency.setValueAtTime(400,t+0.4); gain.gain.setValueAtTime(0.3,t); gain.gain.exponentialRampToValueAtTime(0.01,t+0.5); osc.start(t); osc.stop(t+0.5); break;
          case 'gate': osc.type='sine'; osc.frequency.setValueAtTime(400,t); osc.frequency.exponentialRampToValueAtTime(1200,t+0.3); gain.gain.setValueAtTime(0.2,t); gain.gain.exponentialRampToValueAtTime(0.01,t+0.4); osc.start(t); osc.stop(t+0.4); break;
          case 'emergency': osc.type='sawtooth'; osc.frequency.setValueAtTime(600,t); osc.frequency.setValueAtTime(900,t+0.2); osc.frequency.setValueAtTime(600,t+0.4); osc.frequency.setValueAtTime(900,t+0.6); gain.gain.setValueAtTime(0.4,t); gain.gain.exponentialRampToValueAtTime(0.01,t+0.8); osc.start(t); osc.stop(t+0.8); break;
      }
  }

  let sirenInterval=null, sirenOsc=null, sirenGain=null;
  function playSirenSound() {
      if(sirenInterval) return; sirenOsc=audioCtx.createOscillator(); sirenGain=audioCtx.createGain();
      sirenOsc.connect(sirenGain); sirenGain.connect(audioCtx.destination); sirenOsc.type='sawtooth';
      sirenGain.gain.setValueAtTime(0.15,audioCtx.currentTime); sirenOsc.start(); let isHigh=false;
      sirenInterval=setInterval(()=>{if(!sirenOsc)return;isHigh=!isHigh;sirenOsc.frequency.setValueAtTime(isHigh?900:600,audioCtx.currentTime);},250);
  }
  function stopSirenSound() {
      if(!sirenInterval)return; clearInterval(sirenInterval); sirenInterval=null;
      if(sirenOsc){sirenGain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.1);sirenOsc.stop(audioCtx.currentTime+0.1);sirenOsc=null;sirenGain=null;}
  }

  let emergencyAlarmInterval=null;
  function playEmergencyAlarm(){
      if(emergencyAlarmInterval)return;
      playSound('emergency');
      emergencyAlarmInterval=setInterval(()=>{playSound('emergency');},1500);
  }
  function stopEmergencyAlarm(){
      if(emergencyAlarmInterval){clearInterval(emergencyAlarmInterval);emergencyAlarmInterval=null;}
  }

  let car=null, revenue=0, valids=0, missed=0, level=1, rankPoints=0, wantedPlates=[], isResetting=false, isScanning=false;
  let history = []; 
  let sharedData = { revenue: 0, valids: 0, missed: 0, level: 1, rankPoints: 0, history: [], registry: {}, forgedAliases: {}, nextSpawnOverride: null, activeInmates: [], releasedInmates: [], ledgerCashouts: [], intelFlags: [], paroleRecords: [], iaViolations: [], rehabPrograms: [], call911Logs: [] };

  function loadData() {
      const savedData = localStorage.getItem('enforcementTerminalV23');
      if (savedData) {
          try {
              const data = JSON.parse(savedData);
              revenue = data.revenue || 0; valids = data.valids || 0; missed = data.missed || 0;
              level = data.level || 1; rankPoints = data.rankPoints || 0; history = data.history || [];
              sharedData = data; 
              if(!sharedData.registry) sharedData.registry = {};
              if(!sharedData.forgedAliases) sharedData.forgedAliases = {};
              if(sharedData.nextSpawnOverride === undefined) sharedData.nextSpawnOverride = null;
              if(!sharedData.activeInmates) sharedData.activeInmates = [];
              if(!sharedData.releasedInmates) sharedData.releasedInmates = [];
              if(!sharedData.ledgerCashouts) sharedData.ledgerCashouts = [];
              if(!sharedData.intelFlags) sharedData.intelFlags = [];
              if(!sharedData.paroleRecords) sharedData.paroleRecords = [];
              if(!sharedData.iaViolations) sharedData.iaViolations = [];
              if(!sharedData.rehabPrograms) sharedData.rehabPrograms = [];
              if(!sharedData.call911Logs) sharedData.call911Logs = [];
              
              checkEmergencyDispatch();
          } catch (e) { console.error("Corrupted save data, resetting."); }
      }
      updateStatusUI();
      addLog("System initialized. Data loaded.", "var(--accent)");
  }

  function saveData() {
      const finalData = { revenue, valids, missed, level, rankPoints, history, registry: sharedData.registry, forgedAliases: sharedData.forgedAliases, nextSpawnOverride: sharedData.nextSpawnOverride, activeInmates: sharedData.activeInmates, releasedInmates: sharedData.releasedInmates, ledgerCashouts: sharedData.ledgerCashouts, intelFlags: sharedData.intelFlags, paroleRecords: sharedData.paroleRecords, iaViolations: sharedData.iaViolations, rehabPrograms: sharedData.rehabPrograms, call911Logs: sharedData.call911Logs };
      localStorage.setItem('enforcementTerminalV23', JSON.stringify(finalData));
  }

  setInterval(() => {
      const savedData = localStorage.getItem('enforcementTerminalV23');
      if (savedData) {
          try {
              const data = JSON.parse(savedData);
              if(data.revenue !== revenue || data.valids !== valids || JSON.stringify(data.registry) !== JSON.stringify(sharedData.registry) || data.nextSpawnOverride !== sharedData.nextSpawnOverride || data.activeInmates.length !== sharedData.activeInmates.length || (data.call911Logs||[]).length !== sharedData.call911Logs.length) {
                  revenue = data.revenue; valids = data.valids; missed = data.missed;
                  level = data.level; rankPoints = data.rankPoints; history = data.history || [];
                  sharedData = data;
                  if(!sharedData.call911Logs) sharedData.call911Logs = [];
                  updateStatusUI();
                  addLog("SYNC: Data updated from Network.", "var(--accent)");
                  checkEmergencyDispatch();
              }
          } catch(e) {}
      }
  }, 2000);

  let emergencyActive = false;
  
  function checkEmergencyDispatch(){
      const override = sharedData.nextSpawnOverride;
      if(override && !override.startsWith("HOLD-") && sharedData.registry[override]){
          const reg = sharedData.registry[override];
          if(reg.registeredBy === "911_OPERATOR" || reg.source === "911_DISPATCH"){
              if(!emergencyActive){
                  emergencyActive = true;
                  document.getElementById('btnEmergency').classList.add('active');
                  playEmergencyAlarm();
                  addLog("⚠ PRIORITY 1: 911 EMERGENCY DISPATCH RECEIVED!", "var(--danger)");
              }
              return;
          }
      }
      
      if(override && override.startsWith("HOLD-")){
          // Patrol dispatch from Dashboard 16 - auto-spawn without emergency alarm
          if(!emergencyActive && car === null && !isResetting){
              addLog("⚠ PATROL DISPATCH: Incoming rogue vehicle.", "var(--warning)");
              // Let normal spawn handle it
          }
      }
      
      if(emergencyActive && (!override || override.startsWith("HOLD-"))){
          emergencyActive = false;
          document.getElementById('btnEmergency').classList.remove('active');
          stopEmergencyAlarm();
      }
  }

  function get911AgencyUnits(){
      const logs = sharedData.call911Logs || [];
      const dispatched = logs.filter(l => l.status === 'DISPATCHED');
      if(dispatched.length > 0){
          const latest = dispatched[dispatched.length - 1];
          return latest.dispatchedUnits || ['POLICE'];
      }
      return ['POLICE'];
  }

  function acceptEmergencyDispatch(){
      if(!emergencyActive) return;
      stopEmergencyAlarm();
      playSound('gate');
      const agencies = get911AgencyUnits();
      const agencyStr = agencies.join(' + ');
      addLog(`OFFICER ACKNOWLEDGED. ${agencyStr} pulling to gate NOW.`, "var(--warning)");
      spawnVehicle(); 
  }

  function addLog(msg, color) {
      const log = document.getElementById('log'); const entry = document.createElement('div');
      entry.style.color = color || "#0f0"; entry.style.marginBottom = "5px";
      entry.innerText = `> ${msg}`; log.prepend(entry);
  }

  function refreshAPBList() {
      const prefixes = ["PX","NX","TX","DV","CR","XR","ZK","AV","BN"]; wantedPlates = [];
      const count = 3 + Math.floor(Math.random() * 3); 
      for(let i=0; i<count; i++) { const prefix=prefixes[Math.floor(Math.random()*prefixes.length)]; const num=Math.floor(1000+Math.random()*9000); wantedPlates.push(`${prefix}-${num}`); }
      const box = document.getElementById('wantedPlateBox'); box.innerHTML = '';
      wantedPlates.forEach(plate => { const div = document.createElement('div'); div.className='wanted-plate-item'; div.innerText=plate; box.appendChild(div); });
  }

  function spawnVehicle() {
      if(car || isResetting) return; playSound('engine');
      if(Math.random() < 0.4 || wantedPlates.length === 0) refreshAPBList();
      
      let customSpawn = null;
      let isForgedAlias = false;
      let isPatrolDispatch = false;
      let is911Emergency = false;
      let dispatchedAgencies = [];

      if (sharedData.nextSpawnOverride) {
          customSpawn = sharedData.registry[sharedData.nextSpawnOverride];
          if(customSpawn) {
              customSpawn.plate = sharedData.nextSpawnOverride;
              
              if(customSpawn.registeredBy === "911_OPERATOR" || customSpawn.source === "911_DISPATCH"){
                  is911Emergency = true;
                  dispatchedAgencies = get911AgencyUnits();
                  const agencyStr = dispatchedAgencies.join(' + ');
                  addLog(`🚨 911 EMERGENCY: ${agencyStr} UNIT INCOMING!`, "var(--danger)");
                  
                  // Mark the 911 log as ARRIVED
                  const logs = sharedData.call911Logs || [];
                  const dispatched = logs.filter(l => l.status === 'DISPATCHED');
                  if(dispatched.length > 0){
                      dispatched[dispatched.length-1].status = 'ARRIVED';
                      dispatched[dispatched.length-1].arrivedAt = new Date().toLocaleTimeString();
                  }
                  
              } else if (customSpawn.registeredBy === "PATROL_DISPATCH" || customSpawn.registeredBy === "NHAI_PATROL_DISPATCH") {
                  isPatrolDispatch = true;
                  dispatchedAgencies = ['POLICE'];
                  addLog(`⚠ PRIORITY OVERRIDE: Incoming Patrol Dispatch.`, "var(--danger)");
              } else {
                  addLog(`⚠ PRIORITY OVERRIDE: Intercepted Vehicle.`, "var(--warning)");
                  dispatchedAgencies = ['POLICE'];
              }
          }
          sharedData.nextSpawnOverride = null; saveData();
          checkEmergencyDispatch(); // Clear alarm since we spawned it
      }

      if (!is911Emergency && !isPatrolDispatch && sharedData.registry && Object.keys(sharedData.registry).length > 0) {
          if (Math.random() < 0.4) { 
              const regPlates = Object.keys(sharedData.registry);
              const randomPlate = regPlates[Math.floor(Math.random() * regPlates.length)];
              customSpawn = sharedData.registry[randomPlate];
              customSpawn.plate = randomPlate; 
              if(sharedData.forgedAliases && sharedData.forgedAliases[randomPlate]) {
                  isForgedAlias = true;
                  customSpawn.realWantedPlate = sharedData.forgedAliases[randomPlate].realPlate;
              }
          }
      }

      const prefixes = ["PX","NX","TX","DV","CR","XR","ZK","AV","BN"]; 
      let isCriminal, plate, isWanted, sex, photo, isForged, expiry, id, hasMissingID, realWantedPlate;

      if (customSpawn) {
          plate = customSpawn.plate; id = customSpawn.id;
          isWanted = customSpawn.status === 'WANTED'; isCriminal = isWanted;
          hasMissingID = id === "MISSING" || id === "911_REPORT"; isForged = false; 
          realWantedPlate = customSpawn.realWantedPlate || null;
          
          if(isForgedAlias) addLog(`DATABASE REGISTRY: Forged Alias detected in stream.`, "var(--danger)");
          else if (!is911Emergency && !isPatrolDispatch) addLog(`DATABASE REGISTRY: Custom vehicle detected.`, "var(--warning)");

          sex = Math.random() > 0.5 ? "MALE" : "FEMALE"; photo = sex === "MALE" ? "👨" : "👩"; expiry = isCriminal ? "2023" : "2034";
      } else {
          isCriminal = Math.random() < 0.5;
          plate = prefixes[Math.floor(Math.random()*prefixes.length)] + "-" + Math.floor(1000+Math.random()*9000); isWanted = false;
          if(Math.random() < 0.3 && wantedPlates.length > 0) { plate = wantedPlates[Math.floor(Math.random()*wantedPlates.length)]; isWanted = true; }
          sex = Math.random() > 0.5 ? "MALE" : "FEMALE"; photo = sex === "MALE" ? "👨" : "👩"; isForged = false;
          if (isCriminal && Math.random() < 0.4) { isForged = true; photo = sex === "MALE" ? "👩" : "👨"; }
          id = (isCriminal && Math.random() < 0.3) ? "MISSING" : "DL-" + Math.floor(1000+Math.random()*9000);
          hasMissingID = (isCriminal && Math.random() < 0.3); expiry = (isCriminal && Math.random() < 0.5) ? "2023" : "2034"; realWantedPlate = null;
      }

      car = {
          plate: plate, id: id, hasMissingID: hasMissingID, expired: isCriminal && Math.random() < 0.5, 
          isWanted: isWanted, isForged: isForged, expiry: expiry, photo: photo, sex: sex, realWantedPlate: realWantedPlate,
          is911Emergency: is911Emergency, isPatrolDispatch: isPatrolDispatch, dispatchedAgencies: dispatchedAgencies
      };

      const sprite = document.getElementById('vSprite'); 
      
      let vehicleClass = 'vehicle';
      if(is911Emergency || isPatrolDispatch){
          if(dispatchedAgencies.length >= 2){
              vehicleClass += ' agency-multi';
          } else if(dispatchedAgencies.includes('EMS')){
              vehicleClass += ' agency-ems';
          } else if(dispatchedAgencies.includes('FIRE')){
              vehicleClass += ' agency-fire';
          } else {
              vehicleClass += ' agency-police';
          }
      }
      
      sprite.className = vehicleClass;
      sprite.style.transition="none"; sprite.style.left="-250px"; void sprite.offsetWidth; 
      sprite.style.transition="left 1.2s ease-in-out"; sprite.style.left="35%"; sprite.innerText=car.plate;
      
      document.getElementById('btnNext').disabled=true; document.getElementById('btnScan').disabled=false; document.getElementById('btnDocs').disabled=false;
      addLog(`Incoming: ${car.plate}. Inspection required.`);
      
      if(is911Emergency || isPatrolDispatch){
          playSirenSound();
      }
  }

  function toggleDocs() {
      const doc = document.getElementById('docOverlay');
      if(doc.style.display === "block") { doc.style.display = "none"; } else {
          if(!car) return;
          document.getElementById('dID').innerText=car.id; document.getElementById('dExp').innerText=car.expiry;
          document.getElementById('dName').innerText="SUBJECT_"+car.plate; document.getElementById('dSex').innerText=car.sex;
          document.getElementById('dPhoto').innerText=car.photo; 
          const forgeryBox = document.getElementById('forgeryBox');
          if(car.realWantedPlate) { forgeryBox.style.display = "block"; document.getElementById('dRealPlate').innerText = car.realWantedPlate; } 
          else { forgeryBox.style.display = "none"; }
          
          const agencyBox = document.getElementById('agencyTagsBox');
          if((car.is911Emergency || car.isPatrolDispatch) && car.dispatchedAgencies && car.dispatchedAgencies.length > 0){
              agencyBox.style.display = 'flex';
              agencyBox.innerHTML = '';
              car.dispatchedAgencies.forEach(u => {
                  const cls = u === 'POLICE' ? 'tag-police' : u === 'EMS' ? 'tag-ems' : 'tag-fire';
                  agencyBox.innerHTML += `<span class="agency-tag ${cls}">${u}</span>`;
              });
          } else {
              agencyBox.style.display = 'none';
          }
          
          doc.style.display="block";
          addLog(`Credentials visible. Copy to verification unit.`, "var(--accent)");
      }
  }

  function runSystemScan() {
      if(!car || isScanning) return;
      const pIn = (document.getElementById('plateIn').value || "").toUpperCase().trim();
      const lIn = (document.getElementById('licenseIn').value || "").toUpperCase().trim();
      document.getElementById('btnScan').disabled = true; isScanning = true;
      const scanFx = document.getElementById('scanEffect'); scanFx.classList.remove('active'); void scanFx.offsetWidth; scanFx.classList.add('active');
      addLog("Querying Intelligence Network...");
      setTimeout(() => {
          isScanning = false; document.getElementById('btnScan').disabled = false; 
          if(car.realWantedPlate && pIn === car.realWantedPlate) {
              addLog("CRIMINAL ALERT: WANTED FUGITIVE PLATE DETECTED UNDER FORGED ALIAS!", "var(--danger)");
              document.getElementById('vSprite').classList.add('criminal-alert'); document.getElementById('btnArrest').disabled=false; playSirenSound(); return;
          }
          if (pIn !== car.plate || lIn !== car.id) { addLog("SCAN ERROR: INPUT DATA DISCREPANCY.", "var(--warning)"); playSound('error'); return; }
          let alertFlags = [];
          if (car.isWanted) alertFlags.push("WANTED FUGITIVE"); if (car.expired) alertFlags.push("EXPIRED CREDENTIALS");
          if (car.hasMissingID) alertFlags.push("NO RECORD FOUND"); if (car.isForged) alertFlags.push("DOCUMENT FORGERY"); 
          if (alertFlags.length > 0) {
              addLog(`CRIMINAL ALERT: ${alertFlags.join(" & ")} DETECTED.`, "var(--danger)");
              document.getElementById('vSprite').classList.add('criminal-alert'); document.getElementById('btnArrest').disabled=false; playSirenSound();
              if (!car.isWanted && !car.isForged) { document.getElementById('btnPay').disabled = false; }
          } else { addLog("SCAN SUCCESS: CITIZEN STATUS CLEAR.", "var(--success)"); playSound('success'); }
      }, 600);
  }

  function issuePaidID() {
      if(!car || car.isWanted || car.isForged || car.realWantedPlate) return; revenue += 150; const newID = "DL-NEW-" + Math.floor(1000+Math.random()*9000);
      car.id=newID; car.hasMissingID=false; car.expired=false; car.expiry="2036";
      document.getElementById('licenseIn').value=newID; document.getElementById('dID').innerText=newID; document.getElementById('dExp').innerText="2036";
      addLog(`ID RE-ISSUED: ${newID}. Infractions cleared.`, "var(--success)");
      document.getElementById('btnPay').disabled=true; document.getElementById('btnArrest').disabled=true; 
      document.getElementById('vSprite').classList.remove('criminal-alert'); stopSirenSound(); playSound('cash'); saveData(); updateStatusUI();
  }

  function stampDoc(app) {
      if(!car) return; const s = document.getElementById('stampBox'); s.innerText=app?"APPROVED":"DENIED"; s.style.color=app?"var(--success)":"var(--danger)";
      s.style.borderColor=app?"var(--success)":"var(--danger)"; s.style.display="flex";
      if (app) { addLog("MANUAL APPROVAL ISSUED.", "var(--success)"); document.getElementById('btnRelease').disabled=false; document.getElementById('btnArrest').disabled=true; playSound('stamp'); }
      else { addLog("ENTRY DENIED BY OFFICER.", "var(--danger)"); document.getElementById('btnArrest').disabled=false; document.getElementById('btnRelease').disabled=true; playSound('buzzer'); if (!car.isWanted && !car.isForged && !car.realWantedPlate) { document.getElementById('btnPay').disabled=false; } }
  }

  function triggerRelease() {
      if(!car) return; const isGuilty = car.isWanted || car.hasMissingID || car.expired || car.isForged || car.realWantedPlate; playSound('gate'); stopSirenSound();
      if (isGuilty) { missed++; rankPoints-=3; addLog("SECURITY FAILURE: Invalid subject cleared gate. [-3 Rank Points]", "var(--danger)"); }
      else { valids++; revenue+=50; rankPoints+=2; addLog("VALID RELEASE: Citizen cleared. +$50 [+2 Rank Points]", "var(--success)"); }
      history.push({ plate: car.plate, id: car.id, action: "RELEASED", timestamp: new Date().toLocaleTimeString() });
      updateLevel(); updateStatusUI(); resetStage();
  }

  function triggerArrest() {
      if(!car) return; const isGuilty = car.isWanted || car.hasMissingID || car.expired || car.isForged || car.realWantedPlate; playSound('arrest'); stopSirenSound();
      if (isGuilty) { valids++; revenue+=200; rankPoints+=2; addLog("VALID ARREST: Criminal detained. +$200 Bounty [+2 Rank Points]", "var(--success)"); }
      else { missed++; rankPoints-=3; addLog("SECURITY BREACH: Wrongful arrest of innocent citizen. [-3 Rank Points]", "var(--danger)"); }
      
      let logPlate = car.realWantedPlate ? `${car.plate} (Real: ${car.realWantedPlate})` : car.plate;
      history.push({ plate: logPlate, id: car.id, action: "ARRESTED", timestamp: new Date().toLocaleTimeString() });
      
      clearWarrantOnArrest(car.plate);
      if (car.realWantedPlate) clearWarrantOnArrest(car.realWantedPlate); 
      
      updateLevel(); updateStatusUI(); resetStage();
  }

  function clearWarrantOnArrest(plate) {
      let inmateData = null;

      if (sharedData.forgedAliases && sharedData.forgedAliases[plate]) {
          inmateData = {
              plate: plate, realPlate: sharedData.forgedAliases[plate].realPlate, id: sharedData.forgedAliases[plate].fakeId,
              offense: "FORGERY & FUGITIVE", dateArrested: new Date().toLocaleDateString(), facility: "MAXIMUM SECURITY",
              status: "ARRESTED", sentenceDays: 90, sentenceRemaining: 90
          };
          delete sharedData.forgedAliases[plate]; 
      } 
      else if (sharedData.registry[plate]) {
          const reg = sharedData.registry[plate];
          let offense = "WARRANT / ROGUE";
          let facility = "CENTRAL DETENTION";
          let sentence = 60;
          
          if(reg.registeredBy === "911_OPERATOR" || reg.source === "911_DISPATCH"){
              offense = "911 FELONY";
              facility = "FEDERAL HOLD";
              sentence = 120;
          }
          
          inmateData = {
              plate: plate, realPlate: plate, id: reg.id,
              offense: offense, dateArrested: new Date().toLocaleDateString(), facility: facility,
              status: "ARRESTED", sentenceDays: sentence, sentenceRemaining: sentence
          };
      }

      if (inmateData) {
          if(!sharedData.activeInmates) sharedData.activeInmates = [];
          sharedData.activeInmates.push(inmateData);
      }

      if (sharedData.registry[plate]) delete sharedData.registry[plate];
      saveData(); 
  }

  function updateLevel() {
      rankPoints = Math.max(0, rankPoints); const newLevel = Math.floor(rankPoints / 10) + 1;
      if (newLevel > level) { addLog(`★★★ PROMOTION: STATION RANK INCREASED TO LVL ${newLevel}! ★★★`, "var(--warning)"); }
      else if (newLevel < level) { addLog(`DEMOTION: STATION RANK DECREASED TO LVL ${newLevel}.`, "var(--danger)"); }
      level = newLevel;
  }

  function updateStatusUI() {
      document.getElementById('valCount').innerText=valids; document.getElementById('missCount').innerText=missed;
      document.getElementById('salVal').innerText=revenue; document.getElementById('lvlVal').innerText=level;
      document.getElementById('ptsVal').innerText = rankPoints % 10; saveData();
  }

  function resetStage() {
      const sprite = document.getElementById('vSprite'); sprite.style.left="120%"; 
      sprite.classList.remove('criminal-alert','emergency-vehicle','agency-police','agency-ems','agency-fire','agency-multi');
      isResetting=true; car=null;
      document.getElementById('plateIn').value=""; document.getElementById('licenseIn').value=""; 
      document.getElementById('docOverlay').style.display="none"; document.getElementById('stampBox').style.display="none"; 
      document.getElementById('forgeryBox').style.display="none"; document.getElementById('agencyTagsBox').style.display="none";
      document.getElementById('btnNext').disabled=true; document.getElementById('btnScan').disabled=true; document.getElementById('btnDocs').disabled=true;
      document.getElementById('btnArrest').disabled=true; document.getElementById('btnRelease').disabled=true; document.getElementById('btnPay').disabled=true;
      setTimeout(() => { sprite.style.transition="none"; sprite.style.left="-250px"; isResetting=false; document.getElementById('btnNext').disabled=false; }, 1300);
  }

  const docWin = document.getElementById("docOverlay"); let isDragging=false, startX=0, startY=0, translateX=0, translateY=0;
  function dragStart(e) { if (e.target.tagName==='BUTTON'||e.target.tagName==='INPUT') return; isDragging=true; const clientX=e.touches?e.touches[0].clientX:e.clientX; const clientY=e.touches?e.touches[0].clientY:e.clientY; const rect=docWin.getBoundingClientRect(); translateX=rect.left; translateY=rect.top; startX=clientX-translateX; startY=clientY-translateY; }
  function dragMove(e) { if (!isDragging) return; e.preventDefault(); const clientX=e.touches?e.touches[0].clientX:e.clientX; const clientY=e.touches?e.touches[0].clientY:e.clientY; let newX=clientX-startX; let newY=clientY-startY; const winW=window.innerWidth-docWin.offsetWidth; const winH=window.innerHeight-docWin.offsetHeight; newX=Math.max(0,Math.min(newX,winW)); newY=Math.max(0,Math.min(newY,winH)); docWin.style.left=`${newX}px`; docWin.style.top=`${newY}px`; }
  function dragEnd() { isDragging=false; }
  docWin.addEventListener('mousedown',dragStart); document.addEventListener('mousemove',dragMove); document.addEventListener('mouseup',dragEnd);
  docWin.addEventListener('touchstart',dragStart,{passive:false}); document.addEventListener('touchmove',dragMove,{passive:false}); document.addEventListener('touchend',dragEnd);

  loadData(); refreshAPBList();
</script>
</body>
