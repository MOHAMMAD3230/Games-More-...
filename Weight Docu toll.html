<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHAI MASTER v13.0 - DOCUMENT OFFICER</title>
    <style>
        :root { 
            --neon: #00d9ff; --error: #ff4757; --success: #2ed573; 
            --gold: #ffa502; --frame-bg: #222; --body-bg: #050505;
            --screen-bg: #000b1a; --bribe: #ff9ff3; --paper: #f1f2f6;
        }

        * { box-sizing: border-box; font-family: 'Courier New', monospace; }
        body { background: var(--body-bg); color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 10px; overflow: hidden; }

        .console-unit { 
            background: var(--frame-bg); padding: 15px; border-radius: 12px; 
            border: 10px solid #111; box-shadow: 0 0 80px #000; width: 100%; max-width: 1250px;
            display: flex; flex-direction: column; gap: 12px; position: relative;
        }

        .header-bar { display: flex; justify-content: space-between; font-size: 10px; border-bottom: 2px solid #444; padding-bottom: 8px; }
        .stat-box { background: #000; padding: 4px 10px; border-radius: 4px; border: 1px solid #333; }

        /* Document Clipboard Visual */
        #clipboard {
            position: absolute; left: 20px; top: 100px; width: 220px; background: var(--paper);
            color: #2f3542; padding: 15px; border-radius: 4px; box-shadow: 5px 5px 15px #000;
            z-index: 50; display: none; transform: rotate(-2deg); border-top: 15px solid #747d8c;
        }
        .stamp { 
            border: 3px solid var(--error); color: var(--error); padding: 5px; 
            font-weight: bold; position: absolute; bottom: 10px; right: 10px; 
            transform: rotate(-15deg); display: none; 
        }

        #road-canvas { width: 100%; height: 240px; background: #111; border: 3px solid #333; position: relative; overflow: hidden; border-radius: 4px; }
        .weight-pad { position: absolute; left: 40%; bottom: 15%; width: 150px; height: 70px; background: #222; border: 2px solid #444; }
        
        .gate-post { position: absolute; right: 15%; bottom: 10%; width: 14px; height: 100px; background: #333; }
        .gate-arm { position: absolute; right: 15%; bottom: 100px; width: 120px; height: 12px; background: repeating-linear-gradient(90deg, #fff, #fff 12px, #f00 12px, #f00 24px); transform-origin: right center; transition: 0.8s; z-index: 6; }
        .gate-open { transform: rotate(-95deg); }

        .dash-grid { display: grid; grid-template-columns: 260px 1fr 260px; gap: 15px; }
        .terminal-screen { background: var(--screen-bg); border: 4px solid #000; height: 190px; color: var(--neon); font-size: 13px; position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }

        .btn { width: 100%; padding: 12px 5px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 10px; text-transform: uppercase; color: white; background: #333; box-shadow: 0 4px 0 #000; margin-bottom: 6px; }
        .btn:active { transform: translateY(2px); }
        .btn-blue { background: #3b4f91; }
        .btn-gold { background: var(--gold); color: #000; }
        .btn-bribe { background: var(--bribe); color: #000; }

        .v-body { position: absolute; bottom: 20%; left: -250px; z-index: 10; transition: all 1.8s ease; }
        .v-car { width: 70px; height: 35px; background: #2980b9; border-radius: 4px; }
        .v-truck { width: 130px; height: 55px; background: #555; border-radius: 4px; }
        
        .move-inspect { left: 10% !important; }
        .move-weight { left: 40% !important; }
        .move-pay { left: 65% !important; }
        .move-exit { left: 130% !important; transition: 3s ease-in !important; }
    </style>
</head>
<body>

<div id="clipboard">
    <div style="font-size:10px; font-weight:bold; border-bottom:1px solid #ccc; margin-bottom:10px;">VEHICLE FITNESS CERT</div>
    <div id="clip-data" style="font-size:9px; line-height:1.6;">
        REG: <span id="clip-reg">---</span><br>
        NAME: <span id="clip-name">---</span><br>
        EXPIRY: <span id="clip-exp">---</span><br>
        STATUS: <span id="clip-status">CERTIFIED</span>
    </div>
    <div id="clip-stamp" class="stamp">APPROVED</div>
</div>

<div class="console-unit">
    <div class="header-bar">
        <span class="stat-box">OFFICER: <b>ASHRAF ALI</b></span>
        <span class="stat-box">SHIFT: <b>DOCS/BUREAU</b></span>
        <span class="stat-box">AUDIT RISK: <b id="ui-risk" style="color:var(--success)">0%</b></span>
        <span class="stat-box">REV: $<b id="ui-rev">0</b></span>
    </div>

    <div id="road-canvas">
        <div class="weight-pad"><div style="color:var(--error); font-size:11px; text-align:center; margin-top:15px; font-weight:bold;" id="weight-ui">0.0 T</div></div>
        <div id="gate-arm" class="gate-arm"></div>
        <div id="v-element" class="v-body"></div>
    </div>

    <div class="dash-grid">
        <div class="panel">
            <button class="btn btn-blue" id="btn-disp" onclick="dispatch()">DISPATCH UNIT</button>
            
            <div id="act-docs" style="display:none;">
                <button class="btn btn-gold" onclick="verifyDocs()">VERIFY PAPERS</button>
                <button class="btn btn-bribe" id="btn-doc-bribe" style="display:none;" onclick="docBribe()">DOC BRIBE ($300)</button>
                <button class="btn btn-red" onclick="reject()">REJECT DOCS</button>
            </div>

            <div id="act-weight" style="display:none;">
                <button class="btn btn-blue" onclick="moveWeight()">PROCEED TO SCALE</button>
            </div>
        </div>

        <div class="panel">
            <div class="terminal-screen" id="terminal-box">
                <div id="main-scr">NHAI MASTER v13.0<br>STATION STANDBY</div>
            </div>
            <button class="btn btn-green" id="btn-gate" style="display:none; margin-top:10px;" onclick="openGate()">AUTHORIZE GATE</button>
        </div>

        <div class="panel">
            <div style="font-size:10px; color:#888;">TERMINAL SCANNER</div>
            <div id="info-scr" style="background:#000; padding:10px; font-size:10px; color:var(--neon); border:1px solid #333; min-height:100px;">
                AWAITING DATA...
            </div>
            <div style="margin-top:10px; font-size:10px; color:#888;">BUREAU CONTROLS</div>
            <button class="btn" onclick="location.reload()">REBOOT STATION</button>
        </div>
    </div>
</div>

<script>
    let state = {
        rev: 0, risk: 0,
        isCorrupt: false,
        vCount: 0
    };
    let cur = null;

    function dispatch() {
        document.getElementById('btn-disp').disabled = true;
        const types = [{n:'Private', c:'v-car'}, {n:'Logistics', c:'v-truck'}];
        const t = types[Math.floor(Math.random()*types.length)];
        
        // Randomly generate forged or expired documents
        const isForged = Math.random() > 0.7;
        const actualPlate = "IND-" + Math.floor(1000 + Math.random() * 8999);

        cur = {
            ...t,
            plate: actualPlate,
            docPlate: isForged ? "IND-" + Math.floor(1000 + Math.random() * 8999) : actualPlate,
            expiry: isForged ? "2023 (EXPIRED)" : "2027 (VALID)",
            isIllegal: isForged,
            weight: t.n === 'Private' ? 1.2 : 14.5
        };

        const el = document.getElementById('v-element');
        el.className = `v-body ${cur.c} move-inspect`;
        updateMainScr("UNIT INBOUND");
        
        setTimeout(() => {
            document.getElementById('act-docs').style.display = 'block';
            updateMainScr("CHECKING DOCUMENTS...");
            showClipboard();
        }, 1200);
    }

    function showClipboard() {
        const cb = document.getElementById('clipboard');
        cb.style.display = 'block';
        document.getElementById('clip-reg').innerText = cur.docPlate;
        document.getElementById('clip-exp').innerText = cur.expiry;
        document.getElementById('clip-name').innerText = "DRIVER-" + Math.floor(Math.random()*99);
        document.getElementById('clip-stamp').style.display = 'none';
        
        if(cur.isIllegal) {
            document.getElementById('btn-doc-bribe').style.display = 'block';
        }
    }

    function verifyDocs() {
        updateInfoScr(`TERMINAL PLATE: ${cur.plate}<br>DOCUMENT PLATE: ${cur.docPlate}`);
        
        if(cur.plate !== cur.docPlate || cur.isIllegal) {
            updateMainScr("<span style='color:var(--error)'>DATA MISMATCH!</span><br>FORGERY SUSPECTED");
        } else {
            document.getElementById('clip-stamp').style.display = 'block';
            updateMainScr("<span style='color:var(--success)'>DOCS VERIFIED</span>");
            document.getElementById('act-docs').style.display = 'none';
            document.getElementById('act-weight').style.display = 'block';
        }
    }

    function docBribe() {
        state.rev += 300;
        state.risk += 20;
        updateUI();
        document.getElementById('clip-stamp').innerText = "CERTIFIED";
        document.getElementById('clip-stamp').style.borderColor = "var(--gold)";
        document.getElementById('clip-stamp').style.color = "var(--gold)";
        document.getElementById('clip-stamp').style.display = 'block';
        
        updateMainScr("<span style='color:var(--bribe)'>BRIBE ACCEPTED</span>");
        document.getElementById('act-docs').style.display = 'none';
        document.getElementById('act-weight').style.display = 'block';
    }

    function moveWeight() {
        document.getElementById('clipboard').style.display = 'none';
        document.getElementById('act-weight').style.display = 'none';
        document.getElementById('v-element').classList.add('move-weight');
        updateMainScr("WEIGHING...");
        
        setTimeout(() => {
            document.getElementById('weight-ui').innerText = cur.weight.toFixed(1) + " T";
            updateMainScr("WEIGHT OK<br>PROCEED TO TOLL");
            setTimeout(moveToPay, 1000);
        }, 1500);
    }

    function moveToPay() {
        document.getElementById('v-element').classList.add('move-pay');
        const cost = cur.n === 'Private' ? 100 : 400;
        updateMainScr(`TOLL DUE: $${cost}`);
        
        setTimeout(() => {
            state.rev += cost;
            updateUI();
            document.getElementById('btn-gate').style.display = 'block';
            updateMainScr("PAID. OPEN GATE.");
        }, 1200);
    }

    function openGate() {
        document.getElementById('btn-gate').style.display = 'none';
        document.getElementById('gate-arm').classList.add('gate-open');
        document.getElementById('v-element').classList.add('move-exit');
        setTimeout(reset, 2500);
    }

    function updateUI() {
        document.getElementById('ui-rev').innerText = state.rev;
        document.getElementById('ui-risk').innerText = state.risk + "%";
        if(state.risk > 50) document.getElementById('ui-risk').style.color = "var(--gold)";
        if(state.risk > 80) document.getElementById('ui-risk').style.color = "var(--error)";
    }

    function updateMainScr(t) { document.getElementById('main-scr').innerHTML = t; }
    function updateInfoScr(t) { document.getElementById('info-scr').innerHTML = t; }

    function reset() {
        document.getElementById('gate-arm').classList.remove('gate-open');
        document.getElementById('v-element').className = 'v-body';
        document.getElementById('btn-disp').disabled = false;
        document.getElementById('btn-doc-bribe').style.display = 'none';
        document.getElementById('clipboard').style.display = 'none';
        document.getElementById('weight-ui').innerText = "0.0 T";
        updateMainScr("STATION STANDBY");
    }

    function reject() {
        updateMainScr("ACCESS DENIED");
        document.getElementById('clipboard').style.display = 'none';
        setTimeout(reset, 1000);
        document.getElementById('act-docs').style.display = 'none';
    }
</script>
</body>
</html>
