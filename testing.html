<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NativeIDE | Final Fixed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>
    <style>
        :root { --bg: #09090b; --panel: #121214; --accent: #6366f1; }
        body { background: var(--bg); color: #f4f4f5; font-family: sans-serif; margin: 0; overflow: hidden; height: 100vh; }
        
        .app-container { display: flex; flex-direction: column; height: 100%; width: 100%; }
        
        /* Header Fix */
        header { 
            height: 64px; 
            background: #18181b; 
            border-bottom: 1px solid #27272a; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 0 1rem;
            z-index: 50;
        }

        /* Screen Management */
        .view-content { flex: 1; position: relative; overflow: hidden; }
        .view-screen { position: absolute; inset: 0; display: none; flex-direction: column; }
        .view-screen.active { display: flex; }

        /* Navigation Fix */
        .tab-nav { 
            display: flex; 
            height: 60px; 
            background: #111113; 
            border-top: 1px solid #27272a; 
            padding-bottom: env(safe-area-inset-bottom); /* Fix for iPhone Notch */
        }
        .tab-btn { 
            flex: 1; 
            color: #71717a; 
            font-size: 11px; 
            font-weight: bold; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            transition: 0.2s;
        }
        .tab-btn.active { color: white; background: #1c1c1f; }

        /* Desktop Layout Override */
        @media (min-width: 768px) {
            .tab-nav { display: none; }
            .view-content { display: grid; grid-template-columns: 1fr 1fr; }
            .view-screen { position: relative; display: flex !important; border-right: 1px solid #27272a; }
        }

        iframe { background: white; width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <div class="flex items-center gap-3">
                <span class="text-indigo-500 font-black">IDE</span>
                <select id="lang" onchange="updateLang()" class="bg-zinc-800 text-xs px-2 py-1.5 rounded border border-zinc-700 outline-none text-white">
                    <option value="python">Python</option>
                    <option value="javascript">JavaScript</option>
                    <option value="html">HTML5</option>
                    <option value="cpp">C++ (Sim)</option>
                </select>
            </div>
            
            <button onclick="executeCode()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-black px-5 py-2 rounded-md shadow-lg transition active:scale-90">
                EXECUTE
            </button>
        </header>

        <main class="view-content">
            <section id="screen-code" class="view-screen active">
                <div id="editor-target" class="flex-1"></div>
            </section>

            <section id="screen-result" class="view-screen bg-black">
                <div id="html-preview-box" class="hidden flex-1">
                    <iframe id="preview-frame"></iframe>
                </div>
                <div id="console-box" class="flex-1 p-4 overflow-auto font-mono text-sm">
                    <div class="text-[9px] text-zinc-600 font-bold uppercase mb-2">System Output</div>
                    <pre id="stdout" class="text-emerald-400 whitespace-pre-wrap">Waiting for execution...</pre>
                    <div id="bug-report" class="mt-4"></div>
                </div>
            </section>
        </main>

        <nav class="tab-nav">
            <button id="nav-code" onclick="showTab('screen-code')" class="tab-btn active">CODE</button>
            <button id="nav-result" onclick="showTab('screen-result')" class="tab-btn">RESULT</button>
        </nav>
    </div>

    <script>
        let editor, pyodide;
        const codes = {
            python: "print('Hello from Python WASM!')",
            javascript: "console.log('JavaScript is running.');\n'Return value: ' + (5+5);",
            html: "<h1>HTML Preview</h1>\n<p>Edit code and click Execute.</p>",
            cpp: "#include <iostream>\nint main() { return 0; }"
        };

        // Initialize Monaco
        require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' } });
        require(['vs/editor/editor.main'], async function () {
            editor = monaco.editor.create(document.getElementById('editor-target'), {
                value: codes.python,
                language: 'python',
                theme: 'vs-dark',
                automaticLayout: true,
                fontSize: 16,
                wordWrap: "on",
                minimap: { enabled: false }
            });

            try {
                pyodide = await loadPyodide();
                console.log("Python Ready");
            } catch (e) {
                document.getElementById('stdout').innerText = "WASM Engine Error: Use a local server.";
            }
        });

        function showTab(id) {
            document.querySelectorAll('.view-screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.getElementById('nav-' + id.split('-')[1]).classList.add('active');
        }

        function updateLang() {
            const lang = document.getElementById('lang').value;
            monaco.editor.setModelLanguage(editor.getModel(), lang === 'cpp' ? 'cpp' : lang);
            editor.setValue(codes[lang]);
            
            const isHTML = lang === 'html';
            document.getElementById('html-preview-box').classList.toggle('hidden', !isHTML);
            document.getElementById('console-box').classList.toggle('hidden', isHTML);
        }

        async function executeCode() {
            const lang = document.getElementById('lang').value;
            const code = editor.getValue();
            const stdout = document.getElementById('stdout');
            const bugs = document.getElementById('bug-report');
            
            stdout.innerText = "Executing...";
            bugs.innerHTML = "";

            // Mobile: Auto-switch to result screen
            if (window.innerWidth < 768) showTab('screen-result');

            try {
                if (lang === 'python') {
                    pyodide.runPython(`import sys, io; sys.stdout = io.StringIO()`);
                    await pyodide.runPythonAsync(code);
                    stdout.innerText = pyodide.runPython("sys.stdout.getvalue()") || "Finished.";
                } else if (lang === 'javascript') {
                    stdout.innerText = eval(code) || "Script Finished.";
                } else if (lang === 'html') {
                    document.getElementById('preview-frame').srcdoc = code;
                } else if (lang === 'cpp') {
                    if(!code.includes(';')) throw new Error("Syntax Error: Missing Semicolon");
                    stdout.innerText = "C++ Sim: Compilation Successful.";
                }
            } catch (err) {
                stdout.innerText = "Execution Failed.";
                bugs.innerHTML = `<div class="p-3 bg-red-900/40 border border-red-500 rounded text-red-200 text-xs">${err.message}</div>`;
            }
        }
    </script>
</body>
</html>
