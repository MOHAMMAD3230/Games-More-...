<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Visibility Interlocking</title>
    <style>
        :root {
            --accent: #3b82f6; --danger: #ef4444; --go: #22c55e; --caution: #f59e0b;
            --bg: #0a0a0a; --panel: rgba(20, 20, 20, 0.95);
        }
        body { margin: 0; background: var(--bg); color: #eee; font-family: 'Consolas', monospace; overflow: hidden; }
        canvas { display: block; width: 100vw; height: 100vh; }

        .control-tower {
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
            background: var(--panel); padding: 15px 25px; border: 1px solid #444; 
            z-index: 100; min-width: 700px; box-shadow: 0 -10px 30px rgba(0,0,0,0.9);
            border-radius: 12px; display: flex; gap: 40px; align-items: center;
        }

        .lever-section { display: flex; gap: 20px; border-right: 1px solid #333; padding-right: 30px; }
        
        .signal-btn {
            background: #111; border: 1px solid #444; color: #555; padding: 8px 12px;
            cursor: pointer; text-align: center; font-size: 10px; transition: all 0.2s ease;
            border-radius: 6px; min-width: 95px;
        }
        .signal-btn.active-red { border-color: var(--danger); color: var(--danger); }
        .signal-btn.active-green { border-color: var(--go); color: var(--go); box-shadow: 0 0 10px rgba(34, 197, 94, 0.4); }

        .platform-btn {
            background: #222; border: 1px solid #444; color: white;
            padding: 8px 12px; cursor: pointer; font-size: 11px; font-weight: bold; border-radius: 6px;
        }
        
        .label { font-size: 9px; color: #888; text-transform: uppercase; margin-bottom: 5px; display: block; letter-spacing: 1px;}
        #status-display { 
            position: absolute; top: -30px; left: 0; width: 100%; text-align: center;
            font-size: 13px; color: #f59e0b; font-weight: bold; text-shadow: 1px 1px 4px #000;
        }
    </style>
</head>
<body>

<div class="control-tower">
    <div id="status-display">SIGNAL OPTICS ENHANCED - ULTRA VISIBILITY</div>

    <div class="lever-section">
        <div>
            <span class="label">UP LINE (L → R)</span>
            <div style="display: flex; gap: 5px;">
                <button id="btn-upHome" class="signal-btn active-red" onclick="toggleSig('upHome')">UP HOME<br>[STOP]</button>
                <button id="btn-upExit" class="signal-btn active-red" onclick="toggleSig('upExit')">UP START<br>[STOP]</button>
            </div>
        </div>
        <div>
            <span class="label">DN LINE (R → L)</span>
            <div style="display: flex; gap: 5px;">
                <button id="btn-dnHome" class="signal-btn active-red" onclick="toggleSig('dnHome')">DN HOME<br>[STOP]</button>
                <button id="btn-dnExit" class="signal-btn active-red" onclick="toggleSig('dnExit')">DN START<br>[STOP]</button>
            </div>
        </div>
    </div>

    <div style="display: flex; gap: 15px;">
        <div>
            <span class="label">SPAWN LEFT</span>
            <button class="platform-btn" onclick="spawnTrain(0, 'R')">PLAT A</button>
            <button class="platform-btn" onclick="spawnTrain(1, 'R')">PLAT B</button>
        </div>
        <div>
            <span class="label" style="color: #f59e0b;">SPAWN RIGHT</span>
            <button class="platform-btn" onclick="spawnTrain(0, 'L')">PLAT A</button>
            <button class="platform-btn" onclick="spawnTrain(1, 'L')">PLAT B</button>
        </div>
    </div>
</div>

<canvas id="railCanvas"></canvas>

<script>
const canvas = document.getElementById('railCanvas');
const ctx = canvas.getContext('2d');

let jncInX, pltStartX, pltEndX, jncOutX, midY, trackY;
let activeTrain = null;
let sigs = { upHome: 'red', upExit: 'red', dnHome: 'red', dnExit: 'red' };

function init() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    midY = canvas.height * 0.45; 
    trackY = [midY - 100, midY + 100];
    jncInX = canvas.width * 0.12;
    pltStartX = canvas.width * 0.25;
    pltEndX = canvas.width * 0.75;
    jncOutX = canvas.width * 0.88;
}

function toggleSig(id) {
    sigs[id] = (sigs[id] === 'red') ? 'green' : 'red';
    updateUI();
}

function updateUI() {
    Object.keys(sigs).forEach(id => {
        const btn = document.getElementById(`btn-${id}`);
        const state = sigs[id];
        btn.className = `signal-btn ${state === 'green' ? 'active-green' : 'active-red'}`;
        btn.innerHTML = `${id.toUpperCase().replace('UP', 'UP ').replace('DN', 'DN ')}<br>[${state.toUpperCase()}]`;
    });
}

class Train {
    constructor(plt, dir) {
        this.plt = plt;
        this.dir = dir;
        this.targetY = trackY[plt];
        this.x = (dir === 'R') ? -400 : canvas.width + 400;
        this.speed = 0;
        this.state = 'APPROACH';
        this.timer = 0;
    }

    update() {
        const isR = this.dir === 'R';
        const display = document.getElementById('status-display');
        
        if (isR) {
            if (this.x > jncInX && sigs.upHome !== 'red') sigs.upHome = 'red';
            if (this.x > pltEndX && sigs.upExit !== 'red') sigs.upExit = 'red';
        } else {
            if (this.x < jncOutX && sigs.dnHome !== 'red') sigs.dnHome = 'red';
            if (this.x < pltStartX && sigs.dnExit !== 'red') sigs.dnExit = 'red';
        }
        updateUI();

        switch(this.state) {
            case 'APPROACH':
                let homePos = isR ? jncInX - 80 : jncOutX + 80;
                let homeDist = isR ? homePos - this.x : this.x - homePos;
                if (homeDist > 5) { this.speed = isR ? 5 : -5; } 
                else { this.speed = 0; this.state = 'AT_HOME'; }
                break;
            case 'AT_HOME':
                display.innerText = "STANDING AT HOME SIGNAL";
                if (isR ? sigs.upHome === 'green' : sigs.dnHome === 'green') this.state = 'TO_PLATFORM';
                break;
            case 'TO_PLATFORM':
                if (isR) sigs.upHome = 'orange'; else sigs.dnHome = 'orange';
                let stopPos = isR ? pltEndX - 50 : pltStartX + 50;
                let pltDist = isR ? stopPos - this.x : this.x - stopPos;
                if (pltDist > 5) { this.speed = isR ? 4 : -4; } 
                else { this.speed = 0; this.state = 'STOPPED'; this.timer = 0; if (isR) sigs.upHome = 'red'; else sigs.dnHome = 'red'; }
                break;
            case 'STOPPED':
                display.innerText = "STATION BOARDING...";
                if (++this.timer > 150) this.state = 'WAITING_EXIT';
                break;
            case 'WAITING_EXIT':
                display.innerText = "WAITING FOR EXIT SIGNAL";
                if (isR ? sigs.upExit === 'green' : sigs.dnExit === 'green') this.state = 'TO_EXIT';
                break;
            case 'TO_EXIT':
                if (isR) sigs.upExit = 'orange'; else sigs.dnExit = 'orange';
                this.speed = isR ? 6 : -6;
                break;
        }
        this.x += this.speed;
    }

    draw() {
        const isR = this.dir === 'R';
        for (let i = 0; i < 5; i++) {
            let carX = isR ? this.x - (i * 68) : this.x + (i * 68);
            let curY = this.getY(carX);
            ctx.save();
            ctx.translate(carX, curY);
            ctx.rotate(this.dir === 'L' ? Math.PI : 0);
            ctx.fillStyle = this.dir === 'R' ? "#eee" : "#f59e0b";
            if (i === 0) {
                ctx.beginPath(); ctx.roundRect(-65, -12, 65, 24, [2, 10, 10, 2]); ctx.fill();
                ctx.fillStyle = "#111"; ctx.fillRect(-15, -8, 10, 16);
            } else {
                ctx.fillRect(-65, -12, 65, 24);
                ctx.fillStyle = "rgba(0,0,0,0.2)"; ctx.fillRect(-45, -6, 12, 12); ctx.fillRect(-22, -6, 12, 12);
            }
            ctx.restore();
        }
    }

    getY(xPos) {
        if (xPos < jncInX || xPos > jncOutX) return midY;
        if (xPos >= pltStartX && xPos <= pltEndX) return this.targetY;
        let start, end, yStart, yEnd;
        if (xPos >= jncInX && xPos < pltStartX) {
            start = jncInX; end = pltStartX; yStart = midY; yEnd = this.targetY;
        } else {
            start = pltEndX; end = jncOutX; yStart = this.targetY; yEnd = midY;
        }
        let t = (xPos - start) / (end - start);
        let ease = t * t * (3 - 2 * t);
        return yStart + (yEnd - yStart) * ease;
    }
}

function spawnTrain(plt, dir) {
    if (activeTrain) return;
    activeTrain = new Train(plt, dir);
}

function drawWorld() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = "#333"; ctx.lineWidth = 2;

    drawTrack(0, midY, jncInX, midY); 
    drawTrack(jncOutX, midY, canvas.width, midY);
    
    trackY.forEach((y, i) => {
        ctx.beginPath(); ctx.moveTo(jncInX, midY);
        ctx.bezierCurveTo(jncInX+80, midY, pltStartX-80, y, pltStartX, y); ctx.stroke();
        drawTrack(pltStartX, y, pltEndX, y);
        ctx.beginPath(); ctx.moveTo(pltEndX, y);
        ctx.bezierCurveTo(pltEndX+80, y, jncOutX-80, midY, jncOutX, midY); ctx.stroke();
        
        ctx.fillStyle = "#151515";
        let pY = (y < midY) ? y-55 : y+25;
        ctx.fillRect(pltStartX, pY, pltEndX-pltStartX, 30);

        let isOcc = activeTrain && activeTrain.plt === i;
        drawSig(pltEndX + 40, y - 40, (isOcc && activeTrain.dir === 'R') ? sigs.upExit : 'red', 'R');
        drawSig(pltStartX - 40, y + 40, (isOcc && activeTrain.dir === 'L') ? sigs.dnExit : 'red', 'L');
    });

    drawSig(jncInX - 70, midY - 40, (activeTrain && activeTrain.dir === 'R') ? sigs.upHome : 'red', 'R');
    drawSig(jncOutX + 70, midY + 40, (activeTrain && activeTrain.dir === 'L') ? sigs.dnHome : 'red', 'L');
}

function drawTrack(x1, y1, x2, y2) {
    ctx.beginPath(); ctx.moveTo(x1, y1-8); ctx.lineTo(x2, y2-8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x1, y1+8); ctx.lineTo(x2, y2+8); ctx.stroke();
}

function drawSig(x, y, col, dir) {
    // ENLARGED SIGNAL BODY
    ctx.fillStyle = "#555"; ctx.fillRect(x-1.5, dir === 'R' ? y : y-45, 3, 45); // Support Post
    ctx.fillStyle = "#000"; ctx.beginPath(); 
    ctx.roundRect(x-12, dir === 'R' ? y : y-38, 24, 38, 5); ctx.fill(); // Housing
    
    let startY = dir === 'R' ? y + 8 : y - 30;
    
    const aspects = [
        { key: 'red', color: '#ff1100', off: '#300', y: startY },
        { key: 'orange', color: '#ffaa00', off: '#320', y: startY + 11 },
        { key: 'green', color: '#00ff44', off: '#030', y: startY + 22 }
    ];

    aspects.forEach(a => {
        const isActive = (col === a.key);
        
        ctx.save();
        if (isActive) {
            // OUTER GLOW (Bloom)
            ctx.shadowBlur = 25;
            ctx.shadowColor = a.color;
            ctx.fillStyle = a.color;
        } else {
            ctx.fillStyle = a.off;
        }
        
        // MAIN LENS (Enlarged)
        ctx.beginPath();
        ctx.arc(x, a.y, 4.5, 0, Math.PI * 2);
        ctx.fill();
        
        // WHITE CORE (For ultra visibility)
        if (isActive) {
            ctx.shadowBlur = 0;
            ctx.fillStyle = "#fff";
            ctx.beginPath();
            ctx.arc(x, a.y, 1.5, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    });
}

function animate() {
    drawWorld();
    if (activeTrain) {
        activeTrain.update();
        activeTrain.draw();
        if (activeTrain.x < -800 || activeTrain.x > canvas.width + 800) activeTrain = null;
    }
    requestAnimationFrame(animate);
}

window.addEventListener('resize', init);
init(); animate();
</script>
</body>
</html>
