<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NativeIDE | 4-Lang Fixed Layout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>
    <style>
        :root { --panel: #18181b; --border: #3f3f46; --bg: #09090b; }
        body { background: var(--bg); color: #f4f4f5; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; }
        
        /* Main Layout Grid */
        .app-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 60px 1fr 200px;
            height: 100vh;
            width: 100vw;
        }

        header { grid-column: 1 / 3; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 1.5rem; }
        
        #editor-container { grid-column: 1; grid-row: 2; border-right: 1px solid var(--border); overflow: hidden; }
        
        #preview-panel { grid-column: 2; grid-row: 2; background: #ffffff; width: 100%; height: 100%; border: none; }
        
        /* This covers the bottom row */
        .bottom-section { grid-column: 1 / 3; grid-row: 3; display: grid; grid-template-columns: 1fr 1fr; background: #000; border-top: 1px solid var(--border); }
        
        .console { border-right: 1px solid var(--border); padding: 1rem; overflow-y: auto; }
        .inspector { padding: 1rem; background: #111; overflow-y: auto; }

        /* Helpers */
        .full-editor { grid-column: 1 / 3 !important; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="app-grid">
        <header>
            <div class="flex items-center gap-6">
                <span class="text-indigo-500 font-black text-xl">POLYGLOT.local</span>
                <select id="lang" onchange="handleLanguageChange()" class="bg-zinc-800 text-sm px-3 py-1.5 rounded border border-zinc-600 outline-none">
                    <option value="python">Python 3 (WASM)</option>
                    <option value="javascript">JavaScript</option>
                    <option value="html">HTML5 (Live Preview)</option>
                    <option value="cpp">C++ (Local Check)</option>
                </select>
            </div>
            <div class="flex items-center gap-4">
                <div id="vm-status" class="text-[10px] font-bold text-zinc-500 uppercase">
                    <span class="inline-block w-2 h-2 rounded-full bg-yellow-500 mr-2"></span>Loading Engine...
                </div>
                <button onclick="executeCode()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-black px-8 py-2 rounded-md transition-all shadow-lg shadow-indigo-500/20">
                    EXECUTE
                </button>
            </div>
        </header>

        <div id="editor-container"></div>

        <iframe id="preview-panel" class="hidden" title="HTML Preview"></iframe>

        <div class="bottom-section">
            <div class="console">
                <h3 class="text-[10px] text-zinc-500 font-bold uppercase mb-2 tracking-widest">Standard Output</h3>
                <pre id="stdout" class="text-emerald-400 font-mono text-sm whitespace-pre-wrap">Ready for execution...</pre>
            </div>
            <div class="inspector">
                <h3 class="text-[10px] text-zinc-500 font-bold uppercase mb-2 tracking-widest">Bug Scan</h3>
                <div id="bug-report" class="text-xs text-zinc-400 italic">No errors found.</div>
            </div>
        </div>
    </div>

    <script>
        let editor, pyodide;
        const snippets = {
            python: "def check_bug():\n    # Intentional division by zero\n    return 10 / 0\n\ntry:\n    check_bug()\nexcept Exception as e:\n    print(f'Error Caught: {e}')",
            javascript: "const data = { msg: 'Hello' };\nconsole.log(data.msg + ' World');\n// return data.msg;",
            html: "\n<div style='background: #f0f9ff; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: sans-serif;'>\n  <h1 style='color: #0369a1;'>HTML Preview Window</h1>\n  <p>Modify code and click Execute!</p>\n</div>",
            cpp: "#include <iostream>\n\nint main() {\n    std::cout << \"Simulated C++ Run\" << std::endl;\n    return 0;\n}"
        };

        // 1. Monaco & Pyodide Init
        require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' } });
        require(['vs/editor/editor.main'], async function () {
            editor = monaco.editor.create(document.getElementById('editor-container'), {
                value: snippets.python,
                language: 'python',
                theme: 'vs-dark',
                automaticLayout: true,
                fontSize: 14,
                padding: { top: 16 }
            });

            try {
                pyodide = await loadPyodide();
                document.getElementById('vm-status').innerHTML = '<span class="inline-block w-2 h-2 rounded-full bg-emerald-500 mr-2"></span>Engine Ready';
            } catch (e) {
                document.getElementById('vm-status').innerHTML = '<span class="inline-block w-2 h-2 rounded-full bg-red-500 mr-2"></span>Local Load Blocked';
            }
        });

        function handleLanguageChange() {
            const lang = document.getElementById('lang').value;
            const preview = document.getElementById('preview-panel');
            const editorCont = document.getElementById('editor-container');

            if (lang === 'html') {
                preview.classList.remove('hidden');
                editorCont.classList.remove('full-editor');
            } else {
                preview.classList.add('hidden');
                editorCont.classList.add('full-editor');
            }

            monaco.editor.setModelLanguage(editor.getModel(), lang === 'cpp' ? 'cpp' : lang);
            editor.setValue(snippets[lang]);
        }

        async function executeCode() {
            const lang = document.getElementById('lang').value;
            const code = editor.getValue();
            const stdout = document.getElementById('stdout');
            const bugs = document.getElementById('bug-report');
            
            stdout.innerText = "Running...\n";
            bugs.innerHTML = "";

            try {
                if (lang === 'python') {
                    if (!pyodide) throw new Error("WASM not initialized. Run via Local Server.");
                    pyodide.runPython(`import sys, io; sys.stdout = io.StringIO()`);
                    await pyodide.runPythonAsync(code);
                    stdout.innerText = pyodide.runPython("sys.stdout.getvalue()");
                } 
                else if (lang === 'javascript') {
                    const result = eval(code);
                    stdout.innerText = result !== undefined ? `Return Value: ${result}` : "Executed (check browser console for logs)";
                }
                else if (lang === 'html') {
                    document.getElementById('preview-panel').srcdoc = code;
                    stdout.innerText = "HTML Frame Updated.";
                }
                else if (lang === 'cpp') {
                    // Logic check for C++
                    if(!code.includes('main')) throw new Error("Missing main() function.");
                    if(!code.includes(';')) throw new Error("Likely missing semicolon (;).");
                    stdout.innerText = "C++ Sim: Compilation Success.\nOutput: Simulated Result.";
                }
            } catch (err) {
                stdout.innerText = `Runtime Error: ${err.message}`;
                bugs.innerHTML = `<div class="p-3 bg-red-500/10 border border-red-500/30 rounded text-red-400">
                    <strong>Suggestion:</strong> ${err.message}
                </div>`;
            }
        }

        // Default layout state
        setTimeout(() => { document.getElementById('editor-container').classList.add('full-editor'); }, 500);
    </script>
</body>
</html>
