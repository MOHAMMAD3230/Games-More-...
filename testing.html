<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mechanical Toll - India Professional v6.0</title>
    <style>
        :root { 
            --neon: #00d9ff; 
            --error: #ff4757; 
            --success: #2ed573; 
            --gold: #ffa502; 
            --frame-bg: #4a4a4a;
            --body-bg: #1a1a1a;
        }

        /* Night Mode Logic */
        body.night-mode {
            --body-bg: #050505;
            --frame-bg: #222;
        }

        body { 
            background: var(--body-bg); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            font-family: 'Courier New', Courier, monospace; 
            color: white; 
            transition: background 0.5s;
        }
        
        .industrial-frame { 
            background: var(--frame-bg); 
            padding: 30px; 
            border-radius: 15px; 
            border: 10px solid #333; 
            box-shadow: inset 0 0 20px #000, 0 20px 50px #000; 
            display: flex; 
            gap: 30px; 
            align-items: flex-start;
            transition: background 0.5s;
        }

        /* Mechanical Buttons - Restored & Refined */
        .mech-btn { 
            width: 44px; height: 44px; 
            background: linear-gradient(145deg, #ddd, #888); 
            border: 4px solid #444; 
            border-radius: 8px; 
            cursor: pointer; 
            box-shadow: 0 5px 0 #111; 
            position: relative; 
            flex-shrink: 0; 
        }
        .mech-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #111; }
        .mech-btn.blue { background: linear-gradient(145deg, #3498db, #2980b9); }
        .mech-btn.green { background: linear-gradient(145deg, #27ae60, #1e8449); }
        .mech-btn.red { background: linear-gradient(145deg, #e74c3c, #c0392b); }
        .mech-btn.gold { background: linear-gradient(145deg, #f1c40f, #f39c12); border-color: #966d00; }

        .column { display: flex; flex-direction: column; gap: 15px; }
        .btn-row { display: flex; align-items: center; gap: 12px; }
        .ad-text { font-size: 11px; font-weight: bold; text-transform: uppercase; color: #ccc; width: 110px; line-height: 1.1; }

        /* Screen & Keypad */
        .center-stack { display: flex; flex-direction: column; align-items: center; gap: 20px; }
        #screen { 
            width: 360px; height: 280px; 
            background: #000b1a; 
            border: 8px solid #222; 
            border-radius: 5px; 
            padding: 15px; 
            box-sizing: border-box; 
            color: var(--neon); 
            box-shadow: inset 0 0 15px #000;
            position: relative;
        }

        #clock-display { position: absolute; top: 10px; right: 15px; font-size: 12px; color: var(--gold); }
        
        .keypad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; background: #333; padding: 15px; border-radius: 10px; border: 2px solid #222; }
        .num-key { width: 50px; height: 45px; background: #eee; border: none; font-weight: bold; font-size: 18px; border-radius: 4px; cursor: pointer; box-shadow: 0 4px 0 #999; color: #333; }
        .num-key:active { transform: translateY(2px); box-shadow: 0 1px 0 #999; }

        /* User Panel */
        .user-panel { background: #222; padding: 10px; border-radius: 8px; border: 2px solid #111; display: flex; flex-direction: column; gap: 10px; }
        .user-info { font-size: 10px; line-height: 1.2; }

        /* Expanded Receipt Logic */
        .receipt-slot { width: 100%; height: 120px; background: #111; border: 4px solid #333; position: relative; overflow: hidden; margin-top: 10px; box-shadow: inset 0 0 10px #000; }
        .paper { width: 85%; background: #fff; color: #000; font-size: 10px; padding: 10px; position: absolute; left: 7.5%; top: -160%; transition: 1.2s ease-out; text-align: center; }
        .print-anim { top: 5px !important; }
    </style>
</head>
<body>

<div class="industrial-frame">
    
    <!-- LEFT: VEHICLE & DESTINATION -->
    <div class="column">
        <div style="font-size: 10px; color: var(--gold);">VEHICLE TYPE</div>
        <div class="btn-row"><button class="mech-btn" onclick="vSet('CAR', 10)"></button><span class="ad-text">CAR ($10)</span></div>
        <div class="btn-row"><button class="mech-btn" onclick="vSet('VAN', 20)"></button><span class="ad-text">VAN ($20)</span></div>
        <div class="btn-row"><button class="mech-btn" onclick="vSet('TRUCK', 40)"></button><span class="ad-text">TRUCK ($40)</span></div>
        
        <div style="font-size: 10px; color: var(--gold); margin-top:10px;">DESTINATION</div>
        <div class="btn-row"><button class="mech-btn blue" onclick="cSet('CITY A', 15)"></button><span class="ad-text">CITY A</span></div>
        <div class="btn-row"><button class="mech-btn blue" onclick="cSet('CITY B', 30)"></button><span class="ad-text">CITY B</span></div>
        <div class="btn-row"><button class="mech-btn blue" onclick="cSet('LOCAL', 0)"></button><span class="ad-text">LOCAL ZONE</span></div>
    </div>

    <!-- CENTER: MONITOR & CASH KEYPAD -->
    <div class="center-stack">
        <div id="screen">
            <div id="clock-display">00:00:00</div>
            <div style="text-align:left; font-size: 10px; border-bottom: 1px solid #1a3a5a; padding-bottom: 5px; opacity: 0.7;">NHAI TOLL OS v6.0</div>
            <div id="scr-body" style="padding-top:70px; text-align:center; font-size:16px;">READY...<br>SELECT VEHICLE</div>
        </div>

        <div class="keypad-grid">
            <button class="num-key" onclick="kp('1')">1</button><button class="num-key" onclick="kp('2')">2</button><button class="num-key" onclick="kp('3')">3</button>
            <button class="num-key" onclick="kp('4')">4</button><button class="num-key" onclick="kp('5')">5</button><button class="num-key" onclick="kp('6')">6</button>
            <button class="num-key" onclick="kp('7')">7</button><button class="num-key" onclick="kp('8')">8</button><button class="num-key" onclick="kp('9')">9</button>
            <button class="num-key" style="background:#ff4757" onclick="kc()">C</button><button class="num-key" onclick="kp('0')">0</button>
            <button class="num-key" style="background:#2ed573" onclick="confirmPayment()">✓</button>
        </div>
    </div>

    <!-- RIGHT: PAYMENT & IDENTIFICATION -->
    <div class="column">
        <div style="font-size: 10px; color: var(--gold);">PAYMENT MODE</div>
        
        <div class="btn-row">
            <button class="mech-btn gold" onclick="initCashMode()"></button>
            <span class="ad-text" style="color:var(--gold)">CASH PAYMENT</span>
        </div>

        <div class="user-panel">
            <div class="btn-row"><button class="mech-btn" onclick="uSel(0)"></button><div class="user-info">U:001 (CARD)<br><span id="u0">$50</span></div></div>
            <div class="btn-row"><button class="mech-btn" onclick="uSel(1)"></button><div class="user-info">U:002 (CARD)<br><span id="u1">$150</span></div></div>
        </div>
        
        <div class="btn-row"><button class="mech-btn blue" onclick="initRec()"></button><span class="ad-text">TOP-UP CARD</span></div>
        <div class="btn-row"><button class="mech-btn green" onclick="autoLocal()"></button><span class="ad-text" style="color:var(--success)">LOCAL PASS</span></div>
        <div class="btn-row"><button class="mech-btn red" onclick="reset()"></button><span class="ad-text">CANCEL</span></div>

        <div class="receipt-slot">
            <div id="paper" class="paper">
                <b style="font-size: 11px;">NHAI RECEIPT</b><br>
                <small id="receipt-date"></small>
                <hr style="border:0; border-top: 1px dashed #000;">
                <span id="p-v"></span><br>
                <span id="p-c"></span><br>
                <b>FEE PAID: <span id="p-a"></span></b>
                <hr style="border:0; border-top: 1px dashed #000;">
                SAFE TRIP
            </div>
        </div>
    </div>

</div>

<script>
    let mode = 'IDLE', vType = '', bPrice = 0, city = '', cPrice = 0, uIdx = null, cashBuffer = '';
    const users = [ {bal: 50, loc: false}, {bal: 150, loc: true} ];

    // Clock and Night Mode (India Time Zone Basis)
    function updateClock() {
        const now = new Date();
        const timeStr = now.toLocaleTimeString('en-GB', { hour12: false });
        document.getElementById('clock-display').innerText = timeStr;

        // Auto Night Mode (6 PM to 6 AM)
        const hour = now.getHours();
        if (hour >= 18 || hour < 6) {
            document.body.classList.add('night-mode');
        } else {
            document.body.classList.remove('night-mode');
        }
    }
    setInterval(updateClock, 1000);
    updateClock();

    function vSet(t, p) {
        if(mode==='IDLE') { vType=t; bPrice=p; mode='CITY'; updateScr(`${vType} SELECTED<br>SELECT DESTINATION`); }
    }

    function cSet(c, p) {
        if(mode==='CITY') { city=c; cPrice=p; mode='SELECT_PAY'; updateScr(`TRIP: ${city}<br>TOTAL: $${bPrice+cPrice}<br>SELECT CASH OR CARD`); }
    }

    function initCashMode() {
        if(mode === 'SELECT_PAY' || mode === 'PAY_CASH') {
            mode = 'PAY_CASH';
            let due = bPrice + cPrice;
            updateScr(`CASH MODE<br>FEE DUE: <span style="color:var(--gold)">$${due}</span><br>ENTER AMOUNT & ✓`);
        }
    }

    function uSel(idx) {
        if(mode==='SELECT_PAY' || mode==='RECHARGE') {
            uIdx = idx;
            if(mode==='RECHARGE') updateScr(`RECHARGE: USER ${idx+1}<br>ENTER AMOUNT & ✓`);
            else {
                mode = 'PAY_CARD';
                updateScr(`CARD: USER ${idx+1}<br>BAL: $${users[idx].bal}<br>PRESS ✓ TO PAY`);
            }
        }
    }

    function kp(n) { cashBuffer += n; updateScr(`INPUT: <span style='color:var(--gold); font-size:28px;'>$${cashBuffer}</span>`); }
    function kc() { cashBuffer = ''; updateScr("ENTRY CLEARED"); }

    function confirmPayment() {
        let total = bPrice + cPrice;
        if(mode==='RECHARGE' && uIdx!==null) {
            users[uIdx].bal += parseInt(cashBuffer || 0);
            syncUI(); updateScr("RECHARGE SUCCESS!");
            setTimeout(reset, 1500);
        } 
        else if(mode==='PAY_CASH' && cashBuffer !== '') {
            let inserted = parseInt(cashBuffer);
            if(inserted >= total) finalize(total, "CASH");
            else updateScr(`CASH ERROR<br>NEED $${total}`);
        }
        else if(mode==='PAY_CARD' && uIdx!==null) {
            if(users[uIdx].bal >= total) {
                users[uIdx].bal -= total;
                syncUI(); finalize(total, "CARD");
            } else updateScr("LOW CARD BALANCE");
        }
    }

    function autoLocal() {
        if(uIdx !== null && users[uIdx].loc && city === 'LOCAL') finalize(0, "LOCAL PASS");
        else updateScr("<span style='color:var(--error)'>VERIFY FAILED<br>NOT LOCAL</span>");
    }

    function finalize(amt, method) {
        updateScr(`<span style='color:var(--success)'>✔ PAID BY ${method}</span><br>PRINTING RECEIPT...`);
        document.getElementById('receipt-date').innerText = new Date().toLocaleString('en-GB');
        document.getElementById('p-v').innerText = "VEHICLE: " + vType;
        document.getElementById('p-c').innerText = "DEST: " + city;
        document.getElementById('p-a').innerText = amt === 0 ? "FREE (LOCAL)" : "$"+amt;
        document.getElementById('paper').classList.add('print-anim');
        setTimeout(() => { document.getElementById('paper').classList.remove('print-anim'); reset(); }, 4000);
    }

    function updateScr(txt) { document.getElementById('scr-body').innerHTML = txt; }
    function syncUI() { users.forEach((u, i) => document.getElementById('u'+i).innerText = "$"+u.bal); }
    function initRec() { mode='RECHARGE'; updateScr("RECHARGE MODE<br>SELECT USER ID"); }
    function reset() { mode='IDLE'; vType=''; bPrice=0; city=''; cPrice=0; uIdx=null; cashBuffer=''; updateScr("READY...<br>SELECT VEHICLE"); }
</script>

</body>
</html>
