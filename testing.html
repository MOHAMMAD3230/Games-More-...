<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Railway Dispatcher Pro - 3-Aspect Console</title>
    <style>
        :root {
            --panel-bg: #b08d57;
            --rail-black: #080808;
            --sig-green: #00ff00;
            --sig-yellow: #ffcc00;
            --sig-red: #ff0000;
            --lcd-bg: #0c0d0a;
            --lcd-text: #00ff41;
            --track-gold: #ffd700;
        }

        body { background-color: #121212; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: 'Segoe UI', sans-serif; overflow: hidden; }

        .desktop-console {
            background-color: var(--panel-bg);
            width: 98vw; height: 96vh; padding: 20px; border-radius: 12px;
            box-shadow: 0 40px 100px rgba(0,0,0,0.8); border: 5px solid #8e7352;
            display: grid; grid-template-rows: 1fr 300px; gap: 15px;
        }

        .mimic-display { background: var(--rail-black); border: 10px solid #222; position: relative; border-radius: 6px; overflow: hidden; }

        .track { position: absolute; height: 3px; background: #222; width: 100%; }

        .hub-station {
            position: absolute; height: 80px; width: 450px; left: 50%; top: 40%;
            transform: translate(-50%, -50%); border: 2px dashed var(--track-gold);
            background: rgba(255,215,0,0.03); z-index: 1;
        }

        .signal-post {
            position: absolute; width: 14px; height: 38px; background: #222; border: 2px solid #444;
            display: flex; flex-direction: column; align-items: center; justify-content: space-around; padding: 2px; border-radius: 4px;
        }
        .lamp { width: 9px; height: 9px; border-radius: 50%; background: #111; border: 1px solid #000; }
        .lamp.red { background: var(--sig-red); box-shadow: 0 0 12px var(--sig-red); }
        .lamp.yellow { background: var(--sig-yellow); box-shadow: 0 0 12px var(--sig-yellow); }
        .lamp.green { background: var(--sig-green); box-shadow: 0 0 12px var(--sig-green); }

        .junction-path { position: absolute; height: 3px; background: #1a1a1a; transform-origin: left center; opacity: 0.1; transition: 0.3s; }
        .junction-path.engaged { opacity: 1; background: var(--track-gold); box-shadow: 0 0 10px var(--track-gold); }

        .train {
            position: absolute; width: 70px; height: 26px; background: #eee; color: #000;
            font-family: 'Consolas', monospace; font-size: 11px; font-weight: bold;
            display: flex; align-items: center; justify-content: center; border-radius: 3px; border: 2px solid #444; z-index: 100;
        }
        .train.selected { background: #00e5ff; box-shadow: 0 0 20px #00e5ff; border-color: #fff; }

        .control-bay { display: grid; grid-template-columns: 300px 1fr 350px; gap: 15px; }
        .bay-section { background: rgba(0,0,0,0.3); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; }
        .lcd { background: var(--lcd-bg); color: var(--lcd-text); padding: 10px; font-family: monospace; border-radius: 4px; text-align: center; border: 2px solid #333; }
        .keypad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
        .key { background: #333; color: white; border: none; padding: 10px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        
        .btn-drive { border: 4px solid #222; border-radius: 8px; cursor: pointer; color: white; font-weight: bold; font-size: 1rem; }
        .fwd { background: #145a32; } .fwd.active { background: var(--sig-green); box-shadow: 0 0 15px var(--sig-green); }
        .rev { background: #7d6608; } .rev.active { background: #f1c40f; box-shadow: 0 0 15px #f1c40f; }
        .stop { background: #7b241c; grid-column: span 2; height: 50px; margin-top: 5px; }

        .toggle-bank { display: flex; gap: 15px; justify-content: center; }
        .toggle-sw { width: 40px; height: 60px; background: #444; border: 3px solid #222; border-radius: 5px; position: relative; cursor: pointer; }
        .lever { width: 100%; height: 28px; background: #bbb; position: absolute; top: 0; transition: 0.2s; }
        .switched .lever { top: 26px; background: var(--track-gold); }
        .sw-label { color: #fff; font-size: 9px; text-align: center; margin-top: 4px; font-weight: bold; }
    </style>
</head>
<body>

<div class="desktop-console">
    <div class="mimic-display">
        <div class="track" style="top: 20%;"></div>
        <div class="track" style="top: 40%;"></div>
        <div class="track" style="top: 60%;"></div>
        <div class="track" style="top: 80%;"></div>

        <div class="hub-station"></div>

        <div id="junc-1" class="junction-path" style="top: 20%; left: 10%; width: 280px; transform: rotate(11deg);"></div>
        <div id="junc-2" class="junction-path" style="top: 40%; left: 65%; width: 280px; transform: rotate(11deg);"></div>

        <div id="sig-L" class="signal-post" style="left: 33%; top: 31%;"><div class="l-r lamp red"></div><div class="l-y lamp"></div><div class="l-g lamp"></div></div>
        <div id="sig-R" class="signal-post" style="left: 65%; top: 31%;"><div class="r-r lamp red"></div><div class="r-y lamp"></div><div class="r-g lamp"></div></div>
        
        <div id="train-layer"></div>
    </div>

    <div class="control-bay">
        <div class="bay-section">
            <div class="lcd" id="lcd">AWAITING_ID</div>
            <div class="keypad">
                <button class="key" onclick="k('1')">1</button><button class="key" onclick="k('2')">2</button><button class="key" onclick="k('3')">3</button><button class="key" onclick="k('4')">4</button>
                <button class="key" onclick="k('5')">5</button><button class="key" onclick="k('6')">6</button><button class="key" onclick="k('7')">7</button><button class="key" style="background:#800" onclick="k('C')">C</button>
                <button class="key" style="grid-column: span 4; background:#2c3e50;" onclick="k('E')">EXECUTE LINK</button>
            </div>
        </div>

        <div class="bay-section">
            <div class="drive-controls" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                <button id="btn-fwd" class="btn-drive fwd" onclick="drive('fwd')">FORWARD</button>
                <button id="btn-rev" class="btn-drive rev" onclick="drive('rev')">REVERSE</button>
                <button class="btn-drive stop" onclick="drive('stop')">HALT ALL MOTION</button>
            </div>
        </div>

        <div class="bay-section">
            <div class="toggle-bank">
                <div><div class="toggle-sw" id="sw-1" onclick="toggleJ(1)"><div class="lever"></div></div><div class="sw-label">PT-101</div></div>
                <div><div class="toggle-sw" id="sw-2" onclick="toggleJ(2)"><div class="lever"></div></div><div class="sw-label">PT-102</div></div>
            </div>
            <div id="log" style="color:#0f0; font-family:monospace; font-size:10px; text-align:center;">STATUS: READY</div>
        </div>
    </div>
</div>

<script>
    let activeTr = null;
    let junctions = { 1: false, 2: false };
    let trains = {
        1: { x: 50, y: 0.20, hY: 0.20, state: 'stop', dir: 1, docked: false, cleared: false },
        2: { x: 150, y: 0.40, hY: 0.40, state: 'stop', dir: 1 },
        3: { x: 250, y: 0.60, hY: 0.60, state: 'stop', dir: 1 },
        4: { x: 350, y: 0.80, hY: 0.80, state: 'stop', dir: 1 },
        5: { x: 600, y: 0.20, hY: 0.20, state: 'stop', dir: 1 },
        6: { x: 750, y: 0.40, hY: 0.40, state: 'stop', dir: 1 },
        7: { x: 900, y: 0.60, hY: 0.60, state: 'stop', dir: 1 }
    };

    Object.keys(trains).forEach(id => {
        const d = document.createElement('div');
        d.id = 'tr-'+id; d.className = 'train'; d.innerText = 'TR-'+id.padStart(2,'0');
        document.getElementById('train-layer').appendChild(d);
    });

    function k(v) {
        const lcd = document.getElementById('lcd');
        if(v === 'C') { activeTr = null; lcd.innerText = "IDLE"; sync(); }
        else if(v === 'E') {
            let n = parseInt(lcd.innerText);
            if(trains[n]) { activeTr = n; lcd.innerText = "LINKED: TR-" + n; sync(); }
        } else { if(isNaN(lcd.innerText)) lcd.innerText = ""; lcd.innerText += v; }
    }

    function sync() {
        Object.keys(trains).forEach(id => document.getElementById('tr-'+id).classList.toggle('selected', id == activeTr));
        if(!activeTr) return;
        document.getElementById('btn-fwd').classList.toggle('active', trains[activeTr].state === 'fwd');
        document.getElementById('btn-rev').classList.toggle('active', trains[activeTr].state === 'rev');
    }

    function toggleJ(id) {
        junctions[id] = !junctions[id];
        document.getElementById('sw-'+id).classList.toggle('switched', junctions[id]);
        document.getElementById('junc-'+id).classList.toggle('engaged', junctions[id]);
    }

    function drive(mode) {
        if(!activeTr) return;
        const t = trains[activeTr];
        if(mode === 'stop') { t.state = 'stop'; } 
        else {
            t.state = mode;
            t.dir = (mode === 'fwd') ? 1 : -1;
            
            // Exit logic for Train 1
            if(activeTr == 1 && t.docked && mode === 'fwd') {
                updateSig('R', 'green');
                window.open("https://www.google.com", "_blank");
                t.docked = false; t.cleared = true;
            }
        }
        sync();
    }

    function updateSig(side, color) {
        const p = (side === 'L') ? '.l-' : '.r-';
        document.querySelectorAll(p + 'r, ' + p + 'y, ' + p + 'g').forEach(l => l.classList.remove('red', 'yellow', 'green'));
        document.querySelector(p + color.charAt(0)).classList.add(color);
    }

    function main() {
        const w = window.innerWidth;
        const entryPt = w * 0.35;

        for(let id in trains) {
            let t = trains[id];
            if(t.state !== 'stop') {
                // Junction Diverge (L1 -> L2)
                if(id == 1 && junctions[1] && t.x > w*0.1 && t.x < w*0.3) t.y += (0.001 * t.dir);
                
                t.x += (2.2 * t.dir);

                // Auto-stop at Station Platform
                if(id == 1 && t.y > 0.35 && !t.cleared) {
                    if(t.dir == 1 && t.x >= entryPt && t.x < entryPt + 15) {
                        t.x = entryPt; t.state = 'stop'; t.docked = true;
                        updateSig('L', 'red');
                        document.getElementById('log').innerText = "TR-01 ARRIVED";
                        if(activeTr == 1) sync();
                    }
                }
            }
            if(t.x > w + 100) { t.x = -100; if(id==1){t.y=t.hY; t.cleared=false; updateSig('L','yellow'); updateSig('R','red');} }
            if(t.x < -100) t.x = w + 100;

            const dom = document.getElementById('tr-'+id);
            dom.style.left = t.x + 'px';
            dom.style.top = (t.y * 100) + '%';
        }
        requestAnimationFrame(main);
    }

    updateSig('L', 'yellow'); // Station Approach Caution
    main();
</script>
</body>
</html>
