<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NativeIDE | Robust Standalone Compiler</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>

    <style>
        :root { --bg: #09090b; --panel: #121214; --border: #27272a; }
        body { background-color: var(--bg); color: #e4e4e7; font-family: ui-sans-serif, system-ui; overflow: hidden; }
        .ide-grid { display: grid; grid-template-columns: 1fr 400px; grid-template-rows: 50px 1fr 250px; height: 100vh; }
        header { grid-column: 1 / 3; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; justify-content: space-between; background: var(--panel); }
        #editor-container { grid-row: 2; border-bottom: 1px solid var(--border); }
        #console-container { grid-row: 3; background: #000; padding: 15px; overflow-y: auto; font-family: 'Fira Code', monospace; }
        #inspector { grid-column: 2; grid-row: 2 / 4; border-left: 1px solid var(--border); background: var(--panel); padding: 20px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    </style>
</head>
<body>

    <div class="ide-grid">
        <header>
            <div class="flex items-center gap-4">
                <h1 class="text-indigo-500 font-bold tracking-tight">NATIVE_IDE</h1>
                <select id="lang" class="bg-zinc-800 text-xs px-2 py-1 rounded border border-zinc-700 outline-none">
                    <option value="python">Python 3.12 (WASM)</option>
                    <option value="javascript">JavaScript (Local)</option>
                </select>
            </div>
            <div class="flex items-center gap-4">
                <div id="status-text" class="text-[10px] uppercase font-bold text-zinc-500 flex items-center gap-2">
                    <span id="status-dot" class="status-dot bg-yellow-500 animate-pulse"></span>
                    Initializing VM...
                </div>
                <button onclick="runCode()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-6 py-1.5 rounded-full transition-all active:scale-95">
                    RUN
                </button>
            </div>
        </header>

        <div id="editor-container"></div>

        <div id="console-container">
            <div class="text-[10px] text-zinc-600 font-bold uppercase mb-2">Terminal</div>
            <pre id="output" class="text-sm text-zinc-300 whitespace-pre-wrap"></pre>
        </div>

        <aside id="inspector">
            <h2 class="text-[10px] font-black text-zinc-500 uppercase tracking-widest mb-4">Internal Inspector</h2>
            <div id="bugs" class="space-y-4">
                <div class="text-zinc-600 italic text-xs">Waiting for execution...</div>
            </div>
        </aside>
    </div>

    <script>
        let editor, pyodide;
        const outputElement = document.getElementById('output');
        const statusText = document.getElementById('status-text');
        const statusDot = document.getElementById('status-dot');

        // 1. Initialize Monaco Editor
        require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' } });
        require(['vs/editor/editor.main'], function () {
            editor = monaco.editor.create(document.getElementById('editor-container'), {
                value: "def main():\n    print('Hello World')\n    # x = 10 / 0\n\nmain()",
                language: 'python',
                theme: 'vs-dark',
                automaticLayout: true,
                fontSize: 14,
                minimap: { enabled: false }
            });
            initWasm();
        });

        // 2. Robust WASM Loader
        async function initWasm() {
            try {
                // Check if we are on file:// protocol
                if (window.location.protocol === 'file:') {
                    throw new Error("CORS Policy: WebAssembly cannot load via 'file://'. Please use a Local Server (e.g., VS Code Live Server).");
                }

                pyodide = await loadPyodide();
                
                statusDot.classList.replace('bg-yellow-500', 'bg-emerald-500');
                statusDot.classList.remove('animate-pulse');
                statusText.innerHTML = '<span class="status-dot bg-emerald-500"></span> Engine Ready';
                writeToConsole("System: WASM Engine Loaded Successfully.");
            } catch (err) {
                statusDot.classList.replace('bg-yellow-500', 'bg-red-500');
                statusDot.classList.remove('animate-pulse');
                statusText.innerHTML = '<span class="status-dot bg-red-500"></span> VM Error';
                writeToConsole(`ERROR: ${err.message}`, "text-red-500");
                console.error(err);
            }
        }

        function writeToConsole(msg, colorClass = "text-zinc-300") {
            outputElement.innerHTML += `<div class="${colorClass}">> ${msg}</div>`;
        }

        async function runCode() {
            const code = editor.getValue();
            const lang = document.getElementById('lang').value;
            outputElement.innerHTML = "";
            document.getElementById('bugs').innerHTML = "";

            if (lang === 'python') {
                if (!pyodide) {
                    writeToConsole("Error: Python engine not ready.", "text-red-500");
                    return;
                }
                try {
                    pyodide.runPython(`import sys, io; sys.stdout = io.StringIO()`);
                    await pyodide.runPythonAsync(code);
                    const stdout = pyodide.runPython("sys.stdout.getvalue()");
                    writeToConsole(stdout || "Execution finished (no output).");
                } catch (err) {
                    writeToConsole(err.message, "text-red-500");
                    parseBugs(err.message);
                }
            } else {
                try {
                    const result = eval(code);
                    writeToConsole(result !== undefined ? result : "JS Executed.");
                } catch (err) {
                    writeToConsole(err.message, "text-red-500");
                }
            }
        }

        function parseBugs(errorMsg) {
            const bugContainer = document.getElementById('bugs');
            let suggestion = "Review the line indicated in the traceback.";

            if (errorMsg.includes("ZeroDivisionError")) {
                suggestion = "<strong>Fix:</strong> You cannot divide by zero. Check your logic to ensure divisors aren't 0.";
            } else if (errorMsg.includes("IndentationError")) {
                suggestion = "<strong>Fix:</strong> Check your spaces/tabs. Python is very strict about code blocks.";
            } else if (errorMsg.includes("NameError")) {
                suggestion = "<strong>Fix:</strong> You are using a variable that hasn't been defined. Check for typos.";
            }

            bugContainer.innerHTML = `
                <div class="p-4 bg-red-500/10 border border-red-500/20 rounded text-xs text-zinc-300">
                    <p class="text-red-500 font-bold mb-2 tracking-widest">BUG DETECTED</p>
                    ${suggestion}
                </div>
            `;
        }
    </script>
</body>
</html>
