<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHAI Integrated Terminal v2.2 - Expiry Validation</title>
    <style>
        :root { 
            --neon: #00d9ff; --error: #ff4757; --success: #2ed573; 
            --gold: #ffa502; --frame-bg: #333; --road-bg: #1a1a1a;
            --screen-bg: #000b1a;
        }

        body { 
            background: #0f0f0f; display: flex; justify-content: center; 
            align-items: center; height: 100vh; margin: 0; 
            font-family: 'Segoe UI', sans-serif; color: white; overflow: hidden;
        }

        .main-container { 
            background: var(--frame-bg); padding: 25px; border-radius: 12px; 
            border: 4px solid #444; width: 900px; position: relative;
        }

        #road-canvas {
            width: 100%; height: 160px; background: var(--road-bg);
            border-top: 4px solid #555; border-bottom: 4px solid #555;
            position: relative; overflow: hidden; margin-bottom: 20px;
            display: flex; align-items: center;
        }

        .lane-marking { position: absolute; width: 100%; height: 2px; border-top: 2px dashed #444; top: 50%; }
        .booth { position: absolute; top: 0; width: 60px; height: 35px; background: #444; border: 2px solid #666; font-size: 10px; text-align: center; line-height: 35px; color: #aaa; }
        .inspection-booth { left: 220px; border-color: var(--neon); color: var(--neon); }
        .payment-booth { left: 470px; border-color: var(--gold); color: var(--gold); }

        .signal-post {
            position: absolute; left: 580px; top: 30px; width: 12px; height: 100px;
            background: #222; border-radius: 6px; display: flex; flex-direction: column;
            align-items: center; justify-content: space-around; padding: 5px 0; border: 2px solid #444;
        }
        .light { width: 15px; height: 15px; border-radius: 50%; background: #333; transition: 0.3s; }
        .light.red.active { background: #ff0000; box-shadow: 0 0 15px #ff0000; }
        .light.green.active { background: #00ff00; box-shadow: 0 0 15px #00ff00; }

        .car-sim { 
            width: 75px; height: 42px; background: #3498db; border-radius: 4px; 
            position: absolute; left: -100px; z-index: 10;
            transition: all 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .car-sim::after { content: ''; position: absolute; right: 8px; top: 5px; width: 15px; height: 32px; background: #99f1ff; border-radius: 2px; }
        .violator { background: #ff4757 !important; border: 2px solid yellow; }

        .move-inspect { left: 210px !important; }
        .move-pay { left: 460px !important; }
        .move-exit { left: 110% !important; transition: 2s ease-in !important; }
        .move-uturn { transform: scaleX(-1); left: -150px !important; transition: 2s ease-in-out !important; }
        .speed-away { left: 120% !important; transition: 0.8s ease-in !important; }

        .dashboard { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
        .panel { background: #222; padding: 15px; border-radius: 8px; border: 1px solid #444; position: relative; }
        .data-screen { background: #000; padding: 10px; font-family: monospace; border: 1px solid #333; margin: 10px 0; min-height: 40px; font-size: 11px;}
        .btn { width: 100%; padding: 12px; margin-top: 8px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; color: white; text-transform: uppercase; }
        .btn:disabled { opacity: 0.2; filter: grayscale(1); }

        #fare-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 100;
        }

        .console-unit { background: #3a3a3a; padding: 20px; border-radius: 15px; border: 8px solid #222; display: flex; flex-direction: column; gap: 15px; width: 950px; font-family: 'Courier New', monospace; }
        .workspace { display: flex; gap: 20px; }
        .sidebar { width: 200px; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 10px; display: flex; flex-direction: column; gap: 10px;}
        
        #screen { width: 100%; height: 220px; background: var(--screen-bg); border-radius: 8px; padding: 15px; color: var(--neon); position: relative; box-shadow: inset 0 0 20px #000; overflow: hidden; box-sizing: border-box;}
        #clock { position: absolute; top: 10px; right: 15px; font-size: 12px; color: var(--gold); }

        .keypad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
        .num-key { width: 55px; height: 45px; background: #ddd; border: none; font-weight: bold; border-radius: 4px; cursor: pointer; color: #222; box-shadow: 0 3px 0 #888;}
        .num-key:active { transform: translateY(2px); box-shadow: none; }
        
        .mech-btn { width: 100%; padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 10px; text-transform: uppercase;}
        .mech-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .mech-btn.gold { background: var(--gold); margin-bottom: 2px; }
        .mech-btn.blue { background: #3498db; color: white; }
        .mech-btn.red { background: var(--error); color: white; }

        .payment-bank { width: 250px; }
        .user-card { background: #222; padding: 8px; border: 1px solid #444; border-radius: 6px; font-size: 10px; display: flex; align-items: center; gap: 5px; margin-bottom: 5px;}
        .topup-btn { background: var(--gold); border: none; border-radius: 4px; padding: 4px 8px; cursor: pointer; font-weight: bold; }

        .receipt { width: 180px; background: #fff; color: #000; position: absolute; top: -200%; left: 50%; transform: translateX(-50%); padding: 10px; font-size: 9px; text-align: center; transition: 1s; z-index: 10; border: 1px solid #ccc;}
        .print-active { top: 10px; }
        .city-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-top: 10px; }
        
        .live-dot { height: 8px; width: 8px; background-color: #ff0000; border-radius: 50%; display: inline-block; animation: blink 1s infinite; margin-right: 5px;}
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div class="main-container">
    <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
        <span><span class="live-dot"></span><span style="color: var(--neon)">NHAI COMMAND CENTER v2.2</span></span>
        <span id="main-date" style="color: var(--gold)">DATE: --/--/----</span>
    </div>

    <div id="road-canvas">
        <div class="booth inspection-booth">INSPECT</div>
        <div class="booth payment-booth">PLAZA</div>
        <div class="lane-marking"></div>
        <div id="gate-bar" style="position:absolute; left: 570px; top:40px; width: 5px; height: 80px; background: #ff4757; transform-origin: top; transition: 0.5s; z-index: 20; border: 1px solid white;"></div>
        <div class="signal-post">
            <div id="light-red" class="light red active"></div>
            <div id="light-green" class="light green"></div>
        </div>
        <div id="car" class="car-sim"></div>
    </div>

    <div class="dashboard">
        <div class="panel">
            <small>1. TRAFFIC CTRL</small>
            <button id="btn-next" class="btn" style="background:#4a69bd" onclick="triggerTraffic()">Dispatch Vehicle</button>
            <button class="btn" style="background:#555; font-size: 10px;" onclick="showSummary()">End Shift / Report</button>
            <p id="log" style="font-size: 11px; color: #888; margin-top: 5px;">Ready.</p>
        </div>

        <div class="panel">
            <small style="color: var(--neon)">2. OFFICER CHECK</small>
            <div class="data-screen">
                PLATE: <span id="ui-plate">----</span><br>
                LIC EXPIRY: <span id="ui-expiry">--/--/----</span><br>
                STATUS: <span id="ui-status" style="color:white">CLEAN</span>
            </div>
            <div style="display: flex; gap: 5px;">
                <button id="btn-ok" class="btn" style="background:var(--success)" onclick="officerReview(true)" disabled>OK</button>
                <button id="btn-no" class="btn" style="background:var(--error)" onclick="officerReview(false)" disabled>REJ</button>
            </div>
        </div>

        <div class="panel">
            <small style="color: var(--gold)">3. GATE SIG</small>
            <div id="payment-status" class="data-screen" style="text-align: center; color: var(--error);">
                PENDING
            </div>
            <button id="btn-signal-green" class="btn" style="background:var(--success)" onclick="openGate()" disabled>RAISE BARRIER</button>
        </div>
    </div>
</div>

<div id="fare-modal">
    <div class="console-unit">
        <div class="workspace">
            <div class="sidebar">
                <button class="mech-btn gold" onclick="detectVehicle()">Detect Vehicle</button>
                <div id="detection-info" style="font-size: 10px; color: var(--gold);">Awaiting...</div>
                <button class="mech-btn blue" onclick="startFareInput()">Manual Fare</button>
                <button class="mech-btn red" style="margin-top: auto;" onclick="resetConsole()">Reset Terminal</button>
            </div>

            <div style="flex-grow:1; display:flex; flex-direction:column; align-items:center; gap:10px;">
                <div id="screen">
                    <div id="clock">00:00:00</div>
                    <div id="paper" class="receipt">
                        <b>NHAI RECEIPT</b><br><small id="rcp-date"></small><hr>
                        <div id="rcp-v" style="text-align:left"></div>
                        <div id="rcp-a" style="font-weight:bold; margin-top:5px;"></div>
                    </div>
                    <div id="scr-body" style="text-align:center; margin-top:30px;">NHAI SMART TOLL v2.2<br>AWAITING VEHICLE...</div>
                </div>
                <div class="keypad-grid">
                    <button class="num-key" onclick="kp('1')">1</button><button class="num-key" onclick="kp('2')">2</button><button class="num-key" onclick="kp('3')">3</button>
                    <button class="num-key" onclick="kp('4')">4</button><button class="num-key" onclick="kp('5')">5</button><button class="num-key" onclick="kp('6')">6</button>
                    <button class="num-key" onclick="kp('7')">7</button><button class="num-key" onclick="kp('8')">8</button><button class="num-key" onclick="kp('9')">9</button>
                    <button class="num-key" style="background:var(--error)" onclick="kc()">C</button>
                    <button class="num-key" onclick="kp('0')">0</button>
                    <button class="num-key" style="background:var(--success)" onclick="confirmAction()">✓</button>
                </div>
            </div>

            <div class="payment-bank">
                <button class="mech-btn" id="btn-cash" onclick="initCashMode()" style="background: #eee;" disabled>Pay Cash</button>
                <div class="user-card">
                    <button class="mech-btn" style="width:40px; margin:0; background: #555; color: white;" id="rfid-0" onclick="uSel(0)" disabled>RF</button>
                    <div style="flex-grow:1">U01: <span id="u0" style="color: var(--success)">$50</span></div>
                    <button class="topup-btn" onclick="initTopUp(0)">+</button>
                </div>
                <div class="user-card">
                    <button class="mech-btn" style="width:40px; margin:0; background: #555; color: white;" id="rfid-1" onclick="uSel(1)" disabled>RF</button>
                    <div style="flex-grow:1">U02: <span id="u1" style="color: var(--success)">$150</span></div>
                    <button class="topup-btn" onclick="initTopUp(1)">+</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const SYSTEM_DATE_STR = "2026-05-02"; // ISO for logic
    const DISPLAY_DATE = "02-MAY-2026";
    let BASE_TOLL = 20; 
    let shiftTotal = 0, vehiclesCount = 0, violatorsCount = 0;
    
    document.getElementById('main-date').innerText = "DATE: " + DISPLAY_DATE;

    let simState = 'IDLE', currentCar = null;
    let fareMode = 'IDLE', vType = '', manualFare = 0, uIdx = null, cashTendered = '', topUpAmt = '', currentCity = '';
    const users = [ {bal: 50}, {bal: 150} ];
    const CITY_FARES = { 'MUMBAI': 50, 'DELHI': 45, 'CHENNAI': 35, 'BANGALORE': 60 };

    setInterval(() => {
        const now = new Date();
        document.getElementById('clock').innerText = now.toLocaleTimeString('en-GB');
        
        const hr = now.getHours();
        const isPeak = (hr >= 8 && hr <= 10) || (hr >= 17 && hr <= 19);
        BASE_TOLL = isPeak ? 40 : 20;
    }, 1000);

    // --- LICENSE VALIDATION LOGIC ---
    function checkLicenseExpiry(expiryDateStr) {
        const expiry = new Date(expiryDateStr);
        const systemToday = new Date(SYSTEM_DATE_STR);
        return expiry < systemToday;
    }

    function triggerTraffic() {
        if (simState !== 'IDLE') return;
        simState = 'INSPECT';
        
        // Random Expiry Generator (20% chance of being expired)
        const randomYear = Math.random() < 0.2 ? 2025 : 2027;
        const randomMonth = String(Math.floor(Math.random() * 12) + 1).padStart(2, '0');
        const expiryDate = `${randomYear}-${randomMonth}-15`;

        const isFlagged = Math.random() < 0.10; // Criminal flag
        const isExpired = checkLicenseExpiry(expiryDate);

        currentCar = { 
            plate: "IND-" + (Math.floor(Math.random()*89)+10) + "-TX-" + (Math.floor(Math.random()*8999)+1000), 
            flagged: isFlagged,
            expiry: expiryDate,
            expired: isExpired
        };
        
        document.getElementById('gate-bar').style.transform = 'rotate(0deg)';
        document.getElementById('light-red').classList.add('active');
        document.getElementById('light-green').classList.remove('active');
        document.getElementById('btn-signal-green').disabled = true;
        document.getElementById('payment-status').innerText = "PENDING";
        
        const carEl = document.getElementById('car');
        carEl.style.transition = 'none';
        
        // Visual indicator: Red if either flagged or expired
        carEl.className = 'car-sim' + (isFlagged || isExpired ? ' violator' : ''); 
        carEl.style.left = '-100px';

        setTimeout(() => {
            carEl.style.transition = 'all 1.2s ease-out';
            carEl.classList.add('move-inspect');
            setTimeout(() => {
                document.getElementById('ui-plate').innerText = currentCar.plate;
                document.getElementById('ui-expiry').innerText = currentCar.expiry;
                
                // Set Alert Status
                const statusEl = document.getElementById('ui-status');
                if(currentCar.flagged) {
                    statusEl.innerText = "!! CRIMINAL ALERT !!";
                    statusEl.style.color = "var(--error)";
                } else if(currentCar.expired) {
                    statusEl.innerText = "!! EXPIRED LICENSE !!";
                    statusEl.style.color = "var(--gold)";
                } else {
                    statusEl.innerText = "CLEAN";
                    statusEl.style.color = "var(--success)";
                }

                document.getElementById('btn-ok').disabled = false;
                document.getElementById('btn-no').disabled = false;
                document.getElementById('btn-next').disabled = true;
            }, 1200);
        }, 50);
    }

    function officerReview(approved) {
        document.getElementById('btn-ok').disabled = true;
        document.getElementById('btn-no').disabled = true;
        if (approved) {
            document.getElementById('car').classList.add('move-pay');
            setTimeout(() => {
                document.getElementById('fare-modal').style.display = 'flex';
                resetConsole();
            }, 1300);
        } else {
            document.getElementById('car').classList.add('move-uturn');
            document.getElementById('log').innerText = "Access Denied: Vehicle Turned Away";
            setTimeout(fullReset, 2500);
        }
    }

    function openGate() {
        if((currentCar.flagged || currentCar.expired) && document.getElementById('payment-status').innerText === "PENDING") {
            document.getElementById('log').innerText = "ALERT: UNAUTHORIZED BREACH!";
            violatorsCount++;
        }

        document.getElementById('btn-signal-green').disabled = true;
        document.getElementById('gate-bar').style.transform = 'rotate(-90deg)';
        document.getElementById('light-red').classList.remove('active');
        document.getElementById('light-green').classList.add('active');
        
        setTimeout(() => {
            const carEl = document.getElementById('car');
            if(currentCar.flagged || currentCar.expired) {
                carEl.classList.add('speed-away');
            } else {
                carEl.classList.add('move-exit');
            }
            vehiclesCount++;
            setTimeout(fullReset, 2200);
        }, 500);
    }

    function fullReset() {
        simState = 'IDLE';
        document.getElementById('btn-next').disabled = false;
        document.getElementById('ui-plate').innerText = "----";
        document.getElementById('ui-expiry').innerText = "--/--/----";
        document.getElementById('ui-status').innerText = "----";
        document.getElementById('ui-status').style.color = "white";
        document.getElementById('log').innerText = "System Ready.";
    }

    function resetConsole() {
        fareMode = 'IDLE'; vType = ''; manualFare = 0; cashTendered = ''; topUpAmt = ''; currentCity = '';
        document.getElementById('detection-info').innerText = "Awaiting...";
        updateFareScr("NHAI SMART TOLL v2.2<br>DETECT VEHICLE TO CONTINUE");
        document.getElementById('btn-cash').disabled = true;
        document.getElementById('rfid-0').disabled = true;
        document.getElementById('rfid-1').disabled = true;
    }

    function detectVehicle() {
        updateFareScr("SCANNING...");
        setTimeout(() => {
            vType = ['CAR', 'VAN', 'TRUCK'][Math.floor(Math.random()*3)];
            document.getElementById('detection-info').innerText = `DETECTED: ${vType}`;
            
            let html = `VEHICLE: ${vType}<br>OFFICER: SELECT DESTINATION<div class="city-grid">`;
            for(let city in CITY_FARES) html += `<button class="mech-btn gold" onclick="applyDestination('${city}')">${city}</button>`;
            updateFareScr(html + `</div>`);
        }, 800);
    }

    function applyDestination(city) {
        currentCity = city;
        const destFare = CITY_FARES[city];
        manualFare = BASE_TOLL + destFare; 
        fareMode = 'SELECT_PAY';
        
        updateFareScr(`
            <div style="text-align:left; font-size:11px; margin: 0 auto; width: 200px;">
                DESTINATION: ${city}<br>
                BASE (PEAK ADJ): $${BASE_TOLL}<br>
                DEST. FEE: $${destFare}
            </div>
            <hr style="border:0; border-top:1px solid #333; width:80%">
            TOTAL: <span style="font-size:24px; color:var(--gold)">$${manualFare}</span><br>
            CHOOSE PAYMENT METHOD
        `);
        enablePaymentButtons();
    }

    function startFareInput() {
        fareMode = 'INPUT_FARE';
        manualFare = "";
        updateFareScr("MANUAL OVERRIDE:<br>ENTER AMOUNT THEN PRESS ✓");
    }

    function initTopUp(idx) {
        fareMode = 'TOP_UP';
        uIdx = idx;
        topUpAmt = '';
        updateFareScr(`TOP-UP USER 0${idx+1}<br>ENTER AMOUNT THEN PRESS ✓<br><span style="color:var(--success)">$0</span>`);
    }

    function initCashMode() {
        fareMode = 'PAY_CASH';
        cashTendered = "";
        updateFareScr(`TOTAL DUE: $${manualFare}<br>ENTER CASH TENDERED THEN ✓`);
    }

    function enablePaymentButtons() {
        document.getElementById('btn-cash').disabled = false;
        document.getElementById('rfid-0').disabled = false;
        document.getElementById('rfid-1').disabled = false;
    }

    function kp(n) {
        if(fareMode === 'INPUT_FARE') {
            manualFare = (manualFare === "0") ? n : manualFare + n;
            updateFareScr(`MANUAL FARE:<br><span style="font-size:32px; color:var(--gold)">$${manualFare}</span>`);
        } else if (fareMode === 'PAY_CASH') {
            cashTendered += n;
            updateFareScr(`DUE: $${manualFare}<br>TENDERED: <span style="font-size:32px; color:var(--gold)">$${cashTendered}</span>`);
        } else if (fareMode === 'TOP_UP') {
            topUpAmt += n;
            updateFareScr(`TOP-UP USER 0${uIdx+1}<br>AMOUNT: <span style="font-size:32px; color:var(--success)">$${topUpAmt}</span>`);
        }
    }

    function kc() {
        manualFare = ""; cashTendered = ""; topUpAmt = "";
        updateFareScr("CLEARED");
    }

    function confirmAction() {
        if(fareMode === 'INPUT_FARE') {
            if(!manualFare) return;
            manualFare = parseInt(manualFare);
            fareMode = 'SELECT_PAY';
            updateFareScr(`MANUAL FARE: $${manualFare}<br>SELECT PAYMENT METHOD`);
            enablePaymentButtons();
        } 
        else if (fareMode === 'PAY_CASH') {
            let paid = parseInt(cashTendered || 0);
            if(paid >= manualFare) {
                updateFareScr(`<span style="color:var(--success)">PAID CASH. CHANGE: $${paid - manualFare}</span>`);
                finalizePayment();
            } else updateFareScr(`<span style="color:var(--error)">SHORTAGE: $${manualFare - paid}</span>`);
        }
        else if (fareMode === 'TOP_UP') {
            if(!topUpAmt) return;
            users[uIdx].bal += parseInt(topUpAmt);
            document.getElementById('u'+uIdx).innerText = "$"+users[uIdx].bal;
            updateFareScr(`<span style="color:var(--success)">TOP-UP SUCCESSFUL!</span>`);
            setTimeout(resetConsole, 1500);
        }
    }

    function uSel(idx) {
        if(users[idx].bal >= manualFare) {
            users[idx].bal -= manualFare;
            document.getElementById('u'+idx).innerText = "$"+users[idx].bal;
            updateFareScr(`<span style="color:var(--success)">RFID AUTHORIZED</span>`);
            finalizePayment();
        } else updateFareScr("<span style='color:var(--error)'>INSUFFICIENT FUNDS</span>");
    }

    function finalizePayment() {
        shiftTotal += manualFare;
        document.getElementById('rcp-date').innerText = new Date().toLocaleString();
        document.getElementById('rcp-v').innerText = `TYPE: ${vType || "MANUAL"} | DEST: ${currentCity || "NA"}`;
        document.getElementById('rcp-a').innerText = "PAID: $" + manualFare;
        document.getElementById('paper').classList.add('print-active');
        document.getElementById('payment-status').innerText = "PAID: $" + manualFare;
        document.getElementById('payment-status').style.color = "var(--success)";
        setTimeout(() => {
            document.getElementById('fare-modal').style.display = 'none';
            document.getElementById('btn-signal-green').disabled = false;
            document.getElementById('paper').classList.remove('print-active');
        }, 2000);
    }

    function showSummary() {
        alert(`--- NHAI SHIFT REPORT ---\nTotal Vehicles: ${vehiclesCount}\nTotal Revenue: $${shiftTotal}\nViolations (Breaches): ${violatorsCount}`);
    }

    function updateFareScr(t) { document.getElementById('scr-body').innerHTML = t; }
</script>

</body>
</html>
