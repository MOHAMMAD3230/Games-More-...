<script>
let mc, mic, actx, ana, pG, ck;
let inHPF, outHPF, outComp;
let ancNotch50, ancNotch60, ancNotch100, ancNotch120, ancLPF, ancBPF;
let noiseFloor = new Float32Array(64);
let noiseFloorFilled = false;
let noiseGateEnvelope = 0;
let noiseFloorFrames = 0;
let lastInputNode = null;

let isTx = false, isPwr = false, isLinked = false, isAnc = false;
let nxt = 0, rotA = 0, myRole = null, vltTimer = null;
let heartbeatTimer = null, peerTimeout = null, connTimeout = null;
let battLevel = 0;
const TP = 'ashraf_v12_4_1/';

/* ── Nozzle Dial ── */
function handleNoz(e) {
    if (!isPwr || mc) return;
    const r = e.target.getBoundingClientRect();
    const cin = document.getElementById('ch');
    if ((e.clientX - r.left) > (r.width / 2)) {
        rotA += 30; cin.value = parseInt(cin.value || 0) + 1; log("FREQ_INC");
    } else {
        rotA -= 30; cin.value = parseInt(cin.value || 0) - 1; log("FREQ_DEC");
    }
    document.getElementById('nozzle').style.transform = `rotate(${rotA}deg)`;
}

/* ── UI State Manager ── */
function updateUI(mode, noise) {
    const rf = document.getElementById('rfSt');
    const led = document.getElementById('led');
    const rssi = document.getElementById('rssi');
    const al = document.getElementById('ancLed');
    const ll = document.getElementById('linkLed');

    rf.className = 'val-norm';
    led.className = 'status-led';
    rssi.className = 'signal-block';
    ll.className = 'mini-led';

    /* Don't touch ANC LED here — it has its own logic */

    if (!isPwr) { ll.classList.add('m-dim'); al.className = 'anc-led'; return; }

    if (mode === 'idle') {
        rf.innerText = 'OFFLINE'; rf.style.color = 'var(--r)';
        led.classList.add('led-red'); rssi.classList.add('sig-red');
        ll.classList.add('m-dim');
    } else if (mode === 'waiting') {
        rf.innerText = 'STANDBY'; rf.style.color = 'var(--y)';
        led.classList.add('led-orange'); rssi.classList.add('sig-orange');
        ll.classList.add('m-orange');
    } else if (mode === 'connected') {
        rf.innerText = 'LINKED'; rf.style.color = 'var(--g)';
        led.classList.add('led-green'); rssi.classList.add('sig-green');
        ll.classList.add('m-green');
    }
}

/* ── Battery Indicator ── */
function updateBatt(v) {
    const el = document.getElementById('vlt');
    const bl = document.getElementById('battLed');
    el.innerText = v.toFixed(2) + 'V';
    bl.className = 'mini-led';
    if (v >= 12.0) { el.style.color = 'var(--g)'; bl.classList.add('m-green'); }
    else if (v >= 11.5) { el.style.color = 'var(--y)'; bl.classList.add('m-yellow'); }
    else if (v >= 11.0) { el.style.color = '#ff8800'; bl.classList.add('m-orange'); }
    else { el.style.color = 'var(--r)'; bl.classList.add('m-red'); }
}

/* ── PTT State ── */
function lockPTT(label) {
    const ptt = document.getElementById('ptt');
    ptt.innerText = label || 'LOCKED'; ptt.className = 'ptt-lever';
    ptt.onmousedown = null; ptt.onmouseup = null; ptt.onmouseleave = null;
    ptt.ontouchstart = null; ptt.ontouchend = null; ptt.ontouchcancel = null;
}
function waitPTT(label) {
    const ptt = document.getElementById('ptt');
    ptt.innerText = label || 'WAITING...'; ptt.className = 'ptt-lever waiting';
    ptt.onmousedown = null; ptt.onmouseup = null; ptt.onmouseleave = null;
    ptt.ontouchstart = null; ptt.ontouchend = null; ptt.ontouchcancel = null;
}
function unlockPTT() {
    const ptt = document.getElementById('ptt');
    ptt.innerText = 'PUSH TO TALK'; ptt.className = 'ptt-lever unlocked ready';
    ptt.onmousedown = pttDown; ptt.onmouseup = pttUp; ptt.onmouseleave = pttUp;
    ptt.ontouchstart = pttDown; ptt.ontouchend = pttUp; ptt.ontouchcancel = pttUp;
}

/* ── Power ── */
function pwr(s) {
    isPwr = s;
    document.getElementById('bOn').classList.toggle('active', s);
    document.getElementById('bOff').classList.toggle('active', !s);
    if (s) {
        document.getElementById('scr').classList.add('lit');
        document.getElementById('sys').style.opacity = '1';
        updateUI('idle');
        log('FIELD_OS_BOOT_v12.4.1');
        battLevel = 12.0;
        if (vltTimer) clearInterval(vltTimer);
        vltTimer = setInterval(() => {
            if (!isPwr) return;
            let drain = 0.001 + Math.random() * 0.002;
            if (isTx) drain += 0.008;
            if (isLinked) drain += 0.002;
            if (isAnc) drain += 0.004;
            battLevel -= drain;
            if (battLevel < 9.5) battLevel = 9.5 + Math.random() * 0.3;
            updateBatt(battLevel);
        }, 3000);
        updateBatt(battLevel);
    } else { teardown(); location.reload(); }
}

/* ═══════════════════════════════════════════
   REAL ANC — Actual DSP Filter Chain
   ═══════════════════════════════════════════ */

function toggleAnc() {
    if (!isPwr) return;
    isAnc = !isAnc;
    const b = document.getElementById('ancBtn');
    const al = document.getElementById('ancLed');

    if (isAnc) {
        b.innerText = 'ANC ON';
        b.classList.add('on');

        if (!ancNotch50) {
            /* Build ANC filter chain if it doesn't exist yet */
            buildAncFilters();
        }

        /* Reconnect: mic → HPF → ANC chain → analyser */
        reconnectAudioChain(true);
        al.className = 'anc-led led-anc-active';
        log('ANC:FILT_CHAIN_ON');
        log('ANC:NOTCH_50_60_100_120');
        log('ANC:LPF_3800Hz');
        log('ANC:SPECTRAL_GATE_ON');
    } else {
        b.innerText = 'ANC OFF';
        b.classList.remove('on');

        /* Reconnect: mic → HPF → analyser (bypass ANC) */
        reconnectAudioChain(false);
        al.className = 'anc-led';
        log('ANC:FILT_CHAIN_OFF');
    }
}

function buildAncFilters() {
    /* Notch at 50Hz — kills international electrical hum */
    ancNotch50 = actx.createBiquadFilter();
    ancNotch50.type = 'notch'; ancNotch50.frequency.value = 50; ancNotch50.Q.value = 30;

    /* Notch at 60Hz — kills USA electrical hum */
    ancNotch60 = actx.createBiquadFilter();
    ancNotch60.type = 'notch'; ancNotch60.frequency.value = 60; ancNotch60.Q.value = 30;

    /* Notch at 100Hz — second harmonic of 50Hz */
    ancNotch100 = actx.createBiquadFilter();
    ancNotch100.type = 'notch'; ancNotch100.frequency.value = 100; ancNotch100.Q.value = 30;

    /* Notch at 120Hz — second harmonic of 60Hz */
    ancNotch120 = actx.createBiquadFilter();
    ancNotch120.type = 'notch'; ancNotch120.frequency.value = 120; ancNotch120.Q.value = 30;

    /* Low-pass at 3800Hz — cuts high-freq hiss/whine, voice is fine below this */
    ancLPF = actx.createBiquadFilter();
    ancLPF.type = 'lowpass'; ancLPF.frequency.value = 3800; ancLPF.Q.value = 0.7;

    /* Band-pass focusing on 200Hz–3400Hz (telephone voice band) */
    ancBPF = actx.createBiquadFilter();
    ancBPF.type = 'bandpass'; ancBPF.frequency.value = 1200; ancBPF.Q.value = 0.5;

    /* Chain them: notch50 → notch60 → notch100 → notch120 → LPF → BPF */
    ancNotch50.connect(ancNotch60);
    ancNotch60.connect(ancNotch100);
    ancNotch100.connect(ancNotch120);
    ancNotch120.connect(ancLPF);
    ancLPF.connect(ancBPF);
}

function reconnectAudioChain(useAnc) {
    if (!actx || !mic) return;
    const src = actx.createMediaStreamSource(mic);

    /* Disconnect everything from inHPF onwards */
    try { inHPF.disconnect(); } catch(e){}
    if (ana) { try { ana.disconnect(); } catch(e){} }

    if (useAnc && ancBPF) {
        /* mic → HPF → [ANC filter chain] → analyser */
        src.connect(inHPF);
        inHPF.connect(ancNotch50);  /* entry point of ANC chain */
        ancBPF.connect(ana);        /* exit point of ANC chain → analyser */
        lastInputNode = ancBPF;
    } else {
        /* mic → HPF → analyser (ANC bypassed) */
        src.connect(inHPF);
        inHPF.connect(ana);
        lastInputNode = inHPF;
    }

    /* Reconnect analyser → script processor → destination */
    ana.connect(ana._proc);
    ana._proc.connect(actx.destination);
}

/* ── Spectral Noise Gate — runs inside ScriptProcessor ── */
function applySpectralNoiseGate(samples) {
    if (!noiseFloorFilled) {
        /* Still learning the noise floor — collect samples */
        for (let i = 0; i < samples.length; i++) {
            const idx = i % noiseFloor.length;
            noiseFloor[idx] = noiseFloor[idx] * 0.7 + Math.abs(samples[i]) * 0.3;
        }
        noiseFloorFrames++;
        if (noiseFloorFrames > 20) {
            noiseFloorFilled = true;
            log('ANC:NOISE_FLOOR_SET');
        }
        return samples;
    }

    /* Adaptive spectral gate with smooth envelope */
    const attackCoeff = 0.9;
    const releaseCoeff = 0.999;
    let frameEnergy = 0;

    for (let i = 0; i < samples.length; i++) {
        const abs = Math.abs(samples[i]);
        const idx = i % noiseFloor.length;
        const threshold = noiseFloor[idx] * 2.5;

        frameEnergy += abs;

        if (abs < threshold) {
            /* Below threshold — apply attenuation */
            noiseGateEnvelope *= releaseCoeff;
            samples[i] *= noiseGateEnvelope * 0.15;
        } else {
            /* Above threshold — let it through */
            noiseGateEnvelope = noiseGateEnvelope * attackCoeff + (1 - attackCoeff);
        }
    }

    /* Update noise floor slowly so it adapts to changing environment */
    if (frameEnergy / samples.length < noiseFloor[0] * 1.5) {
        for (let i = 0; i < samples.length; i++) {
            const idx = i % noiseFloor.length;
            noiseFloor[idx] = noiseFloor[idx] * 0.995 + Math.abs(samples[i]) * 0.005;
        }
    }

    return samples;
}

/* ── System Log ── */
function log(m) {
    const el = document.getElementById('sys');
    const d = document.createElement('div');
    d.innerText = '> ' + m;
    el.appendChild(d); el.scrollTop = el.scrollHeight;
    while (el.childElementCount > 30) el.removeChild(el.firstChild);
}

/* ── Teardown ── */
function teardown() {
    isTx = false; isLinked = false; myRole = null;
    if (connTimeout) { clearTimeout(connTimeout); connTimeout = null; }
    if (heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer = null; }
    if (peerTimeout) { clearTimeout(peerTimeout); peerTimeout = null; }
    if (mc) { try { mc.end(true); } catch(e){} mc = null; }
    if (mic) { mic.getTracks().forEach(t => t.stop()); mic = null; }
    if (actx) { try { actx.close(); } catch(e){} actx = null; }
    ana = null; pG = null; ck = null; inHPF = null; outHPF = null; outComp = null;
    ancNotch50 = null; ancNotch60 = null; ancNotch100 = null; ancNotch120 = null;
    ancLPF = null; ancBPF = null; lastInputNode = null;
    nxt = 0; noiseFloor = new Float32Array(64);
    noiseFloorFilled = false; noiseGateEnvelope = 0; noiseFloorFrames = 0;
    lockPTT('LOCKED'); unlockInputs(); updateUI('idle');
}

function lockInputs() {
    document.getElementById('ch').classList.add('locked');
    document.getElementById('key').classList.add('locked');
    document.getElementById('hBtn').classList.add('disabled');
    document.getElementById('jBtn').classList.add('disabled');
}
function unlockInputs() {
    document.getElementById('ch').classList.remove('locked');
    document.getElementById('key').classList.remove('locked');
    document.getElementById('hBtn').classList.remove('disabled');
    document.getElementById('jBtn').classList.remove('disabled');
}

/* ── PTT ── */
function pttDown(e) {
    if (!isLinked) return;
    e.preventDefault();
    isTx = true;
    const ptt = document.getElementById('ptt');
    ptt.classList.add('tx'); ptt.innerText = 'TX';

    /* When starting TX with ANC, reset noise floor to current ambient */
    if (isAnc) {
        /* Don't reset — keep the learned floor, it adapts */
        log('ANC:TX_GATE_ACTIVE');
    }
}
function pttUp(e) {
    if (!isLinked) return;
    e.preventDefault();
    isTx = false;
    const ptt = document.getElementById('ptt');
    ptt.classList.remove('tx'); ptt.innerText = 'PUSH TO TALK';
}

/* ── Background ── */
const bcvs = document.getElementById('scannerCanvas');
const bctx = bcvs.getContext('2d');
let bgCols = [];
function initBg() {
    bcvs.width = window.innerWidth; bcvs.height = window.innerHeight;
    bgCols = new Array(Math.floor(bcvs.width / 20)).fill(0).map(() => Math.random() * bcvs.height);
}
window.onresize = initBg; initBg();

function draw() {
    bctx.fillStyle = 'rgba(0,0,0,0.1)';
    bctx.fillRect(0, 0, bcvs.width, bcvs.height);
    bctx.font = '12px monospace'; bctx.fillStyle = '#010';
    bgCols.forEach((y, i) => {
        bctx.fillText(Math.random() > 0.8 ? '1' : '0', i * 20, y);
        bgCols[i] = y > bcvs.height ? 0 : y + 10;
    });

    if (ana && isPwr) {
        const scvs = document.getElementById('scope');
        const sctx = scvs.getContext('2d');
        const data = new Uint8Array(ana.frequencyBinCount);
        ana.getByteTimeDomainData(data);

        let sum = 0;
        for (let i = 0; i < data.length; i++) sum += Math.abs(data[i] - 128);
        const level = sum / data.length / 50;
        if (isTx) updateUI('connected', level);

        sctx.clearRect(0, 0, scvs.width, scvs.height);
        sctx.lineWidth = 3;
        sctx.strokeStyle = isAnc ? '#00d4ff' : '#39ff14';
        sctx.shadowBlur = 4; sctx.shadowColor = sctx.strokeStyle;
        sctx.beginPath();
        const step = scvs.width / data.length;
        for (let i = 0; i < data.length; i++) {
            const v = data[i] / 128.0;
            const y = v * scvs.height / 2;
            if (i === 0) sctx.moveTo(0, y); else sctx.lineTo(i * step, y);
        }
        sctx.stroke(); sctx.shadowBlur = 0;
    }
    requestAnimationFrame(draw);
}
draw();

/* ══════════════════════════════════════════
   HANDSHAKE + AUDIO ENGINE
   ══════════════════════════════════════════ */

function startHeartbeat() {
    const t = TP + document.getElementById('ch').value + '/' + myRole + '_ping';
    heartbeatTimer = setInterval(() => {
        if (mc && mc.connected) mc.publish(t, '1', { qos: 0 });
    }, 3000);
}

function resetPeerTimeout() {
    if (peerTimeout) clearTimeout(peerTimeout);
    peerTimeout = setTimeout(() => {
        if (isLinked) {
            isLinked = false; isTx = false;
            log('PEER_LOST'); waitPTT('PEER LOST'); updateUI('waiting');
            if (mc && mc.connected) {
                const ch = document.getElementById('ch').value;
                mc.unsubscribe(TP + ch + '/' + (myRole === 'host' ? 'client' : 'host') + '_audio');
            }
        }
    }, 8000);
}

function onPeerFound() {
    if (isLinked) { resetPeerTimeout(); return; }
    isLinked = true; resetPeerTimeout();
    const ch = document.getElementById('ch').value;
    const pt = TP + ch + '/' + (myRole === 'host' ? 'client' : 'host') + '_audio';
    mc.subscribe(pt, { qos: 0 }, (err) => {
        if (err) log('AUDIO_SUB_FAIL'); else log('RX:' + pt);
    });
    unlockPTT(); updateUI('connected');
    log('HANDSHAKE_OK'); log('CH_' + ch + '_LIVE');
}

async function conn(role) {
    if (!isPwr || mc) return;
    myRole = role;
    const chVal = document.getElementById('ch').value;
    const peerRole = role === 'host' ? 'client' : 'host';
    const myPing = TP + chVal + '/' + role + '_ping';
    const peerPing = TP + chVal + '/' + peerRole + '_ping';

    lockInputs(); waitPTT('SYNCING...'); updateUI('waiting');
    log('INIT_' + role.toUpperCase());

    connTimeout = setTimeout(() => {
        if (!isLinked) { log('TIMEOUT'); teardown(); }
    }, 15000);

    try {
        log('REQ_MIC...');
        mic = await navigator.mediaDevices.getUserMedia({
            audio: {
                echoCancellation: true, noiseSuppression: false,
                autoGainControl: true, channelCount: 1,
                sampleRate: { ideal: 16000 }
            }
        });
        log('MIC_OK');

        actx = new (window.AudioContext || window.webkitAudioContext)({
            sampleRate: 16000, latencyHint: 'interactive'
        });
        await actx.resume();
        log('ACTX:' + actx.sampleRate + 'Hz');

        const src = actx.createMediaStreamSource(mic);

        /* Input HPF — always on, cuts rumble */
        inHPF = actx.createBiquadFilter();
        inHPF.type = 'highpass'; inHPF.frequency.value = 180; inHPF.Q.value = 0.7;

        /* Analyser */
        ana = actx.createAnalyser(); ana.fftSize = 2048;

        /* ScriptProcessor with real ANC processing */
        const proc = actx.createScriptProcessor(2048, 1, 1);
        ana._proc = proc; /* keep reference for reconnect */

        proc.onaudioprocess = function(e) {
            e.outputBuffer.getChannelData(0).fill(0);

            if (isTx && mc && mc.connected && isLinked) {
                let samples = e.inputBuffer.getChannelData(0);

                /* Apply real ANC spectral noise gate if enabled */
                if (isAnc) {
                    samples = applySpectralNoiseGate(samples);
                }

                transmit(samples, chVal, role);
            } else if (isAnc && !isTx) {
                /* When not transmitting but ANC is ON,
                   keep learning the noise floor from ambient sound */
                applySpectralNoiseGate(e.inputBuffer.getChannelData(0));
            }
        };

        /* Initial connection: mic → HPF → analyser (no ANC yet) */
        src.connect(inHPF);
        inHPF.connect(ana);
        lastInputNode = inHPF;
        ana.connect(proc);
        proc.connect(actx.destination);

        /* Output chain */
        outHPF = actx.createBiquadFilter();
        outHPF.type = 'highpass'; outHPF.frequency.value = 150; outHPF.Q.value = 0.5;

        outComp = actx.createDynamicsCompressor();
        outComp.threshold.value = -24; outComp.knee.value = 12;
        outComp.ratio.value = 12; outComp.attack.value = 0.003; outComp.release.value = 0.15;

        pG = actx.createGain(); pG.gain.value = 0.45;
        outHPF.connect(outComp); outComp.connect(pG); pG.connect(actx.destination);

        /* AES Key */
        const enc = new TextEncoder();
        const pwd = document.getElementById('key').value || 'TAC';
        const km = await crypto.subtle.importKey('raw', enc.encode(pwd), 'PBKDF2', false, ['deriveKey']);
        ck = await crypto.subtle.deriveKey(
            { name: 'PBKDF2', salt: enc.encode('TACCOM_SALT_v12'), iterations: 10000, hash: 'SHA-256' },
            km, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
        );
        log('CIPHER_OK');

        /* MQTT */
        log('BROKER...');
        mc = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
            connectTimeout: 8000, reconnectPeriod: 3000,
            clientId: 'tac_' + role + '_' + Math.random().toString(36).slice(2, 8)
        });

        mc.on('connect', () => {
            if (connTimeout) { clearTimeout(connTimeout); connTimeout = null; }
            log('BROKER_OK');
            mc.subscribe(peerPing, { qos: 0 }, (err) => {
                if (err) { log('SUB_FAIL'); return; }
                log('SCAN:' + peerPing);
                mc.publish(myPing, '1', { qos: 0 });
                log('ANN:' + myPing);
                startHeartbeat();
                waitPTT('WAITING ' + peerRole.toUpperCase());
            });
        });

        mc.on('message', function(topic, payload) {
            if (topic.endsWith('_ping')) { onPeerFound(); return; }
            if (topic.endsWith('_audio')) { handleAudio(payload); return; }
        });

        mc.on('error', (err) => { log('ERR:' + (err.message || '?')); });
        mc.on('close', () => {
            log('BROKER_DOWN'); isLinked = false; isTx = false;
            if (heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer = null; }
            waitPTT('RECONNECTING'); updateUI('waiting');
        });
        mc.on('reconnect', () => { log('RELINK...'); });
        mc.on('reconnect_success', () => {
            log('RELINK_OK');
            if (myRole) {
                const ch2 = document.getElementById('ch').value;
                const pr = myRole === 'host' ? 'client' : 'host';
                mc.subscribe(TP + ch2 + '/' + pr + '_ping', { qos: 0 });
                mc.publish(TP + ch2 + '/' + myRole + '_ping', '1', { qos: 0 });
                if (!isLinked) waitPTT('WAITING ' + pr.toUpperCase());
            }
        });

    } catch (err) {
        if (connTimeout) { clearTimeout(connTimeout); connTimeout = null; }
        log('FAIL:' + (err.name || err.message || 'ERR'));
        teardown();
    }
}

async function handleAudio(payload) {
    if (!isLinked) return;
    try {
        if (payload.length < 13) return;
        const iv = payload.slice(0, 12);
        const dec = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, ck, payload.slice(12));
        playAudio(dec);
    } catch (e) {}
}

async function transmit(samples, ch, role) {
    try {
        const i16 = new Int16Array(samples.length);
        for (let i = 0; i < samples.length; i++) {
            const s = Math.max(-1, Math.min(1, samples[i]));
            i16[i] = s < 0 ? s * 32768 : s * 32767;
        }
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const enc = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, ck, i16.buffer);
        const pkt = new Uint8Array(12 + enc.byteLength);
        pkt.set(iv, 0); pkt.set(new Uint8Array(enc), 12);
        mc.publish(TP + ch + '/' + role + '_audio', pkt, { qos: 0 });
    } catch (e) {}
}

function playAudio(rawBuffer) {
    if (!actx || actx.state === 'closed') return;
    if (actx.state === 'suspended') actx.resume();
    const i16 = new Int16Array(rawBuffer);
    const f32 = new Float32Array(i16.length);
    for (let i = 0; i < i16.length; i++) f32[i] = i16[i] / 32768;
    const buf = actx.createBuffer(1, f32.length, actx.sampleRate);
    buf.getChannelData(0).set(f32);
    const src = actx.createBufferSource();
    src.buffer = buf;
    src.connect(outHPF);
    const now = actx.currentTime;
    if (nxt < now - 0.2) nxt = now;
    const startAt = Math.max(now + 0.005, nxt);
    src.start(startAt);
    nxt = startAt + buf.duration;
}
</script>
