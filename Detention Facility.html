<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="https://mohammad3230.github.io/PROJECT/favicon.png" type="image/png" sizes="32x32" />

  function gtag(){dataLayer.push(arguments);}

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NHAI - Prison & Detention Terminal</title>
<style>
    :root {
        --bg: #0a0508; --panel: #101018; --accent: #ff0044; --success: #2ed573;
        --danger: #ff4757; --warning: #ffa502; --border: #2a1a2a;
        --police: #00d9ff; --ems: #ff4757; --fire: #ffa502;
    }

    body {
        background-color: var(--bg); color: #ccc; font-family: 'Courier New', monospace;
        margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    }

    .top-bar {
        background: #000; padding: 15px 20px; border-bottom: 2px solid var(--accent);
        display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
    }

    .top-bar h1 { margin: 0; font-size: 1rem; color: var(--accent); letter-spacing: 1px; text-shadow: 0 0 10px rgba(255,0,68,0.5); }
    .top-bar .time { color: var(--warning); font-size: 0.9rem; }

    .main-layout {
        display: grid; grid-template-columns: 1fr 1.5fr; gap: 20px; padding: 20px;
        flex-grow: 1; min-height: 0; overflow: hidden;
    }

    .panel {
        background: var(--panel); border: 1px solid var(--border); border-radius: 4px;
        padding: 20px; display: flex; flex-direction: column; overflow: hidden;
    }

    .panel-title {
        color: var(--accent); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px;
        margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; flex-shrink: 0;
    }

    .stat-row {
        display: flex; gap: 15px; margin-bottom: 20px; flex-shrink: 0;
    }

    .stat-box {
        flex: 1; background: #000; border: 1px solid var(--border); padding: 15px; border-radius: 4px; text-align: center;
    }
    .stat-num { font-size: 2rem; font-weight: 900; margin-bottom: 5px; }
    .stat-label { font-size: 0.75rem; color: #888; text-transform: uppercase; }

    .inmate-list { flex-grow: 1; overflow-y: auto; padding-right: 5px; }
    .inmate-item {
        background: #000; border: 1px solid var(--border); padding: 15px; margin-bottom: 10px;
        border-left: 4px solid var(--danger); border-radius: 4px;
        display: flex; justify-content: space-between; align-items: center; gap: 15px;
    }
    .inmate-item.served { border-left-color: var(--success); box-shadow: inset 0 0 15px rgba(46, 213, 115, 0.1); }
    .inmate-item.released { border-left-color: #555; opacity: 0.5; }
    .inmate-item.federal { border-left-color: var(--ems); box-shadow: inset 0 0 10px rgba(255,71,87,0.15); }
    .inmate-item.federal.served { border-left-color: var(--success); box-shadow: inset 0 0 15px rgba(46, 213, 115, 0.1); }

    .plate-tag { color: var(--warning); font-weight: bold; font-size: 1.1rem; }
    .meta-tag { color: #555; font-size: 0.75rem; margin-top: 4px; }

    .offense-badge {
        display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 0.65rem;
        font-weight: bold; text-transform: uppercase; margin-top: 6px;
    }
    .offense-rogue { background: rgba(255,165,2,0.15); color: var(--warning); border: 1px solid var(--warning); }
    .offense-forgery { background: rgba(255,0,68,0.15); color: var(--accent); border: 1px solid var(--accent); }
    .offense-911 { background: rgba(255,71,87,0.2); color: var(--ems); border: 1px solid var(--ems); }
    .offense-default { background: rgba(255,255,255,0.05); color: #888; border: 1px solid #555; }

    .mech-btn {
        padding: 10px 15px; border: 2px solid #000; cursor: pointer; font-weight: bold;
        text-transform: uppercase; font-size: 0.7rem; box-shadow: 0 3px 0 #000;
        transition: all 0.1s; font-family: monospace; border-radius: 4px; flex-shrink: 0;
    }
    .mech-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #000; }
    .mech-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .btn-release { background: linear-gradient(145deg, #2ed573, #1e9e55); color: #fff; }
    .btn-release:disabled { background: #555; }

    .inmate-list::-webkit-scrollbar { width: 6px; }
    .inmate-list::-webkit-scrollbar-track { background: #000; border: 1px solid var(--border); }
    .inmate-list::-webkit-scrollbar-thumb { background: var(--accent); border: 1px solid #000; }

    .cell-block { 
        display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 15px; flex-shrink: 0;
    }
    .cell { 
        background: #000; border: 1px solid var(--border); height: 60px; border-radius: 4px;
        display: flex; align-items: center; justify-content: center; font-size: 0.7rem; color: #333; text-align:center; padding:5px;
        flex-direction: column; gap: 3px;
    }
    .cell.occupied { border-color: var(--danger); color: var(--danger); box-shadow: inset 0 0 10px rgba(255,0,68,0.2); }
    .cell.served { border-color: var(--success); color: var(--success); box-shadow: inset 0 0 10px rgba(46,213,115,0.2); }
    .cell.federal { border-color: var(--ems); color: var(--ems); box-shadow: inset 0 0 10px rgba(255,71,87,0.15); }
    .cell.federal.served { border-color: var(--success); color: var(--success); box-shadow: inset 0 0 10px rgba(46,213,115,0.2); }
    .cell-day { font-size: 0.55rem; color: #555; }

    .sentence-bar {
        width: 100%; height: 4px; background: #333; border-radius: 2px; margin-top: 8px; overflow: hidden;
    }
    .sentence-fill { height: 100%; border-radius: 2px; transition: width 1s linear; }
    .sentence-fill.active { background: var(--warning); }
    .sentence-fill.complete { background: var(--success); }

    .facility-tag {
        font-size: 0.65rem; padding: 2px 6px; border-radius: 2px; margin-top: 4px; display: inline-block;
    }
    .facility-central { background: rgba(255,165,2,0.1); color: var(--warning); }
    .facility-max { background: rgba(255,0,68,0.1); color: var(--accent); }
    .facility-federal { background: rgba(255,71,87,0.15); color: var(--ems); border: 1px solid var(--ems); }

    @media (max-width: 1024px) {
        .main-layout { grid-template-columns: 1fr; overflow-y: auto; }
        .cell-block { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 600px) {
        .top-bar h1 { font-size: 0.7rem; }
        .main-layout { padding: 10px; }
        .inmate-item { flex-direction: column; align-items: flex-start; }
        .cell-block { grid-template-columns: repeat(2, 1fr); }
    }
</style>
</head>
<body>

<div class="top-bar">
    <h1>▸ NHAI_PRISON // DETENTION_TERMINAL_v8.0</h1>
    <div class="time" id="clock">00:00:00</div>
</div>

<div class="main-layout">
    <div class="panel">
        <div class="panel-title">■ Central Detention Block</div>
        
        <div class="stat-row">
            <div class="stat-box">
                <div class="stat-num" style="color:var(--danger);" id="stat-active">0</div>
                <div class="stat-label">Active Inmates</div>
            </div>
            <div class="stat-box">
                <div class="stat-num" style="color:var(--success);" id="stat-released">0</div>
                <div class="stat-label">Discharged</div>
            </div>
            <div class="stat-box">
                <div class="stat-num" style="color:var(--warning);" id="stat-parole">0</div>
                <div class="stat-label">Parole Ready</div>
            </div>
        </div>

        <div style="color: #555; font-size: 0.75rem; margin-bottom: 10px;">
            Holding Cells (Max 12)
        </div>
        <div class="cell-block" id="cellGrid"></div>

        <div style="color: #555; font-size: 0.75rem; margin-top: auto; border-top: 1px solid var(--border); padding-top: 15px;">
            SYSTEM NOTE: Inmates serve sentences in real-time (1 sec = 1 day). Federal holds require 120 days.
        </div>
    </div>

    <div class="panel">
        <div class="panel-title">■ Active Inmate Roster</div>
        <div class="inmate-list" id="inmate-list">
            <div style="color:#555; text-align:center; padding:40px;">NO INMATES IN CUSTODY</div>
        </div>
    </div>
</div>

<script>
    let sharedData = { 
        revenue: 0, valids: 0, missed: 0, level: 1, rankPoints: 0, 
        history: [], registry: {}, forgedAliases: {}, nextSpawnOverride: null,
        activeInmates: [], releasedInmates: [], inbox: [], sentMail: [], call911Logs: [],
        ledgerCashouts: [], intelFlags: [], paroleRecords: [], iaViolations: [], rehabPrograms: []
    };

    function updateClock() { document.getElementById('clock').innerText = new Date().toLocaleTimeString('en-GB'); }
    setInterval(updateClock, 1000);

    const HASH_SALT = "ENFORCE_V23_SECURE_SALT";
    function generateSignature(dataStr) {
        let hash = 0;
        const str = HASH_SALT + dataStr;
        for (let i = 0; i < str.length; i++) {
            const char = str.charCodeAt(i);
            hash = ((hash << 5) - hash) + char;
            hash = hash & hash; 
        }
        return hash.toString(16);
    }

    function repairInmateData(inmate) {
        if (!inmate) return inmate;
        if (inmate.sentenceDays === undefined || inmate.sentenceDays === null) {
            if (inmate.offense === "911 FELONY" || inmate.facility === "FEDERAL HOLD") inmate.sentenceDays = 120;
            else if (inmate.offense === "FORGERY & FUGITIVE" || inmate.facility === "MAXIMUM SECURITY") inmate.sentenceDays = 90;
            else inmate.sentenceDays = 60;
        }
        if (inmate.sentenceRemaining === undefined || inmate.sentenceRemaining === null) inmate.sentenceRemaining = inmate.sentenceDays;
        inmate.sentenceRemaining = Math.max(0, inmate.sentenceRemaining);
        inmate.sentenceDays = Math.max(1, inmate.sentenceDays);
        if (!inmate.offense) inmate.offense = "WARRANT / ROGUE";
        if (!inmate.facility) inmate.facility = "CENTRAL DETENTION";
        if (!inmate.realPlate) inmate.realPlate = inmate.plate || "UNKNOWN";
        if (!inmate.id) inmate.id = "MISSING";
        if (!inmate.dateArrested) inmate.dateArrested = new Date().toLocaleDateString();
        if (!inmate.status) inmate.status = "ARRESTED";
        return inmate;
    }

    function loadData() {
        const savedData = localStorage.getItem('enforcementTerminalV23');
        const savedSig = localStorage.getItem('enforcementTerminalV23_sig');
        if (savedData) {
            try {
                if (savedSig !== generateSignature(savedData)) {
                    console.error("PRISON SECURITY BREACH: Data tampering detected! Wiping corrupted data.");
                    localStorage.removeItem('enforcementTerminalV23');
                    localStorage.removeItem('enforcementTerminalV23_sig');
                    return;
                }
                const parsed = JSON.parse(savedData);
                sharedData = parsed;
                
                if(!sharedData.registry) sharedData.registry = {};
                if(!sharedData.forgedAliases) sharedData.forgedAliases = {};
                if(sharedData.nextSpawnOverride === undefined) sharedData.nextSpawnOverride = null;
                if(!sharedData.activeInmates) sharedData.activeInmates = [];
                if(!sharedData.releasedInmates) sharedData.releasedInmates = [];
                if(!sharedData.inbox) sharedData.inbox = [];
                if(!sharedData.sentMail) sharedData.sentMail = [];
                if(!sharedData.call911Logs) sharedData.call911Logs = [];
                if(!sharedData.ledgerCashouts) sharedData.ledgerCashouts = [];
                if(!sharedData.intelFlags) sharedData.intelFlags = [];
                if(!sharedData.paroleRecords) sharedData.paroleRecords = [];
                if(!sharedData.iaViolations) sharedData.iaViolations = [];
                if(!sharedData.rehabPrograms) sharedData.rehabPrograms = [];
                if(!sharedData.history) sharedData.history = [];

                let needsSave = false;
                sharedData.activeInmates.forEach((inmate, i) => {
                    const before = JSON.stringify(inmate);
                    sharedData.activeInmates[i] = repairInmateData(inmate);
                    if (JSON.stringify(sharedData.activeInmates[i]) !== before) needsSave = true;
                });
                if (needsSave) saveData();

            } catch(e) { console.error("Load error:", e); }
        }
        renderDashboard();
    }

    function saveData() {
        const dataStr = JSON.stringify(sharedData);
        localStorage.setItem('enforcementTerminalV23', dataStr);
        localStorage.setItem('enforcementTerminalV23_sig', generateSignature(dataStr));
    }

    function releaseInmate(index) {
        if(index < 0 || index >= sharedData.activeInmates.length) return;
        
        loadData(); // Fetch latest before modifying
        let inmate = sharedData.activeInmates.splice(index, 1)[0];
        inmate.dateReleased = new Date().toLocaleDateString();
        inmate.status = "RELEASED";
        
        sharedData.releasedInmates.push(inmate);
        
        // Cross-terminal history & system tracking
        sharedData.history.push({ plate: inmate.plate, id: inmate.id, action: "PAROLE / RELEASED", timestamp: new Date().toLocaleTimeString() });
        if(!sharedData.paroleRecords) sharedData.paroleRecords = [];
        sharedData.paroleRecords.push({ plate: inmate.plate, id: inmate.id, releaseDate: inmate.dateReleased });
        if(!sharedData.rehabPrograms) sharedData.rehabPrograms = [];
        sharedData.rehabPrograms.push({ plate: inmate.plate, id: inmate.id, program: "STANDARD PAROLE", status: "ACTIVE" });
        
        // Clear from registry if still listed as wanted
        if (sharedData.registry[inmate.plate]) {
            sharedData.registry[inmate.plate].status = "CLEAR";
            sharedData.registry[inmate.plate].registeredBy = "NHAI_PAROLE_BOARD";
        }
        
        saveData();
        renderDashboard();
    }

    function getOffenseBadgeClass(offense) {
        if (!offense) return 'offense-default';
        if (offense.includes('911') || offense.includes('FELONY')) return 'offense-911';
        if (offense.includes('FORGERY')) return 'offense-forgery';
        if (offense.includes('ROGUE') || offense.includes('WARRANT')) return 'offense-rogue';
        return 'offense-default';
    }

    function getFacilityTagClass(facility) {
        if (!facility) return 'facility-central';
        if (facility.includes('FEDERAL')) return 'facility-federal';
        if (facility.includes('MAXIMUM')) return 'facility-max';
        return 'facility-central';
    }

    function isFederalInmate(inmate) {
        return inmate.facility === "FEDERAL HOLD" || (inmate.offense && inmate.offense.includes('911'));
    }

    function renderDashboard() {
        const activeCount = sharedData.activeInmates.length;
        const releasedCount = sharedData.releasedInmates.length;
        const paroleCount = sharedData.activeInmates.filter(i => i.sentenceRemaining <= 0).length;

        document.getElementById('stat-active').innerText = activeCount;
        document.getElementById('stat-released').innerText = releasedCount;
        document.getElementById('stat-parole').innerText = paroleCount;

        const cellGrid = document.getElementById('cellGrid');
        cellGrid.innerHTML = '';
        for(let i = 0; i < 12; i++) {
            const cell = document.createElement('div');
            if (i < activeCount) {
                const inmate = sharedData.activeInmates[i];
                const isServed = inmate.sentenceRemaining <= 0;
                const isFed = isFederalInmate(inmate);
                let cellClass = 'cell';
                if (isFed && !isServed) cellClass += ' federal';
                else if (isServed) cellClass += ' served';
                else cellClass += ' occupied';
                cell.className = cellClass;
                
                const remaining = inmate.sentenceRemaining || 0;
                cell.innerHTML = `<span>${inmate.plate}</span><span class="cell-day">${isServed ? 'DONE' : remaining + 'd left'}</span>`;
            } else {
                cell.className = 'cell';
                cell.innerText = 'EMPTY';
            }
            cellGrid.appendChild(cell);
        }

        const listContainer = document.getElementById('inmate-list');
        listContainer.innerHTML = '';

        if (activeCount === 0 && releasedCount === 0) {
            listContainer.innerHTML = '<div style="color:#555; text-align:center; padding:40px;">NO INMATES IN CUSTODY</div>';
            return;
        }

        const sortedInmates = [...sharedData.activeInmates].sort((a, b) => {
            const aFed = isFederalInmate(a) ? 0 : 1;
            const bFed = isFederalInmate(b) ? 0 : 1;
            if (aFed !== bFed) return aFed - bFed;
            return (a.sentenceRemaining || 0) - (b.sentenceRemaining || 0);
        });

        sortedInmates.forEach((inmate) => {
            const originalIndex = sharedData.activeInmates.indexOf(inmate);
            const isServed = inmate.sentenceRemaining <= 0;
            const isFed = isFederalInmate(inmate);
            
            let itemClass = 'inmate-item';
            if (isFed && !isServed) itemClass += ' federal';
            if (isServed) itemClass += isFed ? ' federal served' : ' served';
            
            const totalSentence = inmate.sentenceDays || 60;
            const timeServed = totalSentence - (inmate.sentenceRemaining || 0);
            const percentServed = Math.min(100, Math.max(0, (timeServed / totalSentence) * 100));

            const offenseBadge = `<span class="offense-badge ${getOffenseBadgeClass(inmate.offense)}">${inmate.offense || 'UNKNOWN'}</span>`;
            const facilityTag = `<span class="facility-tag ${getFacilityTagClass(inmate.facility)}">${inmate.facility || 'CENTRAL DETENTION'}</span>`;

            const item = document.createElement('div');
            item.className = itemClass;
            item.innerHTML = `
                <div style="flex:1;">
                    <div class="plate-tag">${inmate.plate}</div>
                    <div class="meta-tag">Real Plate: ${inmate.realPlate || inmate.plate || 'N/A'} | ID: ${inmate.id || 'MISSING'}</div>
                    <div style="margin-top:6px;">${offenseBadge} ${facilityTag}</div>
                    <div class="meta-tag" style="color:${isServed ? 'var(--success)' : '#888'}; margin-top:6px;">
                        ${isServed ? '✔ SENTENCE SERVED — ELIGIBLE FOR RELEASE' : `Time Remaining: ${inmate.sentenceRemaining} / ${totalSentence} Days`}
                    </div>
                    <div class="sentence-bar">
                        <div class="sentence-fill ${isServed ? 'complete' : 'active'}" style="width:${percentServed}%"></div>
                    </div>
                </div>
                <button class="mech-btn btn-release" onclick="releaseInmate(${originalIndex})" ${!isServed ? 'disabled' : ''}>
                    ${isServed ? 'RELEASE' : 'LOCKED'}
                </button>
            `;
            listContainer.appendChild(item);
        });

        sharedData.releasedInmates.slice(-3).reverse().forEach(inmate => {
            const item = document.createElement('div');
            item.className = 'inmate-item released';
            item.innerHTML = `
                <div>
                    <div class="plate-tag" style="color:#555;">${inmate.plate} (SERVED)</div>
                    <div class="meta-tag">Offense: ${inmate.offense || 'N/A'} | Released: ${inmate.dateReleased || 'N/A'}</div>
                </div>
                <div style="color:var(--success); font-size:0.7rem;">DISCHARGED</div>
            `;
            listContainer.appendChild(item);
        });
    }

    // --- SENTENCE TIMER ENGINE ---
    setInterval(() => {
        let needsRender = false;
        let needsSave = false; // Only save if time actually ticks down
        
        sharedData.activeInmates.forEach(inmate => {
            if (inmate.sentenceRemaining === undefined || inmate.sentenceRemaining === null) {
                inmate.sentenceRemaining = inmate.sentenceDays || 60;
            }
            if (inmate.sentenceRemaining > 0) {
                inmate.sentenceRemaining--;
                needsRender = true;
                needsSave = true;
            }
        });

        if (needsRender) {
            renderDashboard();
            if (needsSave) {
                saveData(); // Save to sync with other terminals
            }
        }
    }, 1000);

    // Initial load and live sync
    loadData();
    setInterval(loadData, 2000);
</script>
</body>
</html>
