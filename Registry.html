<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="https://mohammad3230.github.io/PROJECT/favicon.png" type="image/png" sizes="32x32" />
<script async src="https://www.googletagmanager.com/gtag/js?id=GT-NC6T5LRJ"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'GT-NC6T5LRJ');
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NHAI - Registry & Database Terminal</title>
<style>
    :root {
        --bg: #0a0a10; --panel: #12121a; --accent: #00d9ff; --success: #2ed573;
        --danger: #ff4757; --warning: #ffa502; --border: #2a2a3a;
    }

    body {
        background-color: var(--bg); color: #ccc; font-family: 'Courier New', monospace;
        margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    }

    .top-bar {
        background: #000; padding: 15px 20px; border-bottom: 2px solid var(--warning);
        display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
    }

    .top-bar h1 { margin: 0; font-size: 1rem; color: var(--warning); letter-spacing: 1px; }
    .top-bar .time { color: var(--accent); font-size: 0.8rem; }

    .main-grid {
        display: grid; grid-template-columns: 380px 1fr; gap: 20px; padding: 20px;
        flex-grow: 1; min-height: 0; overflow: hidden;
    }

    .form-panel, .list-panel {
        background: var(--panel); border: 1px solid var(--border); border-radius: 4px;
        padding: 20px; display: flex; flex-direction: column; overflow: hidden;
    }

    .panel-title {
        color: var(--accent); font-size: 0.9rem; border-bottom: 1px solid var(--border);
        padding-bottom: 10px; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px;
        flex-shrink: 0;
    }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 0.75rem; color: #888; margin-bottom: 5px; }
    .form-group input, .form-group select {
        width: 100%; background: #000; border: 1px solid var(--border); color: var(--success);
        padding: 12px; box-sizing: border-box; font-family: monospace; font-size: 1rem; outline: none;
    }
    .form-group input:focus, .form-group select:focus { border-color: var(--accent); }

    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: auto; flex-shrink: 0;}
    
    .mech-btn {
        padding: 12px; border: 2px solid #000; cursor: pointer; font-weight: bold;
        text-transform: uppercase; font-size: 0.8rem; box-shadow: 0 3px 0 #000;
        transition: all 0.1s; font-family: monospace;
    }
    .mech-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #000; }
    
    .btn-register { background: var(--success); color: #000; }
    .btn-clear { background: #555; color: #fff; }

    .list-header {
        display: grid; grid-template-columns: 1.5fr 1fr 1.2fr 1.3fr; gap: 10px;
        font-size: 0.7rem; color: var(--accent); padding-bottom: 10px; border-bottom: 1px solid var(--border);
        flex-shrink: 0;
    }
    
    .list-scroll { 
        flex-grow: 1; overflow-y: auto; margin-top: 10px; padding-right: 5px;
    }

    .list-scroll::-webkit-scrollbar { width: 8px; }
    .list-scroll::-webkit-scrollbar-track { background: #000; border: 1px solid var(--border); }
    .list-scroll::-webkit-scrollbar-thumb { background: var(--accent); border: 1px solid #000; }
    .list-scroll::-webkit-scrollbar-thumb:hover { background: #00a8b3; }
    
    .list-item {
        display: grid; grid-template-columns: 1.5fr 1fr 1.2fr 1.3fr; gap: 10px;
        padding: 12px 0; border-bottom: 1px dashed var(--border); font-size: 0.85rem; align-items: center;
    }
    
    .plate-tag { color: var(--warning); font-weight: bold; }
    .status-tag { font-weight: bold; font-size: 0.75rem; padding: 4px; text-align: center; border-radius: 3px; display: inline-block; width: 100%; box-sizing: border-box;}
    .status-clear { background: rgba(46, 213, 115, 0.2); color: var(--success); }
    .status-wanted { background: rgba(255, 71, 87, 0.2); color: var(--danger); animation: pulse 1s infinite; }
    
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

    .action-btns { display: flex; gap: 5px; }
    .sm-btn { 
        background: #333; border: 1px solid #555; color: #fff; padding: 4px 8px; 
        cursor: pointer; font-size: 0.7rem; font-family: monospace; flex: 1; text-align: center;
    }
    .sm-btn:hover { background: #444; }

    @media (max-width: 1024px) {
        .main-grid { grid-template-columns: 1fr; overflow-y: auto; }
        body { overflow: auto; }
        .form-panel { border-bottom: 2px solid var(--border); max-height: none; }
        .list-panel { min-height: 60vh; }
    }

    @media (max-width: 600px) {
        .top-bar { padding: 10px 15px; }
        .top-bar h1 { font-size: 0.8rem; letter-spacing: 0.5px; }
        .main-grid { padding: 15px; gap: 15px; }
        .btn-grid { grid-template-columns: 1fr; }
        .list-header { grid-template-columns: 1.2fr 1fr 1.5fr; }
        .list-header div:nth-child(2) { display: none; }
        .list-item { 
            grid-template-columns: 1.2fr 1fr 1.5fr; 
            font-size: 0.8rem;
        }
        .list-item .hide-mobile { display: none; }
        .action-btns { flex-direction: column; gap: 3px; }
        .status-tag { font-size: 0.65rem; padding: 2px; }
    }
</style>
</head>
<body>

<div class="top-bar">
    <h1>▸ NHAI_REGISTRY // DB_TERMINAL_v4.1</h1>
    <div class="time" id="clock">00:00:00</div>
</div>

<div class="main-grid">
    <div class="form-panel">
        <div class="panel-title">■ Citizen / Vehicle Registration</div>
        
        <div class="form-group">
            <label>License Plate (Format: XX-0000)</label>
            <input type="text" id="inp-plate" placeholder="e.g. PX-1234" maxlength="8">
        </div>
        <div class="form-group">
            <label>Driver License ID</label>
            <input type="text" id="inp-id" placeholder="e.g. DL-8901" maxlength="10">
        </div>
        <div class="form-group">
            <label>Vehicle Class</label>
            <select id="inp-class">
                <option value="LVM_CLASS_1">LVM_CLASS_1 (Car)</option>
                <option value="HVM_CLASS_2">HVM_CLASS_2 (Truck)</option>
                <option value="GOV_CLASS_0">GOV_CLASS_0 (Official)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Criminal Status</label>
            <select id="inp-status">
                <option value="CLEAR">CLEAR</option>
                <option value="WANTED">WANTED (APB)</option>
            </select>
        </div>

        <div class="btn-grid">
            <button class="mech-btn btn-register" onclick="registerVehicle()">REGISTER</button>
            <button class="mech-btn btn-clear" onclick="clearForm()">CLEAR</button>
        </div>
    </div>

    <div class="list-panel">
        <div class="panel-title">■ Active Network Database</div>
        <div class="list-header">
            <div>PLATE</div>
            <div>DL ID</div>
            <div>CLASS</div>
            <div>STATUS / ACTION</div>
        </div>
        <div class="list-scroll" id="db-list">
            <!-- Items will populate here -->
        </div>
    </div>
</div>

<script>
    let sharedData = { 
        revenue: 0, valids: 0, missed: 0, level: 1, rankPoints: 0, 
        history: [], registry: {}, forgedAliases: {}, nextSpawnOverride: null,
        activeInmates: [], releasedInmates: [], inbox: [], sentMail: [], call911Logs: [],
        ledgerCashouts: [], intelFlags: [], paroleRecords: [], iaViolations: [], rehabPrograms: []
    };

    function updateClock() {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString('en-GB');
    }
    setInterval(updateClock, 1000);

    const HASH_SALT = "ENFORCE_V23_SECURE_SALT";
    function generateSignature(dataStr) {
        let hash = 0;
        const str = HASH_SALT + dataStr;
        for (let i = 0; i < str.length; i++) {
            const char = str.charCodeAt(i);
            hash = ((hash << 5) - hash) + char;
            hash = hash & hash; 
        }
        return hash.toString(16);
    }

    function loadData() {
        const savedData = localStorage.getItem('enforcementTerminalV23');
        const savedSig = localStorage.getItem('enforcementTerminalV23_sig');
        
        if (savedData) {
            try {
                if (savedSig !== generateSignature(savedData)) {
                    console.error("SECURITY BREACH: Data tampering detected! Wiping corrupted data.");
                    localStorage.removeItem('enforcementTerminalV23');
                    localStorage.removeItem('enforcementTerminalV23_sig');
                    return;
                }
                const parsed = JSON.parse(savedData);
                sharedData = parsed;
                
                // Compatibility checks for full sync
                if(!sharedData.registry) sharedData.registry = {};
                if(!sharedData.forgedAliases) sharedData.forgedAliases = {};
                if(sharedData.nextSpawnOverride === undefined) sharedData.nextSpawnOverride = null;
                if(!sharedData.activeInmates) sharedData.activeInmates = [];
                if(!sharedData.releasedInmates) sharedData.releasedInmates = [];
                if(!sharedData.inbox) sharedData.inbox = [];
                if(!sharedData.sentMail) sharedData.sentMail = [];
                if(!sharedData.call911Logs) sharedData.call911Logs = [];
                if(!sharedData.ledgerCashouts) sharedData.ledgerCashouts = [];
                if(!sharedData.intelFlags) sharedData.intelFlags = [];
                if(!sharedData.paroleRecords) sharedData.paroleRecords = [];
                if(!sharedData.iaViolations) sharedData.iaViolations = [];
                if(!sharedData.rehabPrograms) sharedData.rehabPrograms = [];
                if(!sharedData.history) sharedData.history = [];
            } catch(e) {
                console.error("Corrupted save data, resetting."); 
                localStorage.removeItem('enforcementTerminalV23');
                localStorage.removeItem('enforcementTerminalV23_sig');
            }
        }
        renderDBList();
    }

    function saveData() {
        const dataStr = JSON.stringify(sharedData);
        localStorage.setItem('enforcementTerminalV23', dataStr);
        localStorage.setItem('enforcementTerminalV23_sig', generateSignature(dataStr));
    }

    function clearForm() {
        document.getElementById('inp-plate').value = '';
        document.getElementById('inp-id').value = '';
        document.getElementById('inp-class').value = 'LVM_CLASS_1';
        document.getElementById('inp-status').value = 'CLEAR';
    }

    function registerVehicle() {
        const plate = document.getElementById('inp-plate').value.toUpperCase().trim();
        const id = document.getElementById('inp-id').value.toUpperCase().trim();
        const vClass = document.getElementById('inp-class').value;
        const status = document.getElementById('inp-status').value;

        if (!plate || !id) {
            alert("ERROR: Plate and DL ID are required.");
            return;
        }

        loadData(); // Fetch latest data before overwriting

        sharedData.registry[plate] = {
            id: id,
            vClass: vClass,
            status: status,
            registeredBy: "NHAI_DB_TERMINAL", // Sync tag for Enforcement Terminal
            d5Status: status === 'WANTED' ? 'REJECTED' : 'APPROVED'
        };

        saveData();
        renderDBList();
        clearForm();
    }

    function toggleStatus(plate) {
        if (sharedData.registry[plate]) {
            loadData(); // Fetch latest
            let currentStatus = sharedData.registry[plate].status;
            const newStatus = currentStatus === 'CLEAR' ? 'WANTED' : 'CLEAR';
            
            sharedData.registry[plate].status = newStatus;
            sharedData.registry[plate].d5Status = newStatus === 'WANTED' ? 'REJECTED' : 'APPROVED';
            
            saveData();
            renderDBList();
        }
    }

    function deleteRecord(plate) {
        if (sharedData.registry[plate]) {
            loadData(); // Fetch latest
            delete sharedData.registry[plate];
            saveData();
            renderDBList();
        }
    }

    function renderDBList() {
        const listContainer = document.getElementById('db-list');
        listContainer.innerHTML = '';

        const registry = sharedData.registry || {};
        const keys = Object.keys(registry);

        if (keys.length === 0) {
            listContainer.innerHTML = `<div style="text-align:center; color:#555; padding:20px;">NO CUSTOM RECORDS IN DATABASE</div>`;
            return;
        }

        keys.forEach(plate => {
            const record = registry[plate];
            const item = document.createElement('div');
            item.className = 'list-item';
            
            const statusClass = record.status === 'WANTED' ? 'status-wanted' : 'status-clear';
            const toggleBtnText = record.status === 'WANTED' ? 'CLEAR' : 'WANTED';

            item.innerHTML = `
                <div class="plate-tag">${plate}</div>
                <div class="hide-mobile">${record.id || 'N/A'}</div>
                <div style="font-size:0.75rem;">${record.vClass || 'N/A'}</div>
                <div class="action-btns">
                    <div class="status-tag ${statusClass}">${record.status}</div>
                    <button class="sm-btn" onclick="toggleStatus('${plate}')">${toggleBtnText}</button>
                    <button class="sm-btn" style="color:var(--danger)" onclick="deleteRecord('${plate}')">DEL</button>
                </div>
            `;
            listContainer.appendChild(item);
        });
    }

    // Initial load and live sync
    loadData();
    setInterval(loadData, 2000);

</script>
</body>
</html>
