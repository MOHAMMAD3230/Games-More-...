<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHAI - Distance Based Toll Terminal</title>
    <style>
        :root { 
            --neon: #00d9ff; --error: #ff4757; --success: #2ed573; 
            --gold: #ffa502; --frame-bg: #2c2c2c; --body-bg: #0f0f0f;
            --screen-bg: #000b1a; --danger-bg: #1a0005; --warning-bg: #1a1200;
        }

        body { 
            background: var(--body-bg); display: flex; justify-content: center; 
            align-items: center; height: 100vh; margin: 0; 
            font-family: 'Courier New', monospace; color: white; overflow: hidden;
        }

        .console-unit { 
            background: var(--frame-bg); padding: 15px; border-radius: 12px; 
            border: 8px solid #1a1a1a; box-shadow: 0 20px 50px #000;
            display: flex; flex-direction: column; gap: 12px; width: 100%; 
            max-width: 1150px; box-sizing: border-box; height: 100vh;
        }

        .header-bar { 
            display: flex; justify-content: space-between; 
            border-bottom: 2px solid #444; padding-bottom: 8px; font-size: 13px; flex-shrink: 0;
        }

        .shared-stats { 
            display:flex; justify-content:space-around; background:#000; padding:8px; 
            border-bottom:2px solid #444; font-size:11px; font-weight:bold; color:var(--neon); flex-shrink: 0;
        }

        .workspace { display: flex; gap: 15px; align-items: stretch; flex-grow: 1; min-height: 0; }

        .sidebar { 
            display: flex; flex-direction: column; gap: 8px; width: 200px; 
            background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; border: 1px solid #444; flex-shrink: 0;
        }

        .display-unit { flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 12px; min-width: 0;}

        #screen { 
            width: 100%; flex-grow: 1; min-height: 120px; max-height: 180px; background: var(--screen-bg); 
            border: 4px solid #111; border-radius: 6px; padding: 15px; 
            box-sizing: border-box; color: var(--neon); position: relative;
            box-shadow: inset 0 0 20px #000; overflow: hidden;
            transition: background 0.5s, border-color 0.5s;
        }

        #screen.danger-mode { background: var(--danger-bg); border-color: var(--error); }
        #screen.warning-mode { background: var(--warning-bg); border-color: var(--gold); }

        #scr-body { font-size: 15px; text-align: center; margin-top: 10px; line-height: 1.4; }
        .sensor-tag { position: absolute; top: 8px; left: 10px; font-size: 9px; color: var(--gold); }
        #clock { position: absolute; top: 8px; right: 10px; font-size: 11px; }

        .keypad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; flex-shrink: 0; }
        .num-key { 
            width: 50px; height: 40px; background: #ccc; border: none; 
            font-weight: bold; font-size: 16px; border-radius: 3px; 
            cursor: pointer; box-shadow: 0 3px 0 #777; color: #222;
        }
        .num-key:active { transform: translateY(2px); box-shadow: 0 1px 0 #777; }

        .mech-btn { 
            width: 100%; padding: 8px; background: linear-gradient(145deg, #eee, #999); 
            border: 2px solid #333; border-radius: 4px; cursor: pointer; 
            font-weight: bold; color: #222; box-shadow: 0 3px 0 #111;
            text-transform: uppercase; font-size: 9px; text-align: left;
        }
        .mech-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #111; }
        .mech-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        
        .mech-btn.blue { background: linear-gradient(145deg, #3498db, #2980b9); color: white; }
        .mech-btn.gold { background: linear-gradient(145deg, #f1c40f, #f39c12); text-align: center; }
        .mech-btn.red { background: linear-gradient(145deg, #e74c3c, #c0392b); color: white; text-align: center; }
        .mech-btn.purple { background: linear-gradient(145deg, #a55eea, #8854d0); color: white; }
        .mech-btn.police { background: linear-gradient(145deg, #ff0044, #99002a); color: white; text-align: center; animation: pulsePolice 1.5s infinite; }

        .payment-bank { width: 200px; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
        .user-card { 
            background: #1a1a1a; padding: 8px; border: 1px solid #333; 
            border-radius: 5px; font-size: 10px; display: flex; align-items: center; gap: 8px; 
        }

        .printer-slot { height: 70px; background: #050505; border: 2px solid #222; position: relative; overflow: hidden; margin-top: auto; }
        .receipt { 
            width: 85%; background: #fff; color: #000; position: absolute; 
            top: -180%; left: 7.5%; padding: 8px; font-size: 9px; text-align: center; 
        }
        .print-active { top: 5px; transition: 1.2s ease-in-out; }

        /* Database Panel */
        .db-panel { 
            width: 240px; background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; border: 1px solid #444;
            display: flex; flex-direction: column; gap: 10px; flex-shrink: 0;
        }
        .db-title { font-size: 0.7rem; color: var(--neon); border-bottom: 1px solid #444; padding-bottom: 5px; text-transform: uppercase; }
        .db-box { 
            flex-grow: 1; background: #000; border: 1px solid #222; padding: 15px; border-radius: 4px;
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
        }
        .db-status { font-size: 2rem; font-weight: 900; }
        .db-clear { color: var(--success); text-shadow: 0 0 10px rgba(46, 213, 115, 0.5); }
        .db-wanted { color: var(--error); text-shadow: 0 0 10px rgba(255, 71, 87, 0.5); animation: pulseDanger 1s infinite; }
        .db-unknown { color: var(--gold); text-shadow: 0 0 10px rgba(255, 165, 2, 0.5); }
        .db-plate-display { font-size: 1.2rem; color: var(--gold); margin-top: 10px; font-weight: bold; word-break: break-all; }
        .db-details { font-size: 0.75rem; color: #888; margin-top: 5px; }

        .scan-line { width: 100%; height: 1px; background: var(--neon); position: absolute; top: 0; left: 0; opacity: 0.5; animation: scan 1.5s infinite linear; display: none;}
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
        @keyframes pulseDanger { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        @keyframes pulsePolice { 0% { background: linear-gradient(145deg, #ff0044, #99002a); } 50% { background: linear-gradient(145deg, #ff4757, #cc2233); } 100% { background: linear-gradient(145deg, #ff0044, #99002a); } }

        /* --- RESPONSIVE DESIGN --- */
        @media (max-width: 1024px) {
            body { align-items: flex-start; }
            .console-unit { height: auto; min-height: 100vh; border: none; border-radius: 0; padding: 10px; }
            .workspace { flex-wrap: wrap; }
            .sidebar { width: 100%; flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 5px; }
            .sidebar .mech-btn { width: auto; flex: 1 1 30%; min-width: 100px; }
            .sidebar hr { display: none; }
            .display-unit { width: 100%; order: -1; }
            #screen { max-height: 150px; }
            .payment-bank { width: 100%; flex-direction: row; flex-wrap: wrap; align-items: center; }
            .user-card { flex: 1; min-width: 150px; }
            .printer-slot { width: 100%; height: 50px; }
            .db-panel { width: 100%; flex-direction: row; align-items: center; }
            .db-title { border-bottom: none; border-right: 1px solid #444; padding-right: 10px; padding-bottom: 0; width: 100px; }
            .db-box { padding: 10px; flex-direction: row; gap: 15px; justify-content: flex-start; }
            .db-plate-display { margin-top: 0; font-size: 1rem; }
            .db-details { margin-top: 0; }
        }
        @media (max-width: 600px) {
            .console-unit { padding: 5px; gap: 8px; }
            .shared-stats { font-size: 9px; padding: 5px; flex-wrap: wrap; gap: 5px; }
            .header-bar { font-size: 10px; }
            .num-key { width: 40px; height: 35px; font-size: 14px; }
            .db-panel { flex-direction: column; }
            .db-title { width: auto; border-right: none; border-bottom: 1px solid #444; padding-bottom: 5px; }
            .db-box { flex-direction: column; gap: 5px; }
        }
    </style>
</head>
<body>

<div class="console-unit">
    <div class="shared-stats">
        <div>SHARED_REVENUE: $<span id="sharedRev">0</span></div>
        <div>ENFORCEMENT_VALID: <span id="sharedVal" style="color:var(--success)">0</span></div>
        <div>NEXT_PLATE: <span id="sharedPlate" style="color:var(--gold)">---</span></div>
    </div>

    <div class="header-bar">
        <span style="color: var(--gold); font-weight: bold;">NHAI DISTANCE CALCULATOR | v3.0</span>
        <span id="clock">00:00:00</span>
    </div>

    <div class="workspace">
        <div class="sidebar">
            <div style="font-size: 9px; color: #888; width: 100%; text-align: center;">SELECT DESTINATION</div>
            <button class="mech-btn blue" onclick="setCity('MUMBAI', 150)" id="city-1" disabled>MUMBAI (150km)</button>
            <button class="mech-btn blue" onclick="setCity('PUNE', 220)" id="city-2" disabled>PUNE (220km)</button>
            <button class="mech-btn blue" onclick="setCity('NASHIK', 180)" id="city-3" disabled>NASHIK (180km)</button>
            <button class="mech-btn blue" onclick="setCity('SURAT', 280)" id="city-4" disabled>SURAT (280km)</button>
            <button class="mech-btn blue" onclick="setCity('LOCAL', 10)" id="city-5" disabled>LOCAL (10km)</button>
            
            <hr style="width: 100%; border: 0; border-top: 1px solid #444;">
            <button class="mech-btn gold" onclick="detectVehicle()">Detect Vehicle</button>
            <button class="mech-btn police" id="btn-patrol" onclick="dispatchPatrol()" disabled>Dispatch Patrol</button>
            <button class="mech-btn red" onclick="resetConsole()">Reset Console</button>
        </div>

        <div class="display-unit">
            <div id="screen">
                <div class="sensor-tag" id="scr-tag">BASE TOLL: $100</div>
                <div class="scan-line" id="scanner"></div>
                <div id="scr-body">TOLL SYSTEM READY<br>SCAN VEHICLE TO BEGIN</div>
            </div>

            <div class="keypad-grid">
                <button class="num-key" onclick="kp('1')">1</button>
                <button class="num-key" onclick="kp('2')">2</button>
                <button class="num-key" onclick="kp('3')">3</button>
                <button class="num-key" onclick="kp('4')">4</button>
                <button class="num-key" onclick="kp('5')">5</button>
                <button class="num-key" onclick="kp('6')">6</button>
                <button class="num-key" onclick="kp('7')">7</button>
                <button class="num-key" onclick="kp('8')">8</button>
                <button class="num-key" onclick="kp('9')">9</button>
                <button class="num-key" style="background:#ff4757" onclick="kc()">C</button>
                <button class="num-key" onclick="kp('0')">0</button>
                <button class="num-key" style="background:var(--success)" onclick="confirmAction()">✓</button>
            </div>
        </div>

        <div class="payment-bank">
            <div style="font-size: 9px; color: #888;">PAYMENT INTERFACE</div>
            <div class="user-card" id="card-0">
                <button class="mech-btn purple" style="width: 45px; padding: 5px;" onclick="initRecharge(0)">RECH</button>
                <button class="mech-btn" style="width: 40px; padding: 5px;" onclick="uSel(0)">PAY</button>
                <div>U:01 <span id="u0" style="color:var(--success)">$200</span></div>
            </div>
            <div class="user-card" id="card-1">
                <button class="mech-btn purple" style="width: 45px; padding: 5px;" onclick="initRecharge(1)">RECH</button>
                <button class="mech-btn" style="width: 40px; padding: 5px;" onclick="uSel(1)">PAY</button>
                <div>U:02 <span id="u1" style="color:var(--success)">$500</span></div>
            </div>

            <button class="mech-btn" id="btn-cash" onclick="initCashMode()" disabled>Cash Pay</button>

            <div class="printer-slot">
                <div id="paper" class="receipt">
                    <b id="rcp-head">TOLL RECEIPT</b><br>
                    <small id="rcp-date" style="font-size: 7px;"></small>
                    <hr>
                    <div id="rcp-v" style="font-size: 8px;"></div>
                    <div id="rcp-a" style="font-weight:bold; margin-top: 3px;"></div>
                </div>
            </div>
        </div>

        <!-- Security Re-Verification Database -->
        <div class="db-panel">
            <div class="db-title">■ Security Re-Verification</div>
            <div class="db-box" id="db-box">
                <div style="color:#555; font-size: 0.8rem;">NO VEHICLE DETECTED</div>
            </div>
        </div>
    </div>
</div>

<script>
    let mode = 'IDLE', vType = '', baseToll = 100, city = '', dist = 0, totalDue = 0, uIdx = null, inputBuffer = '', currentPlate = 'UNKNOWN';
    let currentVehicleStatus = 'CLEAR'; 
    const users = [ {bal: 200}, {bal: 500} ];
    const ratePerKm = 0.5; 

    let sharedData = { revenue: 0, valids: 0, missed: 0, level: 1, rankPoints: 0, history: [], registry: {}, forgedAliases: {}, nextSpawnOverride: null };

    function updateClock() { document.getElementById('clock').innerText = new Date().toLocaleTimeString('en-GB'); }
    setInterval(updateClock, 1000);

    function loadSharedData() {
        const saved = localStorage.getItem('enforcementTerminalV23');
        if (saved) {
            try {
                const parsed = JSON.parse(saved);
                sharedData = parsed;
                if(!sharedData.registry) sharedData.registry = {};
                if(!sharedData.forgedAliases) sharedData.forgedAliases = {};
                if(!sharedData.nextSpawnOverride) sharedData.nextSpawnOverride = null;
            } catch(e) {}
        }
        updateSharedUI();
    }

    function saveSharedData() {
        localStorage.setItem('enforcementTerminalV23', JSON.stringify(sharedData));
        updateSharedUI();
    }

    function updateSharedUI() {
        document.getElementById('sharedRev').innerText = sharedData.revenue;
        document.getElementById('sharedVal').innerText = sharedData.valids;
        
        if (sharedData.history && sharedData.history.length > 0) {
            const lastAction = sharedData.history[sharedData.history.length - 1];
            if(lastAction.action === "RELEASED") {
                currentPlate = lastAction.plate;
                document.getElementById('sharedPlate').innerText = currentPlate;
            } else {
                currentPlate = "UNKNOWN";
                document.getElementById('sharedPlate').innerText = "UNKNOWN (ROGUE)";
            }
        } else {
            currentPlate = "UNKNOWN";
            document.getElementById('sharedPlate').innerText = "---";
        }
    }

    function detectVehicle() {
        if(mode !== 'IDLE') return;
        loadSharedData(); 
        
        document.getElementById('scanner').style.display = 'block';
        updateScr("SCANNING AXLES & NETWORK...");
        
        setTimeout(() => {
            document.getElementById('scanner').style.display = 'none';
            vType = 'LVM_CLASS_1';
            mode = 'SELECT_CITY';
            
            let registryData = sharedData.registry[currentPlate];
            let forgeryData = sharedData.forgedAliases ? sharedData.forgedAliases[currentPlate] : null;
            
            let dbBox = document.getElementById('db-box');
            let screenDiv = document.getElementById('screen');
            
            currentVehicleStatus = 'CLEAR'; 
            document.getElementById('btn-patrol').disabled = true; // Hide patrol by default

            if (currentPlate === "UNKNOWN") {
                currentVehicleStatus = 'UNKNOWN';
                screenDiv.className = 'warning-mode';
                document.getElementById('btn-patrol').disabled = false; // SHOW PATROL BUTTON
                dbBox.innerHTML = `
                    <div class="db-status db-unknown">⚠ ROGUE</div>
                    <div class="db-plate-display">UNKNOWN</div>
                    <div class="db-details" style="color:var(--gold)">UNREGISTERED VEHICLE<br>DISPATCH PATROL OR PENALTY</div>
                `;
                updateScr(`VEHICLE: ${vType}<br>PLATE: <span style="color:var(--gold)">UNKNOWN</span> (ROGUE)<br>AWAITING ACTION`);
            }
            else if (forgeryData) {
                currentVehicleStatus = 'WANTED';
                screenDiv.className = 'danger-mode';
                dbBox.innerHTML = `
                    <div class="db-status db-wanted">⚠ WANTED</div>
                    <div class="db-plate-display">${currentPlate}</div>
                    <div class="db-details" style="color:var(--error)">FORGED ALIAS DETECTED<br>REAL PLATE: ${forgeryData.realPlate}</div>
                `;
                updateScr(`VEHICLE: ${vType}<br>PLATE: <span style="color:var(--error)">${currentPlate}</span> (SECURITY ALERT)<br>SELECT DESTINATION`);
            } 
            else if (registryData && registryData.status === 'WANTED') {
                currentVehicleStatus = 'WANTED';
                screenDiv.className = 'danger-mode';
                dbBox.innerHTML = `
                    <div class="db-status db-wanted">⚠ WANTED</div>
                    <div class="db-plate-display">${currentPlate}</div>
                    <div class="db-details" style="color:var(--error)">APB ACTIVE - DO NOT PAY TOLL</div>
                `;
                updateScr(`VEHICLE: ${vType}<br>PLATE: <span style="color:var(--error)">${currentPlate}</span> (WANTED)<br>SELECT DESTINATION`);
            } 
            else {
                currentVehicleStatus = 'CLEAR';
                screenDiv.className = ''; 
                let idDisplay = registryData ? registryData.id : "N/A";
                dbBox.innerHTML = `
                    <div class="db-status db-clear">✓ CLEAR</div>
                    <div class="db-plate-display">${currentPlate}</div>
                    <div class="db-details">ID: ${idDisplay}<br>NO ACTIVE WARRANTS</div>
                `;
                updateScr(`VEHICLE: ${vType}<br>PLATE: <span style="color:var(--gold)">${currentPlate}</span><br>BASE TOLL: $${baseToll}<br>SELECT DESTINATION`);
            }

            for(let i=1; i<=5; i++) document.getElementById('city-'+i).disabled = false;
        }, 1200);
    }

    function dispatchPatrol() {
        if(currentVehicleStatus !== 'UNKNOWN') return;

        // Generate a temporary hold plate
        let holdPlate = "HOLD-" + Math.floor(1000+Math.random()*9000);

        // 1. Add to Registry as WANTED so Dashboard 1 flags it immediately
        sharedData.registry[holdPlate] = {
            id: "MISSING", // Force them to need a new ID
            vClass: "ROGUE_CLASS",
            status: "WANTED",
            registeredBy: "NHAI_PATROL_DISPATCH"
        };

        // 2. Force Dashboard 1 to spawn this exact vehicle next!
        sharedData.nextSpawnOverride = holdPlate;

        // 3. Log the dispatch
        sharedData.history.push({
            plate: holdPlate,
            id: "PATROL_DISPATCH",
            action: "PATROL DISPATCHED",
            timestamp: new Date().toLocaleTimeString()
        });

        saveSharedData();

        updateScr(`<span style="color:var(--error)">PATROL DISPATCHED</span><br>VEHICLE HELD AS: ${holdPlate}<br>ENROUTE TO ENFORCEMENT GATE`);
        
        document.getElementById('btn-patrol').disabled = true;
        document.getElementById('btn-cash').disabled = true;
        for(let i=1; i<=5; i++) document.getElementById('city-'+i).disabled = true;

        // Auto reset after dispatch
        setTimeout(resetConsole, 3000);
    }

    function setCity(name, kms) {
        city = name; dist = kms;
        let distFare = kms * ratePerKm; 
        
        if(currentVehicleStatus === 'UNKNOWN') {
            totalDue = 500; // Flat Penalty Toll for Rogues
            mode = 'PAYMENT_SEL';
            updateScr(`DEST: ${name}<br><span style="color:var(--error)">PENALTY TOLL: $${totalDue}</span><br>CASH ONLY`);
            document.getElementById('btn-cash').disabled = false;
            document.getElementById('btn-patrol').disabled = false; // Keep patrol option open
        } 
        else {
            totalDue = baseToll + distFare; 
            mode = 'PAYMENT_SEL';
            if(currentVehicleStatus === 'WANTED') {
                updateScr(`DEST: ${city} (${kms}km)<br>DIST FARE: $${distFare}<br><span style="color:var(--error)">SECURITY LOCK - CASH ONLY</span>`);
                document.getElementById('btn-cash').disabled = false;
            } else {
                updateScr(`DEST: ${city} (${kms}km)<br>DIST FARE: $${distFare}<br><span style="color:var(--gold)">TOTAL DUE: $${totalDue}</span>`);
                document.getElementById('btn-cash').disabled = false;
            }
        }
    }

    function initRecharge(idx) {
        mode = 'RECHARGE'; uIdx = idx; inputBuffer = '';
        updateScr(`RECHARGE CARD 0${idx+1}<br>ENTER AMOUNT & PRESS ✓`);
    }

    function uSel(idx) {
        if(mode === 'PAYMENT_SEL') {
            if(currentVehicleStatus === 'WANTED' || currentVehicleStatus === 'UNKNOWN') {
                updateScr(`<span style="color:var(--error)">RFID BLOCKED:</span><br>SECURITY LOCK REQUIRES CASH`);
                return;
            }
            uIdx = idx; mode = 'PAY_RFID';
            updateScr(`RFID 0${idx+1}<br>BAL: $${users[idx].bal}<br>DEDUCT $${totalDue}? PRESS ✓`);
        }
    }

    function initCashMode() {
        if(mode === 'PAYMENT_SEL') {
            mode = 'PAY_CASH'; inputBuffer = '';
            if(currentVehicleStatus === 'WANTED') {
                updateScr(`WANTED VEHICLE<br>SECURITY TOLL: $${totalDue}<br>INPUT CASH TENDERED:`);
            } else if (currentVehicleStatus === 'UNKNOWN') {
                updateScr(`ROGUE VEHICLE<br>PENALTY TOLL: $${totalDue}<br>INPUT CASH TENDERED:`);
            } else {
                updateScr(`TOTAL: $${totalDue}<br>INPUT CASH TENDERED:`);
            }
        }
    }

    function kp(n) { 
        if(!['RECHARGE', 'PAY_CASH'].includes(mode)) return; inputBuffer += n;
        updateScr(`${mode}:<br><span style="color:var(--gold); font-size: 24px;">$${inputBuffer}</span>`);
    }
    function kc() { inputBuffer = ''; updateScr("CLEARED"); }

    function confirmAction() {
        if (mode === 'RECHARGE' && inputBuffer) {
            users[uIdx].bal += parseInt(inputBuffer);
            finalize("TOP-UP SUCCESS", `+$${inputBuffer}`, 0);
        } 
        else if (mode === 'PAY_CASH' && parseInt(inputBuffer) >= totalDue) {
            let change = parseInt(inputBuffer) - totalDue;
            if(currentVehicleStatus === 'WANTED') {
                finalize("SECURITY BYPASS", `$${totalDue} (CHG: $${change})`, totalDue);
            } else if (currentVehicleStatus === 'UNKNOWN') {
                finalize("ROGUE PENALTY", `$${totalDue} (CHG: $${change})`, totalDue);
            } else {
                finalize("PAID CASH", `$${totalDue} (CHG: $${change})`, totalDue);
            }
        }
        else if (mode === 'PAY_RFID' && users[uIdx].bal >= totalDue) {
            users[uIdx].bal -= totalDue;
            finalize("RFID SUCCESS", `$${totalDue}`, totalDue);
        } else if (mode === 'PAY_RFID') {
            updateScr("<span style='color:var(--error)'>LOW BALANCE</span><br>RECHARGE REQUIRED");
        }
    }

    function finalize(head, amt, tollRevenue) {
        sharedData.revenue += tollRevenue;
        
        if(tollRevenue > 0) {
            let actionType = "TOLL PAID";
            if(currentVehicleStatus === 'WANTED') actionType = "WANTED TOLL";
            if(currentVehicleStatus === 'UNKNOWN') actionType = "ROGUE TOLL";

            sharedData.history.push({
                plate: currentPlate,
                id: city,
                action: actionType,
                timestamp: new Date().toLocaleTimeString()
            });
        }

        // If UNKNOWN pays, flag them
        if(currentVehicleStatus === 'UNKNOWN' && tollRevenue > 0) {
            let rogueId = "ROGUE-" + Math.floor(1000+Math.random()*9000);
            sharedData.registry[rogueId] = {
                id: rogueId, vClass: "ROGUE_CLASS", status: "WANTED", registeredBy: "NHAI_PENALTY_SYSTEM"
            };
        }
        
        saveSharedData(); 
        syncUI(); 
        
        if(currentVehicleStatus === 'WANTED') {
            updateScr(`<span style="color:var(--error)">SECURITY LOGGED</span><br>${head}`);
        } else if (currentVehicleStatus === 'UNKNOWN') {
            updateScr(`<span style="color:var(--gold)">ROGUE WARRANT ISSUED</span><br>${head}`);
        } else {
            updateScr(`<span style="color:var(--success)">TRANSACTION OK</span><br>${head}`);
        }

        document.getElementById('rcp-head').innerText = head;
        document.getElementById('rcp-date').innerText = new Date().toLocaleString();
        document.getElementById('rcp-v').innerText = city ? `${vType} to ${city}` : "RECHARGE";
        document.getElementById('rcp-a').innerText = "AMT: " + amt;
        document.getElementById('paper').classList.add('print-active');
        
        setTimeout(() => { document.getElementById('paper').classList.remove('print-active'); resetConsole(); }, 3000);
    }

    function updateScr(txt) { document.getElementById('scr-body').innerHTML = txt; }
    function syncUI() { users.forEach((u, i) => document.getElementById('u'+i).innerText = "$"+u.bal); }
    
    function resetConsole() {
        mode = 'IDLE'; vType = ''; city = ''; totalDue = 0; inputBuffer = ''; currentVehicleStatus = 'CLEAR';
        document.getElementById('screen').className = ''; 
        updateScr("TOLL SYSTEM READY<br>SCAN VEHICLE TO BEGIN");
        for(let i=1; i<=5; i++) document.getElementById('city-'+i).disabled = true;
        document.getElementById('btn-cash').disabled = true;
        document.getElementById('btn-patrol').disabled = true;
        
        document.getElementById('db-box').innerHTML = `<div style="color:#555; font-size: 0.8rem;">NO VEHICLE DETECTED</div>`;
    }

    loadSharedData();
    setInterval(loadSharedData, 2000);
</script>

</body>
</html>
