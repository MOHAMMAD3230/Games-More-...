<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mega-Junction CTC Terminal</title>
    <style>
        body { background: #0a0a0a; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #222; padding: 10px 20px; border-bottom: 3px solid #444; display: flex; justify-content: space-between; align-items: center; }
        
        #layout-container { flex-grow: 1; overflow: auto; padding: 20px; position: relative; background: #111; }
        svg { background: #000; border: 1px solid #333; display: block; margin: auto; }

        .track { stroke: #333; stroke-width: 4; fill: none; }
        .station-area { fill: rgba(255, 255, 255, 0.05); stroke: #444; stroke-dasharray: 5; }
        .signal-base { fill: #000; stroke: #666; }
        .train { cursor: pointer; transition: transform 1.5s cubic-bezier(0.45, 0.05, 0.55, 0.95); }
        .train:hover { filter: brightness(1.5); }
        .train.selected { stroke: #fff; stroke-width: 2; }

        .ui-panel { width: 300px; background: #181818; border-left: 2px solid #444; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .main-wrapper { display: flex; flex-grow: 1; overflow: hidden; }
        
        .log { flex-grow: 1; background: #000; border: 1px solid #333; padding: 10px; font-family: monospace; font-size: 11px; color: #0f0; overflow-y: auto; }
        .btn { padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; text-transform: uppercase; }
        .btn-green { background: #2e7d32; color: white; }
        .btn-red { background: #c62828; color: white; }
        .btn-bypass { background: #f57f17; color: black; }
        
        .status-tag { padding: 2px 5px; border-radius: 3px; font-size: 10px; margin-left: 10px; }
        .tag-red { background: #900; }
        .tag-green { background: #060; }
    </style>
</head>
<body>

<header>
    <div><strong>CENTRAL DISPATCH: TERMINAL 15</strong></div>
    <div id="clock">12:00:00</div>
</header>

<div class="main-wrapper">
    <div id="layout-container">
        <svg id="yard" width="1200" height="900">
            </svg>
    </div>

    <div class="ui-panel">
        <div id="selection-info">
            <h3>No Train Selected</h3>
            <p>Click a train to issue orders.</p>
        </div>
        <hr border="1" color="#333">
        <button class="btn btn-green" onclick="moveSelected()">Advance Train</button>
        <button class="btn btn-bypass" onclick="requestBypass()">Request Red Bypass</button>
        <button class="btn btn-red" onclick="emergencyStop()">Emergency Stop (All)</button>
        
        <div class="log" id="system-log">
            > SYSTEM INITIALIZED...<br>
            > 15 LINES ONLINE...<br>
            > 10 TRAINS READY...
        </div>
    </div>
</div>

<script>
    const yard = document.getElementById('yard');
    const systemLog = document.getElementById('system-log');
    let selectedTrainId = null;

    const config = {
        lines: 15,
        trains: 10,
        blocks: 4, // Horizontal segments
        lineSpacing: 55,
        blockWidth: 280
    };

    const state = {
        signals: {}, // key: line_block, value: 'red'|'green'
        trains: {}   // key: id, value: {line, block}
    };

    // 1. GENERATE THE YARD
    function initYard() {
        for (let l = 0; l < config.lines; l++) {
            const y = 50 + (l * config.lineSpacing);
            
            // Draw Line
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", 50); line.setAttribute("y1", y);
            line.setAttribute("x2", 1150); line.setAttribute("y2", y);
            line.setAttribute("class", "track");
            yard.appendChild(line);

            // Draw Station Markers (at start and end)
            if (l % 3 === 0) {
                const station = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                station.setAttribute("x", 40); station.setAttribute("y", y - 15);
                station.setAttribute("width", 80); station.setAttribute("height", 30);
                station.setAttribute("class", "station-area");
                yard.appendChild(station);
            }

            // Draw Signals for each block
            for (let b = 1; b < config.blocks; b++) {
                const x = b * config.blockWidth;
                createSignal(l, b, x, y);
            }
        }

        // Generate 10 Trains
        for (let t = 0; t < config.trains; t++) {
            createTrain(t);
        }
    }

    function createSignal(line, block, x, y) {
        const id = `sig_${line}_${block}`;
        state.signals[id] = 'red';

        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        g.onclick = () => toggleSignal(id);
        
        const base = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        base.setAttribute("cx", x); base.setAttribute("cy", y - 15);
        base.setAttribute("r", 8); base.setAttribute("class", "signal-base");
        
        const lamp = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        lamp.setAttribute("id", id);
        lamp.setAttribute("cx", x); lamp.setAttribute("cy", y - 15);
        lamp.setAttribute("r", 5); lamp.setAttribute("fill", "red");
        
        g.appendChild(base);
        g.appendChild(lamp);
        yard.appendChild(g);
    }

    function createTrain(id) {
        const tId = `T-${id + 101}`;
        const line = id; // Start 1 train per line for the first 10
        state.trains[tId] = { line: line, block: 0, bypass: false };

        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        g.setAttribute("id", tId);
        g.setAttribute("class", "train");
        g.onclick = (e) => { e.stopPropagation(); selectTrain(tId); };

        const body = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        body.setAttribute("x", "-25"); body.setAttribute("y", "-12");
        body.setAttribute("width", "50"); body.setAttribute("height", "24");
        body.setAttribute("fill", `hsl(${id * 36}, 70%, 50%)`);
        body.setAttribute("rx", "2");

        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.textContent = tId;
        text.setAttribute("y", "4"); text.setAttribute("font-size", "10");
        text.setAttribute("text-anchor", "middle"); text.setAttribute("fill", "#000");

        g.appendChild(body);
        g.appendChild(text);
        yard.appendChild(g);
        
        updateTrainVisual(tId);
    }

    // 2. LOGIC FUNCTIONS
    function selectTrain(id) {
        if (selectedTrainId) document.getElementById(selectedTrainId).classList.remove('selected');
        selectedTrainId = id;
        document.getElementById(id).classList.add('selected');
        
        const t = state.trains[id];
        document.getElementById('selection-info').innerHTML = `
            <h3>Train ${id}</h3>
            <p>Line: ${t.line + 1} | Block: ${t.block}</p>
            <p>Bypass Auth: ${t.bypass ? '<span class="tag-green">YES</span>' : '<span class="tag-red">NO</span>'}</p>
        `;
    }

    function toggleSignal(id) {
        state.signals[id] = state.signals[id] === 'red' ? 'green' : 'red';
        document.getElementById(id).setAttribute("fill", state.signals[id] === 'green' ? "#0f0" : "red");
        log(`Signal ${id} set to ${state.signals[id].toUpperCase()}`);
    }

    function moveSelected() {
        if (!selectedTrainId) return log("Error: No train selected");
        const t = state.trains[selectedTrainId];
        const nextBlock = t.block + 1;
        const sigId = `sig_${t.line}_${nextBlock}`;

        if (nextBlock >= config.blocks) {
            t.block = 0;
            log(`${selectedTrainId} reached terminus. Returning to start.`);
        } else {
            // CHECK SIGNAL
            if (state.signals[sigId] === 'green' || t.bypass) {
                t.block = nextBlock;
                t.bypass = false; // Reset bypass after use
                log(`${selectedTrainId} advancing to Block ${t.block}`);
            } else {
                log(`STOP! ${selectedTrainId} held at Red Signal ${sigId}`);
                return;
            }
        }
        updateTrainVisual(selectedTrainId);
        selectTrain(selectedTrainId);
    }

    function requestBypass() {
        if (!selectedTrainId) return;
        state.trains[selectedTrainId].bypass = true;
        log(`AUTH: ${selectedTrainId} granted Restricted Proceed (Bypass).`);
        selectTrain(selectedTrainId);
    }

    function updateTrainVisual(id) {
        const t = state.trains[id];
        const x = 80 + (t.block * config.blockWidth);
        const y = 50 + (t.line * config.lineSpacing);
        document.getElementById(id).setAttribute("transform", `translate(${x}, ${y})`);
    }

    function log(msg) {
        const time = new Date().toLocaleTimeString();
        systemLog.innerHTML = `[${time}] > ${msg}<br>` + systemLog.innerHTML;
    }

    function emergencyStop() {
        Object.keys(state.signals).forEach(id => {
            state.signals[id] = 'red';
            document.getElementById(id).setAttribute("fill", "red");
        });
        log("!!! EMERGENCY STOP: ALL SIGNALS SET TO RED !!!");
    }

    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString();
    }, 1000);

    initYard();
</script>
</body>
</html>
