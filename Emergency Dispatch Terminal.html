<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="https://mohammad3230.github.io/PROJECT/favicon.png" type="image/png" sizes="32x32" />
<script async src="https://www.googletagmanager.com/gtag/js?id=GT-NC6T5LRJ"></script>
<script>
window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','GT-NC6T5LRJ');
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NHAI - 911 Emergency Dispatch</title>
<style>
:root{--bg:#050508;--panel:#0a0a10;--accent:#ff0044;--success:#2ed573;--danger:#ff4757;--warning:#ffa502;--border:#1a1a2e;}
body{background:var(--bg);color:#ccc;font-family:'Courier New',monospace;margin:0;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
.top-bar{background:#000;padding:12px 20px;border-bottom:2px solid var(--danger);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;flex-wrap:wrap;gap:10px;}
.top-bar h1{margin:0;font-size:.9rem;color:var(--danger);letter-spacing:1px;text-shadow:0 0 10px rgba(255,0,68,.5);}
.top-bar .time{color:var(--warning);font-size:.8rem;}
.toggle-container{display:flex;align-items:center;gap:10px;font-size:.8rem;font-weight:bold;}
.toggle-btn{width:100px;height:40px;border-radius:20px;border:2px solid #000;cursor:pointer;position:relative;transition:all .3s;box-shadow:0 3px 0 #000;}
.toggle-btn.off{background:#333;}
.toggle-btn.on{background:var(--success);box-shadow:0 0 15px rgba(46,213,115,0.5);}
.toggle-indicator{width:30px;height:30px;border-radius:50%;background:#fff;position:absolute;top:3px;left:3px;transition:all .3s;}
.toggle-btn.on .toggle-indicator{left:63px;}
.main-layout{display:grid;grid-template-columns:1fr 1.5fr;gap:20px;padding:20px;flex-grow:1;min-height:0;overflow:hidden;}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:20px;display:flex;flex-direction:column;overflow:hidden;}
.panel-title{color:var(--danger);font-size:.85rem;text-transform:uppercase;letter-spacing:1px;margin-bottom:15px;border-bottom:1px solid var(--border);padding-bottom:10px;flex-shrink:0;}
.stat-row{display:flex;gap:12px;margin-bottom:20px;flex-shrink:0;}
.stat-box{flex:1;background:#000;border:1px solid var(--border);padding:12px;border-radius:4px;text-align:center;border-top:3px solid var(--danger);}
.stat-num{font-size:1.8rem;font-weight:900;margin-bottom:3px;}
.stat-label{font-size:.65rem;color:#888;text-transform:uppercase;}
.call-box{background:#000;border:2px solid var(--border);padding:20px;border-radius:4px;text-align:center;margin-bottom:20px;flex-shrink:0;position:relative;overflow:hidden;min-height:180px;display:flex;flex-direction:column;justify-content:center;align-items:center;}
.call-box.ringing{border-color:var(--danger);animation:ringPulse 1s infinite;}
@keyframes ringPulse{0%{box-shadow:0 0 0 0 rgba(255,0,68,0.7);}70%{box-shadow:0 0 0 20px rgba(255,0,68,0);}100%{box-shadow:0 0 0 0 rgba(255,0,68,0);}}
.call-status{font-size:1.4rem;font-weight:bold;margin-bottom:10px;}
.call-status.idle{color:#555;}
.call-status.standby{color:var(--success);}
.call-status.incoming{color:var(--danger);}
.call-details{text-align:left;font-size:.85rem;line-height:1.6;margin-top:15px;background:#111;padding:15px;border-radius:4px;width:100%;box-sizing:border-box;}
.mech-btn{width:100%;padding:14px;border:2px solid #000;cursor:pointer;font-weight:bold;text-transform:uppercase;font-size:.8rem;box-shadow:0 3px 0 #000;transition:all .1s;font-family:monospace;border-radius:4px;margin-bottom:10px;flex-shrink:0;}
.mech-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #000;}
.mech-btn:disabled{opacity:.3;cursor:not-allowed;transform:none;box-shadow:none;}
.btn-answer{background:var(--danger);color:#fff;}
.btn-dispatch{background:var(--warning);color:#000;}
.btn-dismiss{background:#333;color:#fff;}
.log-list{flex-grow:1;overflow-y:auto;padding-right:5px;min-height:0;}
.log-item{background:#000;border:1px solid var(--border);padding:12px;margin-bottom:8px;border-left:4px solid var(--danger);border-radius:4px;font-size:.8rem;}
.log-item.prank{border-left-color:#555;opacity:.6;}
.log-item.resolved{border-left-color:var(--success);}
.plate-tag{color:var(--warning);font-weight:bold;font-size:1rem;}
.meta-tag{color:#555;font-size:.7rem;margin-top:4px;}
.log-list::-webkit-scrollbar{width:6px;}
.log-list::-webkit-scrollbar-track{background:#000;border:1px solid var(--border);}
.log-list::-webkit-scrollbar-thumb{background:var(--danger);}
@media(max-width:1024px){.main-layout{grid-template-columns:1fr;overflow-y:auto;}}
@media(max-width:600px){.top-bar h1{font-size:.7rem;}.call-details{font-size:.75rem;}.stat-num{font-size:1.4rem;}.toggle-btn{width:80px;height:35px;}.toggle-indicator{width:25px;height:25px;}.toggle-btn.on .toggle-indicator{left:49px;}}
</style>
</head>
<body>
<div class="top-bar">
<h1>▸ NHAI_911 // EMERGENCY_DISPATCH_v16.0</h1>
<div class="toggle-container">
<span id="toggle-label" style="color:var(--danger)">SYSTEM OFF</span>
<button class="toggle-btn off" id="system-toggle" onclick="toggleSystem()">
<div class="toggle-indicator"></div>
</button>
</div>
<div class="time" id="clock">00:00:00</div>
</div>
<div class="main-layout">
<div class="panel">
<div class="panel-title">■ Incoming Emergency Lines</div>
<div class="stat-row">
<div class="stat-box"><div class="stat-num" style="color:var(--danger)" id="stat-active">0</div><div class="stat-label">Active Calls</div></div>
<div class="stat-box"><div class="stat-num" style="color:var(--success)" id="stat-resolved">0</div><div class="stat-label">Dispatched</div></div>
<div class="stat-box"><div class="stat-num" style="color:#555" id="stat-prank">0</div><div class="stat-label">Pranks</div></div>
</div>
<div class="call-box" id="call-box">
<div class="call-status idle" id="call-status">SYSTEM OFFLINE</div>
<div style="font-size:.7rem;color:#555;">Toggle system ON to receive 911 signals</div>
</div>
<button class="mech-btn btn-answer" id="btn-answer" onclick="answerCall()" disabled>ANSWER CALL</button>
<button class="mech-btn btn-dispatch" id="btn-dispatch" onclick="dispatchUnit()" disabled>DISPATCH UNIT</button>
<button class="mech-btn btn-dismiss" id="btn-dismiss" onclick="dismissCall()" disabled>DISMISS (PRANK)</button>
</div>
<div class="panel">
<div class="panel-title">■ Call Logs & Radio Traffic</div>
<div class="log-list" id="log-list">
<div style="color:#555;text-align:center;padding:40px;">NO EMERGENCY LOGS</div>
</div>
</div>
</div>
<script>
let sharedData={revenue:0,valids:0,missed:0,level:1,rankPoints:0,history:[],registry:{},forgedAliases:{},nextSpawnOverride:null,activeInmates:[],releasedInmates:[],ledgerCashouts:[],intelFlags:[],paroleRecords:[],iaViolations:[],rehabPrograms:[],call911Logs:[]};

let currentCall=null;
let systemOnline=false;
let autoCallTimer=null;

const prefixes=["PX","NX","TX","DV","CR","XR","ZK","AV","BN"];
const incidents=[
{desc:"Reckless driving on Highway 10. Vehicle swerving across lanes.",severity:"HIGH"},
{desc:"Suspected forged ID at toll booth. Driver acting aggressive.",severity:"HIGH"},
{desc:"Hit and run reported near Nashik exit. Damaged rear bumper.",severity:"MEDIUM"},
{desc:"Unregistered vehicle parked in restricted government zone.",severity:"MEDIUM"},
{desc:"Driver abandoned vehicle after being flagged by scanner.",severity:"CRITICAL"},
{desc:"Suspected syndicate meetup at rest stop. Multiple rogue plates.",severity:"CRITICAL"}
];

const audioCtx=new(window.AudioContext||window.webkitAudioContext)();

function updateClock(){document.getElementById('clock').innerText=new Date().toLocaleTimeString('en-GB');}
setInterval(updateClock,1000);

function loadData(){
    const s=localStorage.getItem('enforcementTerminalV23');
    if(s){
        try{
            const p=JSON.parse(s);sharedData=p;
            if(!sharedData.registry)sharedData.registry={};
            if(!sharedData.forgedAliases)sharedData.forgedAliases={};
            if(sharedData.nextSpawnOverride===undefined)sharedData.nextSpawnOverride=null;
            if(!sharedData.activeInmates)sharedData.activeInmates=[];
            if(!sharedData.releasedInmates)sharedData.releasedInmates=[];
            if(!sharedData.ledgerCashouts)sharedData.ledgerCashouts=[];
            if(!sharedData.intelFlags)sharedData.intelFlags=[];
            if(!sharedData.paroleRecords)sharedData.paroleRecords=[];
            if(!sharedData.iaViolations)sharedData.iaViolations=[];
            if(!sharedData.rehabPrograms)sharedData.rehabPrograms=[];
            if(!sharedData.call911Logs)sharedData.call911Logs=[];
        }catch(e){}
    }
    renderLogs();updateStats();
}

function saveData(){localStorage.setItem('enforcementTerminalV23',JSON.stringify(sharedData));}

function updateStats(){
    const logs=sharedData.call911Logs||[];
    document.getElementById('stat-active').innerText=logs.filter(l=>l.status==='ACTIVE').length;
    document.getElementById('stat-resolved').innerText=logs.filter(l=>l.status==='DISPATCHED').length;
    document.getElementById('stat-prank').innerText=logs.filter(l=>l.status==='PRANK').length;
}

function toggleSystem(){
    if(audioCtx.state==='suspended')audioCtx.resume();
    systemOnline=!systemOnline;
    const btn=document.getElementById('system-toggle');
    const label=document.getElementById('toggle-label');
    
    if(systemOnline){
        btn.className='toggle-btn on';
        label.innerText='SYSTEM ON';
        label.style.color='var(--success)';
        playSound('online');
        scheduleNextCall();
        document.getElementById('call-status').innerText='⚡ STANDBY';
        document.getElementById('call-status').className='call-status standby';
        document.getElementById('call-box').innerHTML='<div class="call-status standby" id="call-status">⚡ STANDBY</div><div style="font-size:.7rem;color:var(--success);">System online. Awaiting incoming 911 signals...</div>';
    }else{
        btn.className='toggle-btn off';
        label.innerText='SYSTEM OFF';
        label.style.color='var(--danger)';
        playSound('offline');
        if(autoCallTimer)clearTimeout(autoCallTimer);
        clearCallUI(true);
        document.getElementById('call-box').innerHTML='<div class="call-status idle" id="call-status">SYSTEM OFFLINE</div><div style="font-size:.7rem;color:#555;">Toggle system ON to receive 911 signals</div>';
    }
}

function scheduleNextCall(){
    if(!systemOnline)return;
    const delay=(15+Math.floor(Math.random()*30))*1000; // 15 to 45 seconds
    autoCallTimer=setTimeout(()=>{
        if(systemOnline&&!currentCall){
            simulateIncomingCall();
        }else{
            scheduleNextCall();
        }
    },delay);
}

function simulateIncomingCall(){
    if(currentCall)return;
    const plate=prefixes[Math.floor(Math.random()*prefixes.length)]+"-"+Math.floor(1000+Math.random()*9000);
    const incident=incidents[Math.floor(Math.random()*incidents.length)];
    
    currentCall={
        id:"911-"+Math.floor(100+Math.random()*900),
        plate:plate,
        description:incident.desc,
        severity:incident.severity,
        time:new Date().toLocaleTimeString(),
        isPrank:Math.random()<0.15
    };

    const box=document.getElementById('call-box');
    box.className='call-box ringing';
    box.innerHTML=`
        <div class="call-status incoming" id="call-status">⚠ INCOMING 911 CALL</div>
        <div style="font-size:.7rem;color:var(--danger);animation:ringPulse 1s infinite;">CALL ID: ${currentCall.id}</div>
    `;
    
    document.getElementById('btn-answer').disabled=false;
    document.getElementById('btn-dismiss').disabled=true;
    document.getElementById('btn-dispatch').disabled=true;

    playRingSound();
}

function answerCall(){
    if(!currentCall)return;
    stopRingSound();
    playSound('answer');

    const box=document.getElementById('call-box');
    box.className='call-box';
    box.innerHTML=`
        <div class="call-status" style="color:var(--success)">CALL CONNECTED</div>
        <div class="call-details">
            <div style="color:var(--danger);font-weight:bold;margin-bottom:8px;">CALL ID: ${currentCall.id} | SEVERITY: <span style="color:${currentCall.severity==='CRITICAL'?'var(--danger)':'var(--warning)'}">${currentCall.severity}</span></div>
            <div><span style="color:#888;">REPORTED PLATE:</span> <span style="color:var(--warning);font-weight:bold;font-size:1.1rem;">${currentCall.plate}</span></div>
            <div style="margin-top:8px;color:#ccc;">"${currentCall.description}"</div>
        </div>
    `;

    document.getElementById('btn-answer').disabled=true;
    document.getElementById('btn-dispatch').disabled=false;
    document.getElementById('btn-dismiss').disabled=false;
}

function dispatchUnit(){
    if(!currentCall)return;
    stopRingSound();
    playSound('dispatch');

    sharedData.registry[currentCall.plate]={
        id:"911_REPORT",vClass:"LVM_CLASS_1",status:"WANTED",registeredBy:"911_OPERATOR"
    };

    sharedData.nextSpawnOverride=currentCall.plate;

    sharedData.history.push({
        plate:currentCall.plate,id:currentCall.id,action:"911 REPORT FILED",timestamp:new Date().toLocaleTimeString()
    });

    sharedData.call911Logs.push({...currentCall,status:"DISPATCHED",resolvedTime:new Date().toLocaleTimeString()});

    saveData();
    clearCallUI();
    renderLogs();
    updateStats();
    scheduleNextCall();
}

function dismissCall(){
    if(!currentCall)return;
    stopRingSound();
    playSound('dismiss');

    sharedData.call911Logs.push({...currentCall,status:currentCall.isPrank?"PRANK":"DISMISSED",resolvedTime:new Date().toLocaleTimeString()});
    saveData();
    clearCallUI();
    renderLogs();
    updateStats();
    scheduleNextCall();
}

function clearCallUI(offline=false){
    stopRingSound();
    currentCall=null;
    if(!offline&&systemOnline){
        document.getElementById('call-box').className='call-box';
        document.getElementById('call-box').innerHTML='<div class="call-status standby">⚡ STANDBY</div><div style="font-size:.7rem;color:var(--success);">System online. Awaiting incoming 911 signals...</div>';
    }
    document.getElementById('btn-answer').disabled=true;
    document.getElementById('btn-dispatch').disabled=true;
    document.getElementById('btn-dismiss').disabled=true;
}

function renderLogs(){
    const list=document.getElementById('log-list');list.innerHTML='';
    const logs=(sharedData.call911Logs||[]).slice(-20).reverse();
    if(logs.length===0){list.innerHTML='<div style="color:#555;text-align:center;padding:40px;">NO EMERGENCY LOGS</div>';return;}
    logs.forEach(log=>{
        const item=document.createElement('div');
        let cssClass='log-item';
        if(log.status==='PRANK')cssClass+=' prank';
        if(log.status==='DISPATCHED')cssClass+=' resolved';
        item.className=cssClass;
        item.innerHTML=`
            <div style="display:flex;justify-content:space-between;align-items:center;">
                <span class="plate-tag">${log.plate}</span>
                <span style="font-size:.65rem;color:${log.severity==='CRITICAL'?'var(--danger)':'var(--warning)'}">${log.severity}</span>
            </div>
            <div class="meta-tag" style="color:${log.status==='DISPATCHED'?'var(--success)':log.status==='PRANK'?'#555':'var(--danger)'}">
                Status: ${log.status} | Call ID: ${log.id} @ ${log.time}
            </div>
            <div style="font-size:.7rem;margin-top:4px;color:#888;">${log.description}</div>
        `;
        list.appendChild(item);
    });
}

function playSound(type){
    if(audioCtx.state==='suspended')audioCtx.resume();
    const osc=audioCtx.createOscillator();const gain=audioCtx.createGain();
    osc.connect(gain);gain.connect(audioCtx.destination);const t=audioCtx.currentTime;
    switch(type){
        case'online':osc.type='sine';osc.frequency.setValueAtTime(800,t);osc.frequency.setValueAtTime(1200,t+0.1);gain.gain.setValueAtTime(0.2,t);gain.gain.exponentialRampToValueAtTime(0.01,t+0.2);osc.start(t);osc.stop(t+0.2);break;
        case'offline':osc.type='sine';osc.frequency.setValueAtTime(1200,t);osc.frequency.setValueAtTime(400,t+0.2);gain.gain.setValueAtTime(0.2,t);gain.gain.exponentialRampToValueAtTime(0.01,t+0.3);osc.start(t);osc.stop(t+0.3);break;
        case'answer':osc.type='sine';osc.frequency.setValueAtTime(600,t);osc.frequency.setValueAtTime(900,t+0.1);gain.gain.setValueAtTime(0.2,t);gain.gain.exponentialRampToValueAtTime(0.01,t+0.2);osc.start(t);osc.stop(t+0.2);break;
        case'dispatch':osc.type='sawtooth';osc.frequency.setValueAtTime(300,t);osc.frequency.setValueAtTime(600,t+0.1);osc.frequency.setValueAtTime(900,t+0.2);gain.gain.setValueAtTime(0.3,t);gain.gain.exponentialRampToValueAtTime(0.01,t+0.3);osc.start(t);osc.stop(t+0.3);break;
        case'dismiss':osc.type='triangle';osc.frequency.setValueAtTime(400,t);osc.frequency.exponentialRampToValueAtTime(100,t+0.2);gain.gain.setValueAtTime(0.2,t);gain.gain.exponentialRampToValueAtTime(0.01,t+0.2);osc.start(t);osc.stop(t+0.2);break;
    }
}

let ringInterval=null;
function playRingSound(){
    if(ringInterval)return;let isHigh=false;
    ringInterval=setInterval(()=>{
        if(audioCtx.state==='suspended')audioCtx.resume();
        const osc=audioCtx.createOscillator();const gain=audioCtx.createGain();
        osc.connect(gain);gain.connect(audioCtx.destination);osc.type='sine';
        isHigh=!isHigh;osc.frequency.setValueAtTime(isHigh?800:600,audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.3);
        osc.start(audioCtx.currentTime);osc.stop(audioCtx.currentTime+0.3);
    },400);
}

function stopRingSound(){if(ringInterval){clearInterval(ringInterval);ringInterval=null;}}

loadData();
setInterval(loadData,2000);
</script>
</body>
</html>
